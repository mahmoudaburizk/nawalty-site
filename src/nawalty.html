  const actionLabel = a => a.method==='POST' ? 'إضافة' : a.method==='PUT' ? 'تعديل' : a.method==='DELETE' ? 'حذف' : a.method==='SEASON' ? 'قفل موسم' : a.method;
  const describe = a => {
    const pick = o => o ? (o.name || o.type || o.lender || (o.amount!==undefined ? 'مبلغ '+fmtNum(o.amount) : '') || (o.kuz!==undefined ? fmtNum(o.kuz)+' كوز' : '') || (o.quantity!==undefined ? fmtNum(o.quantity) : '') || (o.pieces!==undefined ? fmtNum(o.pieces)+' قطعة' : '') || '') : '';
    const date = o => o && (o.entry_date || o.pay_date || o.expense_date || o.tx_date || o.debt_date || o.move_date);
    const b = a.before, f = a.after;
    if(a.method==='PUT' && b && f){
      const changes = Object.keys(f).filter(k=>!['id','entries','payments','weeklyPrices'].includes(k) && typeof f[k] !== 'object' && String(b[k]??'')!==String(f[k]??'')).map(k=>`${k}: ${b[k]??'—'} ← ${f[k]??'—'}`);
      return changes.slice(0,4).join(' · ') || pick(f);
    }
    return [pick(f||b), date(f||b) ? formatDateShort(date(f||b)) : ''].filter(Boolean).join(' · ');
  };
  const shown = audit.filter(a=>!auditFilter || a.section===auditFilter);
  const sectionsInLog = Array.from(new Set(audit.map(a=>a.section))).filter(Boolean);

  return (
    <div className="p-4 md:p-8 space-y-5 max-w-3xl mx-auto">
      <h1 className="hidden md:flex font-display text-3xl text-leaf-deep items-center gap-2"><Icon name="gear" className="w-7 h-7"/>الإعدادات والنسخ الاحتياطي</h1>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-1">النسخة الاحتياطية</h3>
        <p className="text-sm text-ink/75 mb-3">{LOCAL_MODE ? 'البيانات متخزنة في المتصفح ده بس. نزّل نسخة كل أسبوع واحفظها على درايف أو ابعتها لنفسك على واتساب.' : 'البيانات على السيرفر. النسخة هنا بتنزّل الإعدادات المحلية بس.'}</p>
        <p className="text-xs text-ink/65 mb-3">آخر نسخة: {last ? formatDateShort(last) : 'لسه ما اتنزلتش'}</p>
        <div className="flex gap-2 flex-wrap">
          <button onClick={()=>{ downloadBackup(); notify('اتنزّلت النسخة'); }} className="bg-leaf-deep text-cream rounded-xl px-5 py-2.5 text-sm font-bold flex items-center gap-2"><Icon name="download" className="w-4 h-4"/>نزّل نسخة احتياطية</button>
          <button onClick={()=>fileRef.current && fileRef.current.click()} className="border border-leaf-line text-leaf-deep rounded-xl px-5 py-2.5 text-sm font-bold">استرجع من نسخة</button>
          <input ref={fileRef} type="file" accept=".json,application/json" onChange={importFile} className="hidden"/>
        </div>
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-1">البيانات التجريبية</h3>
        {isDemo() ? (<>
          <p className="text-sm text-ink/75 mb-3">إنت دلوقتي شغال على بيانات تجريبية. لما تخلص تجربة، امسحها وابدأ بنوالتك.</p>
          <button onClick={async()=>{ if(!(await askConfirm('مسح البيانات التجريبية والبدء من الأول؟', {confirmText:'امسحها'}))) return; const rm=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('nawalty_') && k!=='nawalty_pin') rm.push(k); } rm.forEach(k=>localStorage.removeItem(k)); location.reload(); }} className="bg-ink text-cream rounded-xl px-5 py-2.5 text-sm font-bold">امسح البيانات التجريبية وابدأ</button>
        </>) : (<>
          <p className="text-sm text-ink/75 mb-3">حمّل موسم تجريبي (٦ أسابيع) عشان تشوف كل الشاشات شغالة. بياناتك الحالية هتنزل نسخة احتياطية منها الأول.</p>
          <button onClick={async()=>{ if(!(await askConfirm('تحميل البيانات التجريبية؟\nبياناتك الحالية هتتشال من الجهاز (هننزّل نسخة احتياطية منها الأول، وتقدر ترجعها من «استرجع من نسخة»).', {danger:true, confirmText:'حمّل التجريبي'}))) return; if(hasAnyData()) downloadBackup('قبل-التجريبي-'+todayStr()); loadDemoData(); setTimeout(()=>location.reload(), 600); }} className="border border-gold/60 text-gold-dark rounded-xl px-5 py-2.5 text-sm font-bold">حمّل بيانات تجريبية</button>
        </>)}
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-1">قفل الموسم وبدء موسم جديد</h3>
        <p className="text-sm text-ink/75 mb-3">في آخر الموسم: بيحفظ أرشيف كامل، ويرحّل الأرصدة المفتوحة، ويفضّي الموسم الجديد.</p>
        <div className="flex gap-2 flex-wrap">
          <input value={seasonName} onChange={e=>setSeasonName(e.target.value)} placeholder={'اسم الموسم (مثال: موسم '+todayStr().slice(0,4)+')'} className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm flex-1 min-w-[200px]"/>
          <button onClick={closeSeason} className="bg-gold text-white rounded-xl px-5 py-2.5 text-sm font-bold">اقفل الموسم</button>
        </div>
        {seasons.length>0 && (
          <div className="mt-4 overflow-x-auto"><table className="w-full text-sm">
            <thead><tr className="text-xs text-ink/70"><th className="text-right py-1.5">الموسم</th><th className="text-right py-1.5">اتقفل</th><th className="text-right py-1.5">المبيعات</th><th className="text-right py-1.5">الربح</th><th className="text-right py-1.5">السيولة في الآخر</th></tr></thead>
            <tbody>{seasons.slice().reverse().map((s,i)=><tr key={i} className="border-t border-leaf-line/20"><td className="py-1.5 font-bold">{s.name}</td><td className="py-1.5">{formatDateShort(s.closedAt)}</td><td className="py-1.5 num">{num(s.sales)}</td><td className="py-1.5 num">{num(s.profit)}</td><td className="py-1.5 num">{num(s.cash)}</td></tr>)}</tbody>
          </table></div>
        )}
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-1">رقم واتساب صاحب النوالة</h3>
        <p className="text-sm text-ink/75 mb-3">ملخص الأسبوع من الرئيسية بيتبعت على الرقم ده.</p>
        <div className="flex gap-2 flex-wrap">
          <input value={phone} onChange={e=>setPhone(e.target.value)} dir="ltr" placeholder="2010xxxxxxxx" className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm num w-48"/>
          <button onClick={async()=>{ try{ const u = await apiFetch('/api/nawala', {method:'PUT', body:JSON.stringify({owner_phone: phone.trim()})}); setUser({...user, ...u}); notify('اتحفظ الرقم'); }catch(e){ notify(e.message, {tone:'error'}); } }} className="bg-leaf-deep text-cream rounded-xl px-4 py-2.5 text-sm font-bold">حفظ</button>
        </div>
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-1">الرقم السري</h3>
        <p className="text-sm text-ink/75 mb-3">{hasPin ? 'فيه رقم سري. التطبيق بيتقفل لوحده بعد ١٥ دقيقة من غير استخدام.' : 'من غير رقم سري، أي حد يمسك الموبايل يقدر يشوف الحسابات.'}</p>
        <div className="flex gap-2 flex-wrap items-center">
          <input type="password" inputMode="numeric" maxLength={4} value={pin1} onChange={e=>setPin1(e.target.value.replace(/\D/g,''))} placeholder="٤ أرقام" className="w-28 rounded-xl border border-leaf-line px-3 py-2.5 text-center num" aria-label="الرقم السري الجديد"/>
          <input type="password" inputMode="numeric" maxLength={4} value={pin2} onChange={e=>setPin2(e.target.value.replace(/\D/g,''))} placeholder="أكّده" className="w-28 rounded-xl border border-leaf-line px-3 py-2.5 text-center num" aria-label="تأكيد الرقم السري"/>
          <button onClick={savePin} className="bg-leaf-deep text-cream rounded-xl px-4 py-2.5 text-sm font-bold">{hasPin?'غيّر الرقم':'حط رقم سري'}</button>
          {hasPin && <button onClick={removePin} className="text-rust text-sm px-3 py-2.5">شيل الرقم السري</button>}
        </div>
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-1">سجل التعديلات</h3>
        <p className="text-sm text-ink/75 mb-3">كل إضافة وتعديل وحذف بيتسجل هنا بالوقت — مفيد لو حد اعترض على رقم.</p>
        <div className="flex gap-2 flex-wrap mb-3">
          <select value={auditFilter} onChange={e=>setAuditFilter(e.target.value)} className="rounded-xl border border-leaf-line px-3 py-2 text-sm" aria-label="فلترة القسم">
            <option value="">كل الأقسام</option>{sectionsInLog.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <button onClick={()=>setAudit(auditRead().slice(0,150))} className="text-xs border border-leaf-line rounded-xl px-3 py-2">تحديث</button>
        </div>
        <div className="max-h-96 overflow-y-auto divide-y divide-leaf-line/20 text-sm">
          {shown.length===0 && <p className="text-ink/60 py-4 text-center">مفيش تعديلات متسجلة</p>}
          {shown.map(a=>(
            <div key={a.id} className="py-2 flex items-start justify-between gap-3">
              <div className="min-w-0">
                <span className={`text-xs font-bold px-1.5 py-0.5 rounded-md ml-1 ${a.method==='DELETE'?'bg-rust/10 text-rust':a.method==='PUT'?'bg-gold/15 text-gold-dark':'bg-leaf-pale text-leaf-mid'}`}>{actionLabel(a)}</span>
                <b>{a.section}</b>{a.owner ? ' — '+a.owner : ''}
                <div className="text-xs text-ink/70 break-words">{describe(a)}</div>
              </div>
              <span className="text-xs text-ink/60 shrink-0">{new Date(a.at).toLocaleString('ar-EG-u-nu-latn', {day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
            </div>
          ))}
        </div>
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-1">ربط بسيرفر (اختياري)</h3>
        <p className="text-sm text-ink/75 mb-3">لو عندك سيرفر لنوالتي حط رابطه هنا. سيبه فاضي عشان التطبيق يشتغل على الجهاز ده.</p>
        <div className="flex gap-2 flex-wrap">
          <input value={api} onChange={e=>setApi(e.target.value)} dir="ltr" placeholder="https://..." className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm flex-1 min-w-[220px]"/>
          <button onClick={saveApi} className="border border-leaf-line text-leaf-deep rounded-xl px-4 py-2.5 text-sm font-bold">حفظ</button>
        </div>
      </div>

      <div className="bg-rust/5 rounded-3xl border border-rust/30 p-5 md:p-6">
        <h3 className="font-bold text-rust mb-1">مسح كل البيانات</h3>
        <p className="text-sm text-ink/75 mb-3">بينزّل نسخة احتياطية الأول، وبعدين يمسح كل حاجة من الجهاز ده.</p>
        <button onClick={wipeAll} className="bg-rust text-white rounded-xl px-5 py-2.5 text-sm font-bold flex items-center gap-2"><Icon name="trash" className="w-4 h-4"/>امسح كل البيانات</button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- APP ---------------------------------------------------------- */
function App(){
  const [user,setUser] = useState(null);
  const [checking,setChecking] = useState(true);
  const [page,setPage] = useState('dashboard');
  const [db,setDb] = useState(emptyDB());
  const [mobileOpen,setMobileOpen] = useState(false);
  const [locked,setLocked] = useState(()=>!!localStorage.getItem('nawalty_pin'));
  const [pricesReady,setPricesReady] = useState(false);
  const [pricesError,setPricesError] = useState('');

  useEffect(()=>{
    (async ()=>{
      if(LOCAL_MODE){ runLocalMigrations(); setUser(await apiFetch('/api/me')); setChecking(false); return; }
      if(!getToken()){ setChecking(false); return; }
      try{ setUser(await apiFetch('/api/me')); }catch(e){ setToken(null); }
      setChecking(false);
    })();
  }, []);
  async function loadPrices(){
    setPricesError('');
    try{ const t = await loadPriceTables(); setDb(prev=>({...prev, ...t})); setPricesReady(true); }catch(e){ setPricesError(e.message); }
  }
  useEffect(()=>{ if(user && user.name) loadPrices(); }, [user && user.name]);
  // قفل تلقائي بعد ١٥ دقيقة من غير استخدام
  useEffect(()=>{
    if(!localStorage.getItem('nawalty_pin')) return;
    let t; const reset = ()=>{ clearTimeout(t); t = setTimeout(()=>{ if(localStorage.getItem('nawalty_pin')) setLocked(true); }, 15*60*1000); };
    ['click','keydown','touchstart'].forEach(ev=>window.addEventListener(ev, reset)); reset();
    return ()=>{ clearTimeout(t); ['click','keydown','touchstart'].forEach(ev=>window.removeEventListener(ev, reset)); };
  }, [locked]);

  const shell = c => <>{c}<Toaster/><ConfirmHost/></>;
  if(checking) return shell(<LoadingBox text="لحظة..."/>);
  if(locked && localStorage.getItem('nawalty_pin')) return shell(<LockScreen name={user && user.name} onUnlock={()=>setLocked(false)}/>);
  if(!LOCAL_MODE && !user) return shell(<Login onLogin={setUser}/>);
  if(LOCAL_MODE && (!user || !user.name)) return shell(<Onboarding onDone={setUser}/>);
  if(!pricesReady) return shell(
    <div className="min-h-screen flex flex-col items-center justify-center gap-3 text-ink/65">
      {pricesError ? (<><p className="text-rust">ماقدرناش نحمّل الأسعار: {pricesError}</p><button onClick={loadPrices} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep">حاول تاني</button></>) : 'بيحمّل التسعير...'}
    </div>
  );
  const titleMap = Object.fromEntries(NAV.map(n=>[n.key,n.label]));
  const props = { db, setDb };
  let content;
  if(page==='dashboard') content = <Dashboard db={db} user={user} setUser={setUser} setPage={setPage}/>;
  else if(page==='sales') content = <SalesPage {...props}/>;
  else if(page==='jalaba') content = <JalabaPage {...props}/>;
  else if(page==='raseef') content = <RaseefPage {...props}/>;
  else if(page==='workers') content = <WorkersPage {...props}/>;
  else if(page==='sakina') content = <SakinaPage {...props}/>;
  else if(page==='takhrit') content = <TakhritPage {...props}/>;
  else if(page==='expenses') content = <ExpensesPage {...props}/>;
  else if(page==='debts') content = <DebtsPage/>;
  else if(page==='equipment') content = <EquipmentPage/>;
  else if(page==='pricing') content = <PricingPage {...props}/>;
  else if(page==='settings') content = <SettingsPage db={db} user={user} setUser={setUser}/>;
  const hasPin = !!localStorage.getItem('nawalty_pin');
  return shell(
    <div className="min-h-screen flex flex-row-reverse">
      <Sidebar page={page} setPage={setPage} user={user.name} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}
        onLock={hasPin ? ()=>setLocked(true) : null}
        onLogout={!LOCAL_MODE ? ()=>{ setToken(null); setUser(null); setDb(emptyDB()); setPage('dashboard'); } : null}/>
      <main className="flex-1 min-w-0 pb-24 md:pb-0">
        <Topbar title={titleMap[page]} setMobileOpen={setMobileOpen} setPage={setPage}/>
        <div key={page}>{content}</div>
      </main>
      <BottomNav page={page} setPage={setPage} setMobileOpen={setMobileOpen}/>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError:false, error:null }; }
  static getDerivedStateFromError(error){ return { hasError:true, error }; }
  componentDidCatch(error, info){ console.error(error, info); }
  render(){
    if(this.state.hasError){
      return (
        <div className="min-h-screen flex items-center justify-center p-6 bg-cream text-ink text-center">
          <div className="bg-white p-8 rounded-2xl shadow-card border border-leaf-line/40 max-w-md">
            <h2 className="text-xl font-bold text-rust mb-2">حصل خطأ أثناء تشغيل التطبيق</h2>
            <p className="text-sm text-ink/70 mb-4">{this.state.error?.message || 'خطأ غير معروف'}</p>
            <div className="flex gap-2 justify-center flex-wrap">
              <button onClick={()=>window.location.reload()} className="bg-leaf-deep text-cream px-4 py-2 rounded-lg font-bold">إعادة تحميل</button>
              <button onClick={()=>downloadBackup('طوارئ-'+todayStr())} className="border border-leaf-line px-4 py-2 rounded-lg font-bold text-leaf-deep">نزّل نسخة من البيانات</button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);

</script>
</body>
</html>
