    case "search": return <svg viewBox="0 0 24 24" className={className} {...p}><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>;
    case "dots": return <svg viewBox="0 0 24 24" className={className} {...p}><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>;
    default: return null;

}

function ArtichokeMark({className="w-16 h-16"}){
  const rows = [
    {cy:80, rx:32, ry:9,  n:9, len:32, wid:13, tone:'#33562F'},
    {cy:66, rx:27, ry:8,  n:8, len:28, wid:12, tone:'#3D6144'},
    {cy:52, rx:21, ry:7,  n:7, len:24, wid:11, tone:'#4C7A4E'},
    {cy:39, rx:15, ry:5.5,n:6, len:19, wid:9,  tone:'#5C8B54'},
    {cy:28, rx:8,  ry:3.5,n:5, len:14, wid:7,  tone:'#78A05A'},
  ];
  const petals = [];
  rows.forEach((row,ri)=>{
    for(let i=0;i<row.n;i++){
      const t = (i + (ri%2?0.5:0)) / row.n;
      const angle = t*360;
      const rad = angle*Math.PI/180;
      const cx = 50 + Math.cos(rad)*row.rx;
      const cy = row.cy + Math.sin(rad)*row.ry;
      const rot = angle+90;
      const w = row.wid/2;
      const l = row.len;
      petals.push(
        <path key={ri+'-'+i}
          d={`M0 0 C ${-w} ${-l*0.35} ${-w} ${-l*0.75} 0 ${-l} C ${w} ${-l*0.75} ${w} ${-l*0.35} 0 0 Z`}
          transform={`translate(${cx} ${cy}) rotate(${rot})`}
          fill={row.tone} stroke="#1F3524" strokeWidth="0.6" strokeOpacity="0.5"/>
      );
    }
  });
  return (
    <svg viewBox="0 0 100 100" className={className}>
      <path d="M46 89 Q50 98 54 89" stroke="#6B4A24" strokeWidth="3.5" fill="none" strokeLinecap="round"/>
      {petals}
      <ellipse cx="50" cy="21" rx="5" ry="7" fill="#8FB56C"/>
    </svg>
  );
}


/* ---------------------------------------------------------- التخزين والاتصال ---------------------------------------------------------- */
// السيرفر اختياري: لو اتحط رابطه من «الإعدادات» التطبيق بيشتغل عليه، وإلا بيشتغل محلي على الجهاز
let API_BASE = (()=>{ try{ return localStorage.getItem('nawalty_api_base') || ''; }catch(e){ return ''; } })();
let LOCAL_MODE = !API_BASE;

function getToken(){ return localStorage.getItem('nawalty_token'); }
function setToken(t){ if(t) localStorage.setItem('nawalty_token', t); else localStorage.removeItem('nawalty_token'); }

function localStoreGet(key, def=[]){
  try {
    const d = localStorage.getItem('nawalty_db_' + key);
    return d ? JSON.parse(d) : def;
  } catch(e) { return def; }
}
function localStoreSet(key, val){
  try { localStorage.setItem('nawalty_db_' + key, JSON.stringify(val)); }
  catch(e){
    // المساحة خلصت: نبلغ بدل ما البيانات تضيع من غير ما حد يعرف
    notify('مساحة التخزين في المتصفح خلصت — البيانات دي ماتحفظتش. نزّل نسخة احتياطية واقفل الموسم من «الإعدادات».', {tone:'error', duration:15000});
    throw new Error('مساحة التخزين خلصت');
  }
}

/* ---------- سجل التعديلات ---------- */
const AUDIT_KEY = 'nawalty_audit';
function auditRead(){ try{ return JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]'); }catch(e){ return []; } }
function auditAdd(entry){
  try{
    const list = auditRead();
    list.unshift({ id: uid(), at: new Date().toISOString(), ...entry });
    localStorage.setItem(AUDIT_KEY, JSON.stringify(list.slice(0, 3000)));
  }catch(e){ /* السجل مش أساسي */ }
}
const AUDIT_SECTION_NAMES = {
  'jalaba':'الجلابة','factories':'المبيعات','raseef':'المشتريات','sakinas':'النوالات','sakina-workers':'عاملات النوالة','sakina-worker':'عاملات النوالة',
  'takhrit-fixed':'التخريط','banadeer':'البنادير','workers':'أنفار النوالة','worker':'أنفار النوالة','transport':'العربيات','transport-routes':'المشاوير الثابتة',
  'expenses':'المصاريف','debts':'المديونات','equipment':'العدة','partners-list':'الشركاء','partner-transactions':'الشركاء','prices':'التسعير','nawala':'بيانات النوالة',
};
function auditSectionOf(path){
  const seg = path.replace(/^\/api\//,'').split('/')[0].replace(/-(entries|payments|factory-movements|other)$/,'');
  return AUDIT_SECTION_NAMES[seg] || seg;
}

/* ---------- الوضع المحلي ---------- */
function allLocalListKeys(){
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('nawalty_db_') && k !== 'nawalty_db_user' && k !== 'nawalty_db_prices') keys.push(k.replace('nawalty_db_',''));
  }
  return keys;
}
function localKeysFor(mainKey){
  if(mainKey === 'sakina-workers') return allLocalListKeys().filter(k=>k.startsWith('sakina_workers_'));
  return [mainKey];
}
function localMutateNested(subKey, itemId, method, body){
  for(const key of allLocalListKeys()){
    const list = localStoreGet(key, []);
    if(!Array.isArray(list)) continue;
    let found = null, before = null, ownerName = '';
    const next = list.map(p=>{
      const sub = p && Array.isArray(p[subKey]) ? p[subKey] : null;
      if(!sub || !sub.some(x=>x.id===itemId)) return p;
      before = sub.find(x=>x.id===itemId); ownerName = p.name || p.type || '';
      if(method === 'PUT'){
        const updated = sub.map(x=> x.id===itemId ? {...x, ...body, id:itemId} : x);
        found = updated.find(x=>x.id===itemId);
        return {...p, [subKey]: updated};
      }
      found = {ok:true};
      return {...p, [subKey]: sub.filter(x=>x.id!==itemId)};
    });
    if(found){ localStoreSet(key, next); return { result: found, before, ownerName }; }
  }
  return null;
}
const NESTED_ROUTES = { 'equipment-factory-movements': 'factoryMovements', 'equipment-other': 'other' };
function nestedSubKey(seg){
  if(NESTED_ROUTES[seg]) return NESTED_ROUTES[seg];
  if(seg.endsWith('-entries')) return 'entries';
  if(seg.endsWith('-payments')) return 'payments';
  return null;
}
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

async function apiFetchLocal(path, options={}){
  const method = (options.method || 'GET').toUpperCase();
  const body = options.body ? JSON.parse(options.body) : {};
  const result = apiFetchLocalCore(path, method, body);
  return result;
}
function apiFetchLocalCore(path, method, body){
  if(path === '/api/me'){
    return localStoreGet('user', { name: '', capital: 0, owner_phone: '' });
  }
  if(path === '/api/nawala' && method === 'PUT'){
    const before = localStoreGet('user', {});
    const user = {...before, ...body};
    localStoreSet('user', user);
    auditAdd({ method, path, section: auditSectionOf(path), before, after: user });
    return user;
  }

  const parts = path.replace(/^\/api\//, '').split('/');
  const mainKey = parts[0];

  if(mainKey === 'prices'){
    let prices = localStoreGet('prices', []);
    if(method === 'GET') return prices;
    if(method === 'PUT'){
      const same = p => {
        if(p.scope !== body.scope) return false;
        if(body.scope === 'season') return true;
        if(body.scope === 'week') return normalizeWeekStart(p.week_start) === normalizeWeekStart(body.week_start);
        return p.week_start === body.week_start;
      };
      const before = prices.find(same) || null;
      prices = prices.filter(p=>!same(p));
      prices.push(body);
      localStoreSet('prices', prices);
      auditAdd({ method, path, section: 'التسعير', before, after: body });
      return body;
    }
  }

  // تعديل/حذف قيد أو دفعة أو حركة عدة: /api/<x>-entries/<id>
  if(parts.length === 2 && nestedSubKey(parts[0]) && (method === 'PUT' || method === 'DELETE')){
    const res = localMutateNested(nestedSubKey(parts[0]), parts[1], method, body);
    if(res){
      auditAdd({ method, path, section: auditSectionOf(path), owner: res.ownerName, before: res.before, after: method==='PUT' ? res.result : null });
      return res.result;
    }
    if(method === 'DELETE') return { ok: true };
    throw new Error('العملية دي مش موجودة في البيانات المحفوظة');
  }

  // عاملات النوالة: /api/sakinas/<id>/workers
  if(mainKey === 'sakinas' && parts.length === 3 && parts[2] === 'workers'){
    const key = 'sakina_workers_' + parts[1];
    const wList = localStoreGet(key, []);
    if(method === 'GET') return wList;
    if(method === 'POST'){
      const item = { id: uid(), name: body.name, entries: [], payments: [], opening_balance: body.opening_balance || 0 };
      wList.push(item);
      localStoreSet(key, wList);
      auditAdd({ method, path, section: 'عاملات النوالة', after: item });
      return item;
    }
  }
  if(mainKey === 'sakinas' && parts.length === 2 && method === 'DELETE'){
    localStorage.removeItem('nawalty_db_sakina_workers_' + parts[1]);
  }

  // العدة: حركات المصانع / الأماكن الأخرى / رصيد النوالات
  if(mainKey === 'equipment' && parts.length >= 3){
    let eq = localStoreGet('equipment', []);
    const itemId = parts[1];
    let result = null;
    eq = eq.map(it=>{
      if(it.id !== itemId) return it;
      if(parts[2] === 'factory-movements' && method === 'POST'){
        result = { id: uid(), ...body };
        return {...it, factoryMovements: [...(it.factoryMovements||[]), result]};
      }
      if(parts[2] === 'other' && method === 'POST'){
        result = { id: uid(), ...body };
        return {...it, other: [...(it.other||[]), result]};
      }
      if(parts[2] === 'sakina-stock' && parts[3] && method === 'PUT'){
        const stock = it.sakinaStock || [];
        const exists = stock.find(s=>s.sakina_id === parts[3]);
        result = exists ? {...exists, qty: body.qty} : { id: uid(), sakina_id: parts[3], qty: body.qty };
        return {...it, sakinaStock: exists ? stock.map(s=>s.sakina_id===parts[3]?result:s) : [...stock, result]};
      }
      return it;
    });
    if(!result) throw new Error('صنف العدة مش موجود');
    localStoreSet('equipment', eq);
    auditAdd({ method, path, section: 'العدة', after: result });
    return result;
  }

  // إضافة قيد/دفعة لشخص: /api/<x>/<personId>/entries|payments
  if(parts.length === 3 && (parts[2] === 'entries' || parts[2] === 'payments')){
    const personId = parts[1];
    const subType = parts[2];
    const item = { id: uid(), ...body };
    for(const key of localKeysFor(mainKey)){
      const list = localStoreGet(key, []);
      const owner = list.find(p=>p.id===personId);
      if(!owner) continue;
      localStoreSet(key, list.map(p=> p.id===personId ? {...p, [subType]: [item, ...(p[subType]||[])]} : p));
      auditAdd({ method, path, section: auditSectionOf(path), owner: owner.name, after: item });
      return item;
    }
    throw new Error('الشخص ده مش موجود في البيانات المحفوظة');
  }

  if(mainKey === 'sakina-workers' && parts.length === 2){
    for(const key of localKeysFor(mainKey)){
      const list = localStoreGet(key, []);
      const before = list.find(p=>p.id===parts[1]);
      if(!before) continue;
      if(method === 'DELETE'){ localStoreSet(key, list.filter(p=>p.id!==parts[1])); auditAdd({method, path, section:'عاملات النوالة', owner: before.name, before}); return { ok: true }; }
      if(method === 'PUT'){
        const next = list.map(p=>p.id===parts[1]?{...p, ...body}:p);
        localStoreSet(key, next); return next.find(p=>p.id===parts[1]);
      }
    }
    if(method === 'DELETE') return { ok: true };
  }

  // عمليات القائمة الأساسية: GET / POST / PUT / DELETE
  let items = localStoreGet(mainKey, []);
  if(method === 'GET') return items;
  if(method === 'POST'){
    const item = { id: uid(), entries: [], payments: [], ...body };
    items.push(item);
    localStoreSet(mainKey, items);
    auditAdd({ method, path, section: auditSectionOf(path), owner: item.name || '', after: item });
    return item;
  }
  const itemId = parts[1];
  if(method === 'PUT' && itemId){
    const before = items.find(x=>x.id===itemId) || null;
    items = items.map(x => {
      if(x.id !== itemId) return x;
      const merged = {...x, ...body};
      if(body.weekly_prices || body.weeklyPrices) merged.weeklyPrices = body.weekly_prices || body.weeklyPrices;
      delete merged.weekly_prices;
      return merged;
    });
    localStoreSet(mainKey, items);
    const after = items.find(x => x.id === itemId) || body;
    // ما نسجلش القوائم الكاملة للقيود في السجل عشان المساحة
    const slim = o => o ? Object.fromEntries(Object.entries(o).filter(([k])=>k!=='entries'&&k!=='payments')) : o;
    auditAdd({ method, path, section: auditSectionOf(path), owner: (before&&before.name)||'', before: slim(before), after: slim(after) });
    return after;
  }
  if(method === 'DELETE' && itemId){
    const before = items.find(x=>x.id===itemId) || null;
    items = items.filter(x => x.id !== itemId);
    localStoreSet(mainKey, items);
    auditAdd({ method, path, section: auditSectionOf(path), owner: (before&&(before.name||before.type))||'', before });
    return { ok: true };
  }
  return Array.isArray(items) ? items : {};
}

async function apiFetch(path, options={}){
  if(LOCAL_MODE) return apiFetchLocal(path, options);
  const token = getToken();
  const headers = { 'Content-Type':'application/json', ...(options.headers||{}) };
  if(token) headers['Authorization'] = 'Bearer '+token;
  let res;
  try{
    res = await fetch(API_BASE+path, {...options, headers});
  }catch(networkErr){
    throw new Error('السيرفر مش متاح دلوقتي — اتأكد من النت أو من رابط السيرفر في الإعدادات');
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'حصل خطأ من السيرفر');
  return data;
}

async function loadPriceTables(){
  const [rows, routes] = await Promise.all([apiFetch('/api/prices'), apiFetch('/api/transport-routes')]);
  const priceDays = rows.filter(r=>r.scope==='day').map(r=>({ ...r.prices, day:r.week_start }));
  const weekMap = {};
  rows.filter(r=>r.scope==='week').forEach(r=>{ const ws = normalizeWeekStart(r.week_start); weekMap[ws] = { ...r.prices, weekStart: ws }; });
  const seasonRow = rows.find(r=>r.scope==='season');
  const lockedWeeks = rows.filter(r=>r.scope==='lock' && !(r.prices && r.prices.locked===false)).map(r=>normalizeWeekStart(r.week_start));
  return { priceDays, priceWeeks: Object.values(weekMap), seasonPrices: seasonRow ? seasonRow.prices : null, lockedWeeks, routes: routes||[] };
}

/* ---------- ترقية البيانات القديمة (بتشتغل مرة واحدة) ---------- */
const SCHEMA_VERSION = 2;
function runLocalMigrations(){
  let v = 0; try{ v = parseInt(localStorage.getItem('nawalty_schema')||'0',10)||0; }catch(e){}
  if(v >= SCHEMA_VERSION) return;
  try{
    // 1) أسابيع التسعير اللي كانت متسجلة يوم جمعة → سبت
    const prices = localStoreGet('prices', []);
    const seen = {};
    const fixed = [];
    prices.forEach(p=>{
      const q = p.scope==='week' || p.scope==='lock' ? {...p, week_start: normalizeWeekStart(p.week_start)} : p;
      const key = q.scope + '|' + (q.week_start||'');
      seen[key] = q;
    });
    Object.values(seen).forEach(p=>fixed.push(p));
    localStoreSet('prices', fixed);
    // 2) تسعيرة الأشخاص + قيم إملائية قديمة + اسم كمية المبيعات
    allLocalListKeys().forEach(key=>{
      const list = localStoreGet(key, []);
      if(!Array.isArray(list)) return;
      const next = list.map(p=>{
        if(!p || typeof p !== 'object') return p;
        const out = {...p};
        if(out.weeklyPrices || out.weekly_prices){ out.weeklyPrices = normalizeWeeklyPrices(out.weeklyPrices || out.weekly_prices); delete out.weekly_prices; }
        if(Array.isArray(out.entries)) out.entries = out.entries.map(e=>{
          const n = {...e};
          ['kind','item_type','from_location','to_location'].forEach(k=>{ if(n[k]!==undefined) n[k] = fixLegacy(n[k]); });
          if(key==='factories'){
            if(n.quantity===undefined && n.tons!==undefined){ n.quantity = n.tons; delete n.tons; }
            if(n.price===undefined && n.price_per_ton!==undefined){ n.price = n.price_per_ton; delete n.price_per_ton; }
          }
          if(key==='jalaba' && !n.unit) n.unit = 'كوز';
          return n;
        });
        return out;
      });
      localStoreSet(key, next);
    });
    // 3) العربيات: المشاوير اللي سعرها زي سعر المشوار الثابت تتبع جدول المشاوير، والباقي يفضل سعر خاص
    const routes = localStoreGet('transport-routes', []);
    const transport = localStoreGet('transport', []);
    if(transport.length){
      localStoreSet('transport', transport.map(p=>({...p, entries:(p.entries||[]).map(e=>{
        if(e.price_manual !== undefined) return e;
        const r = routes.find(r=>r.from_location===e.from_location && r.to_location===e.to_location);
        const same = r && parseFloat(r.price) === parseFloat(e.price);
        return {...e, price_manual: !same && e.price !== null && e.price !== '' && e.price !== undefined};
      })})));
    }
    localStorage.setItem('nawalty_schema', String(SCHEMA_VERSION));
  }catch(e){ console.error('migration failed', e); }
}

/* ---------- النسخ الاحتياطي ---------- */
function collectBackup(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('nawalty_') && k !== 'nawalty_token' && k !== 'nawalty_pin') data[k] = localStorage.getItem(k);
  }
  return { app: 'nawalty', version: SCHEMA_VERSION, exportedAt: new Date().toISOString(), data };
}
function downloadBlob(filename, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function downloadBackup(label){
  const b = collectBackup();
  downloadBlob(`نوالتي-نسخة-احتياطية-${label||todayStr()}.json`, new Blob([JSON.stringify(b)], {type:'application/json'}));
  try{ localStorage.setItem('nawalty_last_backup', todayStr()); }catch(e){}
  return b;
}
function restoreBackup(obj){
  if(!obj || obj.app !== 'nawalty' || !obj.data) throw new Error('الملف ده مش نسخة احتياطية من نوالتي');
  const keep = { token: localStorage.getItem('nawalty_token'), pin: localStorage.getItem('nawalty_pin') };
  const toRemove = [];
  for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith('nawalty_')) toRemove.push(k); }
  toRemove.forEach(k=>localStorage.removeItem(k));
  Object.entries(obj.data).forEach(([k,v])=>localStorage.setItem(k, v));
  if(keep.token) localStorage.setItem('nawalty_token', keep.token);
  if(keep.pin) localStorage.setItem('nawalty_pin', keep.pin);
  localStorage.setItem('nawalty_last_backup', todayStr());
}
function hasAnyData(){
  return allLocalListKeys().some(k=>{ const l = localStoreGet(k, []); return Array.isArray(l) && l.length > 0; });
}
function daysSinceBackup(){
  const d = localStorage.getItem('nawalty_last_backup');
  if(!d) return Infinity;
  return Math.floor((new Date(todayStr()+'T00:00:00') - new Date(d+'T00:00:00')) / 86400000);
}

// حذف مع إمكانية التراجع: بيستنى ٨ ثواني قبل ما يمسح فعلًا
const PENDING_DELETES = {};
function scheduleDelete(label, doDelete, onUndo){
  const key = uid();
  const timer = setTimeout(async ()=>{
    delete PENDING_DELETES[key];
    try{ await doDelete(); }catch(e){ notify('ماتمسحش: '+e.message, {tone:'error'}); if(onUndo) onUndo(); }
  }, 8000);
  PENDING_DELETES[key] = { timer, doDelete };
  notify(label, { action: { label: 'تراجع', onClick: ()=>{ clearTimeout(timer); delete PENDING_DELETES[key]; if(onUndo) onUndo(); } }, duration: 8000 });
}
window.addEventListener('beforeunload', ()=>{
  Object.values(PENDING_DELETES).forEach(p=>{ clearTimeout(p.timer); try{ p.doDelete(); }catch(e){} });
});

/* ---------- قفل التطبيق برقم سري ---------- */
async function hashPin(pin){
  const text = 'nawalty:' + pin;
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h = 0; for(let i=0;i<text.length;i++){ h = ((h<<5)-h + text.charCodeAt(i))|0; } return 'x'+h;
  }
}

// تاريخ بالتوقيت المحلي (مصر) مش UTC
function localDateStr(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const todayStr = () => localDateStr(new Date());
// الأرقام بتتعزل باتجاه شمال-لليمين عشان علامة السالب تفضل قبل الرقم في الواجهة العربية
const LRI = '⁦', PDI = '⁩';
const fmtNum = n => (Math.round((n||0)*100)/100).toLocaleString('en-US');
const num = n => LRI + fmtNum(n) + PDI;
const money = n => num(n) + ' جنيه';

// بداية الأسبوع = السبت
function getWeekStart(dateStr){
  const d = new Date((dateStr||todayStr())+'T00:00:00');
  const day = d.getDay();
  const diff = (day - 6 + 7) % 7;
  d.setDate(d.getDate()-diff);
  return localDateStr(d);
}
// نسخ قديمة كانت بتسجل بداية الأسبوع يوم جمعة — نحولها للسبت اللي بعدها
function normalizeWeekStart(ws){
  if(!ws) return ws;
  const d = new Date(ws+'T00:00:00');
  if(isNaN(d.getTime())) return ws;
  if(d.getDay() === 5) d.setDate(d.getDate()+1);
  return getWeekStart(localDateStr(d));
}
function normalizeWeeklyPrices(list){
  const map = {};
  (list||[]).forEach(w=>{ if(w && w.weekStart){ const ws = normalizeWeekStart(w.weekStart); map[ws] = {...w, weekStart: ws}; } });
  return Object.values(map);
}
const LEGACY_VALUES = { 'أحضر':'أخضر', 'غيرذلك':'غير ذلك', 'النولة':'النوالة' };
const fixLegacy = v => (typeof v === 'string' && LEGACY_VALUES[v]) ? LEGACY_VALUES[v] : v;
const isGreenKind = k => k === 'أخضر' || k === 'أحضر';
const toNum = v => (v === '' || v === null || v === undefined || isNaN(v)) ? null : parseFloat(v);

function getWeekRangeLabel(weekStart){
  const s = new Date(weekStart+'T00:00:00');
  const e = new Date(s); e.setDate(e.getDate()+6);
  const fmt = dt => dt.toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'numeric'});
  return fmt(s)+' - '+fmt(e);
}
function isCurrentWeek(dateStr){ return getWeekStart(dateStr)===getWeekStart(todayStr()); }
function formatDateWithDay(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  const dayName = d.toLocaleDateString('ar-EG-u-nu-latn', {weekday:'long'});
  const md = d.toLocaleDateString('ar-EG-u-nu-latn', {day:'numeric', month:'numeric'});
  return dayName+' '+md;
}
function formatDateShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('ar-EG-u-nu-latn', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function groupByWeek(entries){
  const map = {};
  entries.forEach(e=>{ const ws=getWeekStart(e.date); if(!map[ws]) map[ws]=[]; map[ws].push(e); });
  return Object.keys(map).sort((a,b)=>b.localeCompare(a)).map(ws=>({
    weekStart: ws, label: getWeekRangeLabel(ws),
    items: map[ws].slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''))
  }));
}

/* ---------- الأسعار ---------- */
// قيم مقترحة بتظهر في صفحة التسعير بس — عمرها ما بتدخل في الحساب إلا لما تتحفظ
const DEFAULT_PRICES = {
  jalabPerKuz: 2,
  jalabPerTon: '',
  niswan: { 'هارت': { withPeel: 140, withoutPeel: 190 }, 'كاسات': { withPeel: 150, withoutPeel: 200 }, 'حشو': { withPeel: 130, withoutPeel: 180 } },
  takhrit: { 'قطع': 100, 'قرص': 100, 'شرايح': 90, 'حدوة': 110 },
  workerDailyWage: 150,
  sales: { 'قطع (أولى)': 35, 'قطع (ثانية)': 25, 'كاسات (أولى)': 50, 'كاسات (ثانية)': 40, 'قرص (أولى)': 40, 'قرص (ثانية)': 30, 'حشو (أولى)': 40, 'حشو (ثانية)': 30, 'شرايح (أولى)': 35, 'شرايح (ثانية)': 25, 'حدوة (أولى)': 35, 'حدوة (ثانية)': 25, 'أخضر': 2 }
};
// لما مفيش أي تسعيرة متسجلة: كل الأسعار فاضية، والعمليات بتظهر «بدون سعر» بدل أرقام وهمية
const EMPTY_PRICES = { jalabPerKuz:'', jalabPerTon:'', niswan:{}, takhrit:{}, workerDailyWage:'', sales:{} };

function withPriceDefaults(p){
  p = p || {};
  return {...DEFAULT_PRICES, ...p,
    niswan: {...DEFAULT_PRICES.niswan, ...(p.niswan||{})},
    takhrit: {...DEFAULT_PRICES.takhrit, ...(p.takhrit||{})},
    sales: {...DEFAULT_PRICES.sales, ...(p.sales||{})}};
}
// الأولوية: تسعير اليوم ← تسعير الأسبوع ← آخر أسبوع متسعّر قبله ← الموسمي ← مفيش سعر
// الأسعار بتتحسب وقت العرض، فأي تعديل في تسعيرة بيعدّل الكشوف القديمة والربح وكل الأقسام
function getPriceSetForDate(db, dateStr){
  const extras = { __routes: db.routes || [] };
  const dayMatch = (db.priceDays||[]).find(p=>p.day===dateStr);
  if(dayMatch) return {...dayMatch, ...extras, __source:'day', __from: dateStr};
  const ws = getWeekStart(dateStr);
  const weekMatch = (db.priceWeeks||[]).find(p=>p.weekStart===ws);
  if(weekMatch) return {...weekMatch, ...extras, __source:'week', __from: ws};
  const candidates = (db.priceWeeks||[]).filter(p=>p.weekStart<ws).sort((a,b)=> b.weekStart.localeCompare(a.weekStart));
  if(candidates[0]) return {...candidates[0], ...extras, __source:'carry', __from: candidates[0].weekStart};
  if(db.seasonPrices) return {...db.seasonPrices, ...extras, __source:'season'};
  return {...EMPTY_PRICES, ...extras, __source:'none', weekStart: ws};
}
function isWeekLocked(db, dateStr){
  if(!dateStr) return false;
  return (db.lockedWeeks||[]).includes(getWeekStart(dateStr));
}

// تسعيرة الشخص الخاصة: نفس الأسبوع، وإلا آخر أسبوع متسعّر قبله (عمرها ما بتاخد سعر أسبوع جاي)
function getPersonWeeklyConfig(person, dateStr){
  const list = normalizeWeeklyPrices(person && (person.weeklyPrices || person.weekly_prices));
  if(list.length === 0) return null;
  const ws = getWeekStart(dateStr || todayStr());
  const sorted = list.sort((a,b) => (b.weekStart||'').localeCompare(a.weekStart||''));
  return sorted.find(w => w.weekStart === ws) || sorted.find(w => w.weekStart <= ws) || null;
}

/* ---------- حسابات كل قسم (على شكل البيانات المحلي) ---------- */
// الجلابة: سعر مكتوب في القيد ← تسعيرة الجلاب الخاصة (للنوع ثم «عام»، أو «طن») ← السعر العام
function calcJalabEntry(e, ps, person){
  const qty = parseFloat(e.kuz) || 0;
  const byTon = e.unit === 'طن';
  const manual = toNum(e.price);
  if(manual !== null) return qty * manual;
  const wk = getPersonWeeklyConfig(person, e.date);
  if(wk && wk.prices){
    if(byTon){
      const t = toNum(wk.prices['طن']);
      if(t !== null) return qty * t;
    } else {
      const own = toNum(wk.prices[fixLegacy(e.itemType)]);
      if(own !== null) return qty * own;
      const general = toNum(wk.prices['عام']);
      if(general !== null) return qty * general;
    }
  }
  return qty * (toNum(byTon ? ps.jalabPerTon : ps.jalabPerKuz) || 0);
}
function calcSakinaEntry(e, ps){
  return (parseFloat(e.pieces)||0)/1000 * (toNum(((ps.niswan||{})[e.itemType]||{})[e.tookPeel?'withPeel':'withoutPeel']) || 0);
}
function calcTakhritEntry(e, ps){
  const manual = toNum(e.price);
  return (parseFloat(e.barrels)||0) * (manual !== null ? manual : (toNum((ps.takhrit||{})[e.barrelType]) || 0));
}
function calcWorkerEntry(e, ps){ return e.present ? (toNum(ps.workerDailyWage) || 0) : 0; }
// العربيات: المشوار الثابت بياخد سعره الحالي من جدول المشاوير (زي باقي الأسعار)، إلا لو اتكتب له سعر خاص
function transportRoutePrice(e, ps){
  const r = (ps.__routes||[]).find(r => r.from_location === e.fromLocation && r.to_location === e.toLocation);
  return r ? toNum(r.price) : null;
}
function calcTransportEntry(e, ps){
  const manual = toNum(e.price);
  if(e.priceManual && manual !== null) return manual;
  const route = transportRoutePrice(e, ps);
  if(route !== null) return route;
  return manual || 0;
}

// المبيعات والمشتريات — mode: 'sales' (المصانع) أو 'purchase' (المشتريات)
function getEntryPricingDetails(e, ps, person, mode='sales'){
  const isGreen = isGreenKind(e.kind);
  const qty = parseFloat(e.quantity || e.tons || e.kuz || 0) || 0;
  const gradeSuffix = isGreen ? '' : (e.grade === 'درجة ثانية' ? ' (ثانية)' : ' (أولى)');
  const effectiveItemType = isGreen ? e.itemType : ((e.itemType||'') + gradeSuffix);

  const personWeek = getPersonWeeklyConfig(person, e.date);
  const personPrice = personWeek && personWeek.prices ? toNum(personWeek.prices[effectiveItemType]) : null;
  const personDiscount = personWeek ? toNum(personWeek.discount) : null;

  const manualRaw = (e.price !== undefined && e.price !== '' && e.price !== null) ? e.price : e.pricePerTon;
  const manualPrice = toNum(manualRaw);
  const hasManualPrice = manualPrice !== null;
  // السعر العام من صفحة التسعير بيتطبق على المبيعات بس — المشتريات لازم سعر البائع أو سعر مكتوب
  const salesTable = ps.sales || {};
  let globalPrice = null;
  if(mode === 'sales'){
    globalPrice = toNum(salesTable[effectiveItemType]);
    if(globalPrice === null && isGreen) globalPrice = toNum(salesTable['أخضر']);
  }
  const price = hasManualPrice ? manualPrice : (personPrice !== null ? personPrice : (globalPrice || 0));
  const manualDisc = toNum(e.discount);
  const hasManualDiscount = manualDisc !== null;
  const disc = isGreen ? 0 : (hasManualDiscount ? manualDisc : (personDiscount !== null ? personDiscount : 0));
  const rawTotal = qty * price;
  const netTotal = isGreen ? rawTotal : rawTotal * (1 - disc / 100);
  const missingPrice = !hasManualPrice && personPrice === null && globalPrice === null;
  const priceSource = hasManualPrice ? 'manual' : (personPrice !== null ? 'person' : (globalPrice !== null ? 'global' : 'none'));
  return { isGreen, qty, price, hasManualPrice, disc, hasManualDiscount, rawTotal, netTotal, missingPrice, priceSource };
}
const calcSalesEntry = (e, ps, p) => getEntryPricingDetails(e, ps, p, 'sales').netTotal;
const calcRaseefEntry = (e, ps, p) => getEntryPricingDetails(e, ps, p, 'purchase').netTotal;

// الكمية الأساسية لأي قيد (عشان نعرف لو فيه شغل اتعمل وملهوش سعر)
function entryQty(e){
  const q = parseFloat(e.kuz || e.quantity || e.tons || e.pieces || e.barrels) || 0;
  if(q) return q;
  if(e.present) return 1;
  if(e.fromLocation || e.toLocation) return 1;
  return 0;
}
function isMissingPrice(e, total){ return Math.abs(total) < 1e-9 && entryQty(e) > 0; }

function mapEntryFromServer(e, fields){
  const o = { id:e.id, date:e.entry_date };
  fields.forEach(f=>{
    let v = e[f.server];
    // نسخ قديمة من المبيعات كانت بتسجل الكمية/السعر باسم tons / price_per_ton
    if((v===null||v===undefined) && f.server==='quantity') v = e.tons;
    if((v===null||v===undefined) && f.server==='price') v = e.price_per_ton;
    if(f.type==='bool') o[f.local] = !!v;
    else o[f.local] = (v===null||v===undefined) ? (f.def!==undefined ? f.def : '') : fixLegacy(v);
  });
  return o;
}
function mapEntryToServer(form, fields){
  const o = { entry_date: form.date };
  fields.forEach(f=>{
    let v = form[f.local];
    if(f.type==='bool') v = !!v;
    else if(f.type==='number') v = (v===''||v===null||v===undefined) ? null : parseFloat(v);
    o[f.server] = v;
  });
  return o;
}
const mapPaymentFromServer = x => ({ id:x.id, date:x.pay_date, amount: parseFloat(x.amount)||0, note:x.note||'' });
const mapPaymentToServer = f => ({ pay_date:f.date, amount: parseFloat(f.amount)||0, note: f.note||'' });
function mapPersonFromServer(row, fields){
  return {
    id: row.id, name: row.name,
    openingBalance: parseFloat(row.opening_balance) || 0,
    weeklyPrices: normalizeWeeklyPrices(row.weeklyPrices || row.weekly_prices),
    entries: (row.entries||[]).map(e=>mapEntryFromServer(e, fields)),
    payments: (row.payments||[]).map(mapPaymentFromServer),
  };
}

/* ---------- أرصدة الأشخاص ---------- */
// direction: 'payable' = إحنا اللي بندفع له (جلاب، بائع، عامل، عربية) — 'receivable' = هو اللي بيدفع لنا (مصنع/تاجر)
function personTotals(p, calc, db, range){
  const inRange = d => (!range || ((!range.from || (d||'') >= range.from) && (!range.to || (d||'') <= range.to)));
  let earned = 0, missing = 0;
  (p.entries||[]).forEach(e=>{
    if(!inRange(e.date)) return;
    const t = calc(e, getPriceSetForDate(db, e.date), p);
    if(isMissingPrice(e, t)) missing++;
    earned += t;
  });
  const paid = (p.payments||[]).filter(x=>inRange(x.date)).reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
  const opening = range ? 0 : (parseFloat(p.openingBalance)||0);
  return { earned, paid, opening, remaining: opening + earned - paid, missing };
}
// ملخص كل أسبوع: المستحق، المدفوع، والرصيد التراكمي في آخره
function weekSummaries(p, calc, db){
  const weeks = {};
  const add = (ws) => (weeks[ws] = weeks[ws] || { weekStart: ws, earned: 0, paid: 0, count: 0, missing: 0 });
  (p.entries||[]).forEach(e=>{
    const w = add(getWeekStart(e.date));
    const t = calc(e, getPriceSetForDate(db, e.date), p);
    if(isMissingPrice(e, t)) w.missing++;
    w.earned += t; w.count++;
  });
  (p.payments||[]).forEach(x=>{ add(getWeekStart(x.date)).paid += parseFloat(x.amount)||0; });
  let running = parseFloat(p.openingBalance)||0;
  return Object.values(weeks).sort((a,b)=>a.weekStart.localeCompare(b.weekStart)).map(w=>{
    running += w.earned - w.paid;
    return {...w, balance: running};
  });
}
function balanceInfo(remaining, direction){
  const r = Math.round((remaining||0)*100)/100;
  if(Math.abs(r) < 0.005) return { text: 'خالص', short: 'خالص', tone: 'leaf', amount: 0 };
  if(direction === 'receivable'){
    return r > 0
      ? { text: 'ليك عنده', short: 'ليك', tone: 'gold', amount: r }
      : { text: 'ليه عندك (دفع زيادة)', short: 'ليه', tone: 'rust', amount: -r };
  }
  return r > 0
    ? { text: 'ليه عندك', short: 'ليه', tone: 'rust', amount: r }
    : { text: 'ليك عنده (دفعت زيادة)', short: 'ليك', tone: 'gold', amount: -r };
}

/* ---------- الوارد والمنصرف (للتقرير الأسبوعي) ---------- */
function flowForWeek(data, ws){
  const inW = d => getWeekStart(d) === ws;
  const f = { jalabKuz:0, jalabTon:0, raseefGreenKuz:0, raseefKilo:0, peeled:{}, barrels:{}, soldKilo:{}, soldGreenKuz:0 };
  (data.jalaba||[]).forEach(p=>p.entries.filter(e=>inW(e.date)).forEach(e=>{ if(e.unit==='طن') f.jalabTon += parseFloat(e.kuz)||0; else f.jalabKuz += parseFloat(e.kuz)||0; }));
  (data.raseef||[]).forEach(p=>p.entries.filter(e=>inW(e.date)).forEach(e=>{ const q=parseFloat(e.quantity)||0; if(isGreenKind(e.kind)) f.raseefGreenKuz += q; else f.raseefKilo += q; }));
  (data.sakinaWorkers||[]).forEach(p=>p.entries.filter(e=>inW(e.date)).forEach(e=>{ f.peeled[e.itemType] = (f.peeled[e.itemType]||0) + (parseFloat(e.pieces)||0); }));
  [...(data.takhritFixed||[]), ...(data.banadeer||[])].forEach(p=>p.entries.filter(e=>inW(e.date)).forEach(e=>{ f.barrels[e.barrelType] = (f.barrels[e.barrelType]||0) + (parseFloat(e.barrels)||0); }));
  (data.factories||[]).forEach(p=>p.entries.filter(e=>inW(e.date)).forEach(e=>{ const q=parseFloat(e.quantity)||0; if(isGreenKind(e.kind)) f.soldGreenKuz += q; else f.soldKilo[e.itemType] = (f.soldKilo[e.itemType]||0) + q; }));
  f.inKuz = f.jalabKuz + f.raseefGreenKuz;
  f.peeledTotal = Object.values(f.peeled).reduce((s,v)=>s+v,0);
  f.barrelsTotal = Object.values(f.barrels).reduce((s,v)=>s+v,0);
  f.soldKiloTotal = Object.values(f.soldKilo).reduce((s,v)=>s+v,0);
  return f;
}

    <div style="padding:14px 28px; border-top:1px solid #eee; font-size:11px; color:#999;">تم إنشاؤه تلقائيًا بواسطة نظام نوالتي</div>
  </div>`;
}
// منع الأسماء/الملاحظات اللي فيها رموز زي < > من تكسير الـ PDF
function escHtml(v){ return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pdfTable(headers, rows){
  const th = headers.map(h=>`<th style="border:1px solid #DDE7CE; background:#DDE7CE; padding:8px; font-size:12px; text-align:right;">${escHtml(h)}</th>`).join('');
  const trs = rows.map(r=>`<tr>${r.map(c=>`<td style="border:1px solid #eee; padding:7px 8px; font-size:13px;">${escHtml(c)}</td>`).join('')}</tr>`).join('');
  return `<table style="width:100%; border-collapse:collapse; margin:10px 0 18px;"><thead><tr>${th}</tr></thead><tbody>${trs||`<tr><td colspan="${headers.length}" style="padding:14px; text-align:center; color:#999; font-size:12px;">لا توجد بيانات</td></tr>`}</tbody></table>`;
}
async function renderHtmlToPdf(innerHtml){
  const container = document.createElement('div');
  container.style.position='fixed'; container.style.left='-99999px'; container.style.top='0'; container.style.zIndex='-1';
  container.innerHTML = pdfDocShell(innerHtml);
  document.body.appendChild(container);
  let canvas, breaks, cssW, cssH;
  try{
    const target = container.firstElementChild;
    const rect = target.getBoundingClientRect();
    cssW = rect.width; cssH = rect.height;
    // أماكن ينفع نقطع الصفحة عندها من غير ما نقسم صف في نص الجدول
    breaks = [...target.querySelectorAll('tr, table, div')].map(el=>el.getBoundingClientRect().bottom - rect.top).filter(b=>b>0).sort((a,b)=>a-b);
    // الكشوف الطويلة جدًا: نقلل الدقة عشان الصورة ماتعديش أقصى حجم يسمح بيه المتصفح
    const scale = Math.max(0.6, Math.min(2, 30000 / Math.max(cssH,1)));
    canvas = await html2canvas(target, {scale, backgroundColor:'#ffffff', useCORS:true});
  } finally {
    document.body.removeChild(container);
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const pxScale = canvas.width / cssW;               // بكسل الصورة لكل بكسل CSS
  const pagePx = cssW * pageHeight / pageWidth;      // طول الصفحة بوحدات CSS
  let start = 0, first = true;
  while(start < cssH - 1){
    let end = Math.min(start + pagePx, cssH);
    if(end < cssH){
      const candidates = breaks.filter(b => b > start + pagePx*0.5 && b <= end);
      if(candidates.length) end = candidates[candidates.length-1];
    }
    const slice = document.createElement('canvas');
    slice.width = canvas.width;
    slice.height = Math.ceil((end - start) * pxScale);
    const ctx = slice.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas, 0, Math.floor(start*pxScale), canvas.width, slice.height, 0, 0, canvas.width, slice.height);
    if(!first) pdf.addPage();
    pdf.addImage(slice.toDataURL('image/png'), 'PNG', 0, 0, pageWidth, (end-start) * pageWidth / cssW);
    first = false;
    start = end;
  }
  return pdf;
}
async function downloadPdf(innerHtml, filename){
  const pdf = await renderHtmlToPdf(innerHtml);
  pdf.save(filename);
}
async function sharePdf(innerHtml, filename, text){
  const pdf = await renderHtmlToPdf(innerHtml);
  const blob = pdf.output('blob');
  const file = new File([blob], filename, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:filename, text: text||''}); return; }catch(e){ if(e && e.name==='AbortError') return; }
  }
  // الكمبيوتر: بينزل الملف وبيفتح واتساب بالرسالة، وانت ترفق الملف
  downloadBlob(filename, blob);
  notify('اتنزّل الكشف — ارفقه في رسالة واتساب');
  window.open('https://wa.me/?text='+encodeURIComponent(text||''),'_blank');
}

function ConfirmHost(){

// خانة تاريخ بتعرض يوم/شهر/سنة بالعربي بغض النظر عن لغة المتصفح، وبتفتح نتيجة الموبايل/الكمبيوتر العادية
function DateInput({value, onChange, className='', placeholder='اختر التاريخ', invalid, ...rest}){
  const ref = React.useRef(null);
  const open = () => { try{ ref.current && ref.current.showPicker && ref.current.showPicker(); }catch(e){} };
  return (
    <div className={`relative ${className.includes('w-')?'':'w-full'} ${className}`} style={{padding:0, border:'none', background:'transparent', boxShadow:'none'}}>
      <div onClick={open} className={`w-full rounded-lg border ${invalid?'border-rust ring-2 ring-rust/30':'border-leaf-line'} bg-white px-2.5 py-2 text-sm flex items-center justify-between gap-2 cursor-pointer min-h-[40px]`}>
        <span className={value ? 'num' : 'text-ink/50'}>{value ? formatDateShort(value) : placeholder}</span>
        <svg viewBox="0 0 24 24" className="w-4 h-4 text-ink/50 shrink-0" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </div>
      <input ref={ref} type="date" value={value||''} onChange={onChange} {...rest} aria-label={rest['aria-label']||placeholder}
        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"/>
    </div>
  );
}

function FieldInput({field, value, onChange, invalid}){
  const base = `w-full rounded-lg border ${invalid?'border-rust ring-2 ring-rust/30':'border-leaf-line'} px-2.5 py-2 text-sm bg-white min-h-[40px]`;
  if(field.type==='checkbox'){
    return <label className="flex items-center gap-2 text-sm min-h-[40px]"><input type="checkbox" className="w-5 h-5" checked={!!value} onChange={e=>onChange(e.target.checked)}/>{field.label}</label>;
  }
  if(field.type==='select'){
    return (
      <select value={value||''} onChange={e=>onChange(e.target.value)} className={base} aria-label={field.formLabel||field.label}>
        <option value="" disabled>اختر</option>
        {field.options.map(o=> (typeof o==='object')
          ? <option key={o.value} value={o.value}>{o.label}</option>
          : <option key={o} value={o}>{o}</option>
        )}
      </select>
    );
  }
  if(field.type==='date'){
    return <DateInput value={value} onChange={e=>onChange(e.target.value)} invalid={invalid}/>;
  }
  return (
    <input type={field.type} inputMode={field.type==='number'?'decimal':undefined} value={value===undefined||value===null?'':value}
      onChange={e=>onChange(field.type==='number'? (e.target.value===''?'':parseFloat(e.target.value)) : e.target.value)}
      className={base+' num'} placeholder={field.placeholder||field.formLabel||field.label} aria-label={field.formLabel||field.label}/>
  );
}

function cellText(col, row, person){
  if(col.render) return col.render(row, person || null);
  const v = row[col.key];
  if(col.type==='checkbox') return v?'✔':'—';
  if(col.type==='date') return formatDateWithDay(v);
  if(col.type==='number') return (v===''||v===undefined||v===null)?'—':num(v);
  if(col.type==='select' && col.options){
    const o = col.options.find(o=>typeof o==='object' && o.value===v);
    if(o) return o.label;
  }
  return (v===undefined||v===''||v===null)?'—':v;
}

// جدول قابل للتعديل — على الموبايل بيتحول لكروت عشان الإجمالي مايستخباش
// getRowColumns (اختياري): الأعمدة الخاصة بكل صف — مثلاً كارتة «أخضر» مالهاش درجة ولا خصم
function EditableTable({columns, rows, onUpdate, onDelete, emptyLabel, person = null, getRowColumns = null, rowClass}){
  const [editingId,setEditingId]=useState(null);
  const [draft,setDraft]=useState({});
  function startEdit(row){ setEditingId(row.id); setDraft({...row}); }
  function cancel(){ setEditingId(null); setDraft({}); }
  async function save(){ const id = editingId; const d = draft; setEditingId(null); await onUpdate(id, d); }
  const ownCol = (col, row) => (getRowColumns && !col.computed && col.key!=='date') ? getRowColumns(row).find(x=>x.key===col.key) : col;
  const editor = (col, own) => <FieldInput field={own} value={draft[col.key]} onChange={v=>{ const next = {...draft,[col.key]:v}; setDraft(getRowColumns ? fixSelectValues(next, getRowColumns(next)) : next); }}/>;
  const actions = (row, isEd) => isEd ? (
    <div className="flex items-center gap-1">
      <button onClick={save} className="text-leaf-mid p-2" aria-label="حفظ التعديل" title="حفظ"><Icon name="check" className="w-5 h-5"/></button>
      <button onClick={cancel} className="text-ink/65 text-xs p-2">إلغاء</button>
    </div>
  ) : (
    <div className="flex items-center gap-1">
      <button onClick={()=>startEdit(row)} className="text-ink/60 hover:text-leaf-deep p-2" aria-label="تعديل" title="تعديل"><Icon name="edit" className="w-4 h-4"/></button>
      <button onClick={()=>onDelete(row.id)} className="text-rust/70 hover:text-rust p-2" aria-label="حذف" title="حذف"><Icon name="trash" className="w-4 h-4"/></button>
    </div>
  );
  const titleCol = columns[0];
  const totalCol = columns.find(c=>c.isTotal);
  return (
    <>
    <table className="hidden md:table w-full text-sm">
      <thead>
        <tr className="text-ink/70 text-xs border-b border-leaf-line/30">
          {columns.map(c=><th key={c.key} className="text-right py-3 px-3 font-bold">{c.label}</th>)}
          <th className="py-3 px-3"><span className="sr-only">إجراءات</span></th>
        </tr>
      </thead>
      <tbody>
        {rows.length===0 && <tr><td colSpan={columns.length+1} className="text-center text-ink/60 py-6">{emptyLabel||'لا توجد بيانات'}</td></tr>}
        {rows.map(row=>{
          const isEd = editingId===row.id;
          return (
            <tr key={row.id} className={`border-b border-leaf-line/10 hover:bg-cream/40 ${rowClass?rowClass(row):''}`}>
              {columns.map(col=>{
                const own = ownCol(col, isEd ? draft : row);
                return <td key={col.key} className={`py-2 px-3 ${col.isTotal?'font-bold':''}`}>{!own ? '—' : (isEd && !col.computed ? editor(col, own) : cellText(col, row, person))}</td>;
              })}
              <td className="py-1 px-2 whitespace-nowrap">{actions(row, isEd)}</td>
            </tr>
          );
        })}
      </tbody>
    </table>
    <div className="md:hidden divide-y divide-leaf-line/20">
      {rows.length===0 && <p className="text-center text-ink/60 py-6 text-sm">{emptyLabel||'لا توجد بيانات'}</p>}
      {rows.map(row=>{
        const isEd = editingId===row.id;
        return (
          <div key={row.id} className={`p-3 ${rowClass?rowClass(row):''}`}>
            <div className="flex items-start justify-between gap-2 mb-2">
              <div className="font-bold text-sm text-ink">{isEd && !titleCol.computed ? editor(titleCol, ownCol(titleCol, draft) || titleCol) : cellText(titleCol, row, person)}</div>
              <div className="flex items-center gap-2">
                {totalCol && !isEd && <div className="font-black text-leaf-deep num text-base">{cellText(totalCol, row, person)}</div>}
                {actions(row, isEd)}
              </div>
            </div>
            <dl className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-sm">
              {columns.slice(1).filter(c=>c!==totalCol).map(col=>{
                const own = ownCol(col, isEd ? draft : row);
                if(!own) return null;
                const txt = isEd && !col.computed ? null : cellText(col, row, person);
                if(!isEd && (txt==='—' || txt==='' || txt===null)) return null;
                return (
                  <div key={col.key} className={isEd && !col.computed ? 'col-span-2' : ''}>
                    <dt className="text-xs text-ink/60">{col.label}</dt>
                    <dd className="font-semibold">{isEd && !col.computed ? editor(col, own) : txt}</dd>
                  </div>
                );
              })}
            </dl>
          </div>
        );
      })}
    </div>
    </>
  );
}

// لما نوع الكارتة يتغير (مصنع ↔ أخضر) أي اختيار مش موجود في القائمة الجديدة يرجع لأول اختيار
function fixSelectValues(form, cols){
  const next = {...form};
  cols.forEach(c=>{
    if(c.type !== 'select' || !c.options || !c.options.length) return;
    const vals = c.options.map(o=> typeof o==='object' ? o.value : o);
    if(!vals.includes(next[c.key])) next[c.key] = vals[0];
  });
  return next;
}
// دمج أعمدة نوعين من الكروت (مصنع + أخضر) في جدول واحد
function mergeColumns(a, b){
  const out = a.map(c=>({...c}));
  b.forEach((c, i)=>{
    const ex = out.find(x=>x.key===c.key);
    if(ex){ if(ex.label !== c.label) ex.label = ex.label + ' / ' + c.label; return; }
    const prevKey = i>0 ? b[i-1].key : null;
    const at = prevKey ? out.findIndex(x=>x.key===prevKey) + 1 : 0;
    out.splice(at, 0, {...c});
  });
  return out;
}

const PERSON_PRICE_GROUPS = {
  jalab: [
    { unit: 'بالكوز', items: ['فرنساوي', 'بلدي', 'غير ذلك', 'عام'] },
    { unit: 'بالطن', items: ['طن'] },
  ],
  factory: [

    { unit: 'بالكيلو — درجة ثانية', items: ['قطع (ثانية)', 'كاسات (ثانية)', 'قرص (ثانية)', 'حشو (ثانية)', 'شرايح (ثانية)', 'حدوة (ثانية)'] },
    { unit: 'أخضر بالكوز', items: ['فرنساوي', 'بلدي', 'فرزة'] },
  ],
};
PERSON_PRICE_GROUPS.raseef = PERSON_PRICE_GROUPS.factory;
const PERSON_ITEM_LABEL = { 'عام': 'عام (أي نوع)', 'طن': 'سعر الطن' };

function PersonWeeklyPricing({ person, personType, onSavePrices, onClose }){
  const [weekStart, setWeekStart] = useState(getWeekStart(todayStr()));
  const groups = PERSON_PRICE_GROUPS[personType] || PERSON_PRICE_GROUPS.factory;
  const hasDiscount = personType !== 'jalab';
  const existingWeek = (person.weeklyPrices || []).find(w => w.weekStart === weekStart);
  const active = getPersonWeeklyConfig(person, weekStart);
  const [draftPrices, setDraftPrices] = useState({});
  const [discount, setDiscount] = useState(0);

  useEffect(()=>{
    const ex = (person.weeklyPrices || []).find(w => w.weekStart === weekStart);
    const act = getPersonWeeklyConfig(person, weekStart);
    setDraftPrices(ex ? {...ex.prices} : (act ? {...act.prices} : {}));
    setDiscount(ex ? (ex.discount || 0) : (act ? (act.discount || 0) : 0));
  }, [weekStart, person]);

  async function save(){
    const others = (person.weeklyPrices || []).filter(w => w.weekStart !== weekStart);
    const updated = [...others, { weekStart, prices: draftPrices, discount: parseFloat(discount)||0 }];
    try{ await onSavePrices(updated); notify('اتحفظ تسعير أسبوع ' + getWeekRangeLabel(weekStart) + ' لـ ' + person.name); }
    catch(e){ notify('ماتحفظش التسعير: ' + e.message, {tone:'error'}); }
  }
  async function deleteWeek(ws){
    if(!(await askConfirm('مسح التسعير الخاص بأسبوع '+getWeekRangeLabel(ws)+'؟ العمليات هترجع تاخد السعر العام أو الأسبوع اللي قبله.', {danger:true, confirmText:'امسح'}))) return;
    try{ await onSavePrices((person.weeklyPrices || []).filter(w => w.weekStart !== ws)); }catch(e){ notify('ماتمسحش: ' + e.message, {tone:'error'}); }
  }
  const savedWeeks = (person.weeklyPrices || []).slice().sort((a,b) => (b.weekStart||'').localeCompare(a.weekStart||''));
  const sourceText = existingWeek ? 'متسجل للأسبوع ده' : (active ? 'مش متسجل — المعروض ماخوذ من أسبوع '+getWeekRangeLabel(active.weekStart) : 'مفيش تسعير خاص — بيتحسب بالسعر العام');

  return (
    <div className="bg-white rounded-2xl shadow-card border border-gold/40 p-5 rise">
      <div className="flex items-start justify-between flex-wrap gap-3 mb-4">
        <div>
          <h3 className="font-bold text-leaf-deep text-base">تسعير خاص بـ {person.name}</h3>
          <p className="text-xs text-ink/70">بيتطبق على عمليات الأسبوع ده والأسابيع اللي بعده لحد ما يتغير.</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <div className="w-40"><DateInput value={weekStart} onChange={e=>e.target.value && setWeekStart(getWeekStart(e.target.value))} aria-label="اختر الأسبوع"/></div>
          <span className="text-xs text-leaf-deep font-bold bg-leaf-pale/60 px-2 py-1 rounded-lg">أسبوع {getWeekRangeLabel(weekStart)}</span>
          {onClose && <button onClick={onClose} className="text-xs text-ink/70 px-2 py-1">إغلاق</button>}
        </div>
      </div>
      <p className={`text-xs font-bold mb-3 ${existingWeek?'text-leaf-mid':'text-gold-dark'}`}>{sourceText}</p>
      {groups.map(g=>(
        <div key={g.unit} className="mb-4">
          <div className="text-xs font-bold text-ink/70 mb-2">{g.unit}</div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
            {g.items.map(it => (
              <label key={g.unit+it} className="block">
                <span className="block text-xs text-ink/70 mb-1">{PERSON_ITEM_LABEL[it]||it}</span>
                <input type="number" inputMode="decimal" value={draftPrices[it] !== undefined ? draftPrices[it] : ''}
                  onChange={e => setDraftPrices({...draftPrices, [it]: e.target.value === '' ? '' : parseFloat(e.target.value)})}
                  placeholder="—" className="w-full rounded-lg border border-leaf-line px-2.5 py-2 text-sm num"/>
              </label>
            ))}
          </div>
        </div>
      ))}
      {hasDiscount && (
        <label className="block max-w-[160px] mb-4">
          <span className="block text-xs font-bold text-rust mb-1">نسبة الخصم %</span>
          <input type="number" inputMode="decimal" value={discount} onChange={e=>setDiscount(e.target.value)} className="w-full rounded-lg border border-rust/40 px-2.5 py-2 text-sm num text-rust font-bold"/>
        </label>
      )}
      <button onClick={save} className="bg-leaf-deep hover:bg-leaf-mid text-cream text-sm rounded-xl px-5 py-2.5 font-bold flex items-center gap-2"><Icon name="check" className="w-4 h-4"/>حفظ أسعار الأسبوع ده</button>

      {savedWeeks.length > 0 && (
        <div className="mt-5">
          <h4 className="font-bold text-sm text-leaf-deep mb-2">أسابيع متسعّرة</h4>
          <div className="flex flex-wrap gap-2">
            {savedWeeks.map(w=>(
              <span key={w.weekStart} className={`text-xs px-3 py-1.5 rounded-xl border flex items-center gap-2 ${w.weekStart===weekStart?'bg-leaf-deep text-cream border-leaf-deep':'border-leaf-line text-ink/75'}`}>
                <button onClick={()=>setWeekStart(w.weekStart)}>{getWeekRangeLabel(w.weekStart)}</button>
                <button onClick={()=>deleteWeek(w.weekStart)} aria-label="مسح تسعير الأسبوع" className="opacity-70 hover:opacity-100"><Icon name="trash" className="w-3.5 h-3.5"/></button>
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------- كشف الحساب (PDF) ---------------------------------------------------------- */
function buildStatementHtml({ person, personLabel, paymentsLabel, tableColumns, rowColumnsFor, calc, db, from, to, direction, earnedLabel, paidLabel, number }){
  const p = person;
  const inRange = d => (!from || (d||'') >= from) && (!to || (d||'') <= to);
  const entries = p.entries.filter(e=>inRange(e.date));
  const payments = p.payments.filter(x=>inRange(x.date));
  const period = personTotals({...p, entries, payments, openingBalance: 0}, calc, db);
  // الرصيد المرحّل: الرصيد الافتتاحي للموسم + كل اللي قبل بداية الفترة
  const before = from ? personTotals({...p, entries: p.entries.filter(e=>(e.date||'') < from), payments: p.payments.filter(x=>(x.date||'') < from)}, calc, db) : null;
  const opening = before ? before.remaining : (parseFloat(p.openingBalance)||0);
  const finalBalance = opening + period.earned - period.paid;
  const bal = balanceInfo(finalBalance, direction);
  const box = (label, value, bg, color) => `<div style="flex:1; background:${bg}; color:${color}; border-radius:12px; padding:12px; text-align:center;"><div style="font-size:11px; opacity:.85;">${escHtml(label)}</div><div style="font-weight:900; font-size:16px;">${num(value)}</div></div>`;
  const rangeLabel = (from || to) ? `الفترة: من ${from?formatDateShort(from):'البداية'} إلى ${to?formatDateShort(to):'النهارده'}` : 'كشف شامل';
  const headers = ['التاريخ', ...tableColumns.map(c=>c.label), 'الإجمالي'];
  const rows = entries.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>{
    const own = rowColumnsFor(e);
    const total = calc(e, getPriceSetForDate(db,e.date), p);
    return [
      formatDateWithDay(e.date),
      ...tableColumns.map(c=>{
        if(c.pdf) return c.pdf(e, p);
        if(!own.some(x=>x.key===c.key)) return '—';
        const v = e[c.key];
        if(c.type==='checkbox') return v?'نعم':'لا';
        if(v===''||v===undefined||v===null) return '—';
        return c.type==='number' ? num(v) : v;
      }),
      isMissingPrice(e, total) ? 'بدون سعر' : num(total)
    ];
  });
  const payRows = payments.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(x=>[formatDateWithDay(x.date), num(x.amount), x.note||'—']);
  // ملخص الأسابيع برصيد تراكمي
  const weeks = weekSummaries({...p, entries, payments, openingBalance: opening}, calc, db);
  const weekRows = weeks.map(w=>[getWeekRangeLabel(w.weekStart), num(w.earned), num(w.paid), (balanceInfo(w.balance, direction).short)+' '+num(Math.abs(w.balance))]);
  const missingNote = period.missing ? `<div style="background:#FDECEA; color:#A12622; border-radius:10px; padding:10px 12px; font-size:12px; margin-bottom:12px;">فيه ${period.missing} عملية ملهاش سعر لسه — مش داخلة في الإجمالي.</div>` : '';
  return `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
      <div>
        <div style="font-size:22px; font-weight:900; color:#25422C;">كشف حساب — ${escHtml(personLabel)}</div>
        <div style="font-size:17px; font-weight:700; color:#3D6144; margin-top:2px;">${escHtml(p.name)}</div>
      </div>
      <div style="text-align:left; font-size:12px; color:#555;">رقم الكشف<br/><b style="font-size:15px; color:#25422C;">${number}</b></div>
    </div>
    <div style="font-size:12px; color:#666; margin-bottom:14px;">${rangeLabel}</div>
    ${missingNote}
    <div style="display:flex; gap:10px; margin-bottom:18px;">
      ${box(from ? 'رصيد مرحّل قبل الفترة' : 'رصيد أول الموسم', opening, '#EEF2EA', '#25422C')}
      ${box(earnedLabel, period.earned, '#F8FAFC', '#23302B')}
      ${box(paidLabel, period.paid, '#FEF3C7', '#92400E')}
      ${box('الرصيد: '+bal.text, bal.amount, bal.tone==='rust'?'#C62828':(bal.tone==='gold'?'#A57B36':'#19432B'), '#fff')}
    </div>
    <div style="font-size:13px; font-weight:700; color:#25422C;">ملخص الأسابيع</div>
    ${pdfTable(['الأسبوع', earnedLabel, paidLabel, 'الرصيد في آخر الأسبوع'], weekRows)}
    <div style="font-size:13px; font-weight:700; color:#25422C;">تفاصيل العمليات (${entries.length})</div>
    ${pdfTable(headers, rows)}
    <div style="font-size:13px; font-weight:700; color:#25422C;">${escHtml(paymentsLabel||'المدفوعات')} (${payments.length})</div>
    ${pdfTable(['التاريخ','المبلغ','ملاحظة'], payRows)}
    <div style="margin-top:14px; font-size:12px; color:#444; border-top:1px dashed #ccc; padding-top:10px;">للتأكيد على الكشف ده ابعت: «تم استلام كشف رقم ${number}»</div>`;
}

/* ---------------------------------------------------------- قائمة الأشخاص ---------------------------------------------------------- */
function PersonList({ people, selected, setSelected, personLabel, totalsOf, direction, onAdd }){
  const [q,setQ] = useState('');
  const [sort,setSort] = useState('name');
  const [onlyOpen,setOnlyOpen] = useState(false);
  const [newName,setNewName]=useState('');
  const rows = people.map(p=>({ p, t: totalsOf(p) }))
    .filter(r=>!q.trim() || r.p.name.includes(q.trim()))
    .filter(r=>!onlyOpen || Math.abs(r.t.remaining) >= 0.005)
    .sort((a,b)=> sort==='balance' ? (b.t.remaining - a.t.remaining) : a.p.name.localeCompare(b.p.name, 'ar'));
  async function add(){ if(!newName.trim()) return; const ok = await onAdd(newName.trim()); if(ok) setNewName(''); }
  return (
    <div className="lg:w-80 shrink-0 bg-white/90 rounded-3xl shadow-card border border-leaf-line/30 p-4 h-fit">
      <div className="flex gap-2 mb-3">
        <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder={'اسم '+personLabel+' جديد'} onKeyDown={e=>e.key==='Enter' && add()}
          className="flex-1 min-w-0 rounded-xl border border-leaf-line/60 px-3 py-2.5 text-sm" aria-label={'اسم '+personLabel+' جديد'}/>
        <button onClick={add} className="bg-leaf-deep text-cream rounded-xl px-3.5" aria-label={'إضافة '+personLabel}><Icon name="plus" className="w-5 h-5"/></button>
      </div>
      {people.length > 3 && (
        <div className="space-y-2 mb-3">
          <div className="relative">
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="دوّر بالاسم" className="w-full rounded-xl border border-leaf-line/60 pr-9 pl-3 py-2 text-sm" aria-label="بحث بالاسم"/>
            <Icon name="search" className="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-ink/50"/>
          </div>
          <div className="flex items-center gap-2 text-xs">
            <select value={sort} onChange={e=>setSort(e.target.value)} className="rounded-lg border border-leaf-line px-2 py-1.5" aria-label="الترتيب">
              <option value="name">ترتيب بالاسم</option>
              <option value="balance">ترتيب بالرصيد</option>
            </select>
            <label className="flex items-center gap-1.5"><input type="checkbox" checked={onlyOpen} onChange={e=>setOnlyOpen(e.target.checked)}/>اللي عليهم/ليهم فلوس بس</label>
          </div>
        </div>
      )}
      {people.length===0 && <p className="text-sm text-ink/60 text-center py-6">لسه مفيش {personLabel} مسجل</p>}
      <div className="space-y-1 max-h-[60vh] overflow-y-auto">
        {rows.map(({p,t})=>(
          <button key={p.id} onClick={()=>setSelected(p.id)} aria-current={selected===p.id?'true':undefined}
            className={`w-full text-right px-3.5 py-3 rounded-2xl flex items-center justify-between gap-2 ${selected===p.id?'bg-leaf-pale/80 border border-leaf-line/60':'hover:bg-creamdark/30 border border-transparent'}`}>
            <span className="font-bold text-[15px] truncate">{p.name}</span>
            <span className="flex items-center gap-1 shrink-0">
              {t.missing>0 && <span title="فيه عمليات بدون سعر" className="w-2 h-2 rounded-full bg-rust"/>}
              <BalanceBadge remaining={t.remaining} direction={direction}/>
            </span>
          </button>
        ))}
        {people.length>0 && rows.length===0 && <p className="text-xs text-ink/60 text-center py-4">مفيش نتايج</p>}
      </div>
    </div>
  );
}

function WeekSummaryTable({ weeks, direction, earnedLabel, paidLabel }){
  if(!weeks.length) return null;
  return (
    <div className="overflow-x-auto rounded-xl border border-leaf-line/20">
      <table className="w-full text-sm">
        <thead><tr className="bg-cream/80 text-leaf-deep text-xs font-bold">
          <th className="text-right py-2 px-3">الأسبوع</th><th className="text-right py-2 px-3">{earnedLabel}</th><th className="text-right py-2 px-3">{paidLabel}</th><th className="text-right py-2 px-3">الرصيد آخر الأسبوع</th>
        </tr></thead>
        <tbody>
          {weeks.slice().reverse().map(w=>(
            <tr key={w.weekStart} className="border-t border-leaf-line/10">
              <td className="py-2 px-3 font-bold whitespace-nowrap">{getWeekRangeLabel(w.weekStart)}{w.missing>0 && <span className="text-rust text-xs mr-1">({w.missing} بدون سعر)</span>}</td>
              <td className="py-2 px-3 num">{num(w.earned)}</td>
              <td className="py-2 px-3 num">{num(w.paid)}</td>
              <td className="py-2 px-3"><BalanceBadge remaining={w.balance} direction={direction}/></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ---------------------------------------------------------- PERSON ACCOUNT (generic) ---------------------------------------------------------- */
function PersonAccount(props){
  const {title, icon, personLabel, entryLabel, paymentsLabel, entryColumns, extraColumns, calcEntryTotal, db, people, setPeople,
    weeklyGrouping, weeklyQtyText, hideHeader, remote, verse, showWeeklyPricing, personType,
    direction='payable', earnedLabel='المستحق', paidLabel='المدفوع', columnVisible, afterAddEntry} = props;
  // على الموبايل بنبدأ بالقائمة، وعلى الشاشة الكبيرة بأول شخص
  const [selected,setSelected]=useState(()=> (window.innerWidth >= 1024 || people.length === 1) ? (people[0]?.id || null) : null);
  const [entryForm,setEntryForm]=useState({});
  const [invalid,setInvalid]=useState({});
  const [paymentForm,setPaymentForm]=useState({date:todayStr(), amount:'', note:''});
  const [payInvalid,setPayInvalid]=useState(false);
  const [from,setFrom]=useState('');
  const [to,setTo]=useState('');
  const [showPricing,setShowPricing]=useState(false);
  const [menuOpen,setMenuOpen]=useState(false);
  const [showWeeks,setShowWeeks]=useState(false);
  const [showMore,setShowMore]=useState(false);
  const [showPeriod,setShowPeriod]=useState(false);
  const formRef = React.useRef(null);

  const isFn = typeof entryColumns === 'function';
  const activeColumns = isFn ? entryColumns(entryForm) : entryColumns;
  const rowColumnsFor = row => (isFn ? entryColumns(row||{}) : entryColumns).filter(c=>!c.formOnly);
  const baseTableColumns = (isFn ? mergeColumns(entryColumns({kind:'مصنع'}), entryColumns({kind:'أخضر'})) : entryColumns).filter(c=>!c.formOnly);

  function defaultEntryForm(prev){
    const f = { date: (prev && prev.date) || todayStr() };
    (isFn ? entryColumns(f) : entryColumns).forEach(c=>{
      f[c.key] = c.type==='checkbox' ? !!c.defaultChecked : (c.options ? (typeof c.options[0]==='object' ? c.options[0].value : c.options[0]) : '');
    });
    return isFn ? fixSelectValues(f, entryColumns(f)) : f;
  }
  useEffect(()=>{ if(Object.keys(entryForm).length === 0) setEntryForm(defaultEntryForm()); }, []);
  useEffect(()=>{ if(selected && !people.some(p=>p.id===selected)) setSelected(null); }, [people]);

  const person = people.find(p=>p.id===selected) || null;
  const totalsOf = p => personTotals(p, calcEntryTotal, db);
  const setPerson = (id, fn) => setPeople(prev => prev.map(p => p.id===id ? fn(p) : p));

  async function confirmLocked(date){
    if(!isWeekLocked(db, date)) return true;
    return askConfirm('أسبوع '+getWeekRangeLabel(getWeekStart(date))+' مقفول.\nأي تعديل فيه هيغيّر كشوف اتبعتت قبل كده. تكمل؟', {title:'أسبوع مقفول', confirmText:'أيوه، كمّل'});
  }

  async function addPerson(name){
    try{ const p = await remote.addPerson(name); setPeople(prev=>[...prev, p]); setSelected(p.id); return true; }
    catch(e){ notify(e.message, {tone:'error'}); return false; }
  }
  function removePerson(){
    const p = person; if(!p) return;
    setMenuOpen(false);
    setPeople(prev=>prev.filter(x=>x.id!==p.id)); setSelected(null);
    scheduleDelete(`اتمسح «${p.name}» وكل حسابه`, ()=>remote.deletePerson(p.id), ()=>{ setPeople(prev=>[...prev, p]); setSelected(p.id); });
  }

  async function addEntry(){
    if(!person) return;
    const bad = {};
    if(!entryForm.date) bad.date = true;
    activeColumns.forEach(c=>{ if(c.required && !(parseFloat(entryForm[c.key]) > 0)) bad[c.key] = true; });
    if(Object.keys(bad).length){ setInvalid(bad); notify('كمّل الخانات اللي باللون الأحمر', {tone:'error'}); return; }
    setInvalid({});
    if(personType === 'worker' && (person.entries||[]).some(e=>e.date===entryForm.date)){
      notify('اليوم ده متسجل بالفعل للنفر ده — عدّل القيد الموجود', {tone:'error'}); return;
    }
    if(!(await confirmLocked(entryForm.date))) return;
    try{
      const e = await remote.addEntry(person.id, entryForm);
      setPerson(person.id, p=>({...p, entries:[e, ...p.entries]}));
      if(afterAddEntry){ try{ await afterAddEntry(person, entryForm, e); }catch(err){ notify(err.message, {tone:'error'}); } }
      setEntryForm(defaultEntryForm(entryForm));
      const t = calcEntryTotal(e, getPriceSetForDate(db, e.date), person);
      notify(isMissingPrice(e, t) ? 'اتضافت — بس ملهاش سعر لسه' : 'اتضافت: '+fmtNum(t)+' جنيه');
      setTimeout(()=>{ const el = formRef.current && formRef.current.querySelector('input[type=number]'); if(el) el.focus(); }, 60);
    }catch(err){ notify(err.message, {tone:'error'}); }
  }
  async function editEntry(id, draft){
    const old = person.entries.find(e=>e.id===id);
    if(!(await confirmLocked(old && old.date)) || !(await confirmLocked(draft.date))) return;
    try{ const updated = await remote.updateEntry(id, draft); setPerson(person.id, p=>({...p, entries:p.entries.map(e=>e.id===id?updated:e)})); notify('اتعدّل'); }
    catch(err){ notify(err.message, {tone:'error'}); }
  }
  async function removeEntry(id){
    const pid = person.id; const old = person.entries.find(e=>e.id===id);
    if(!(await confirmLocked(old && old.date))) return;
    setPerson(pid, p=>({...p, entries:p.entries.filter(e=>e.id!==id)}));
    scheduleDelete('اتمسحت العملية', ()=>remote.deleteEntry(id), ()=>setPerson(pid, p=>({...p, entries:[old, ...p.entries]})));
  }
  async function addPayment(){
    if(!(parseFloat(paymentForm.amount) > 0) || !paymentForm.date){ setPayInvalid(true); notify('اكتب مبلغ الدفعة', {tone:'error'}); return; }
    setPayInvalid(false);
    if(!(await confirmLocked(paymentForm.date))) return;
    try{
      const x = await remote.addPayment(person.id, paymentForm);
      setPerson(person.id, p=>({...p, payments:[x, ...p.payments]}));
      setPaymentForm({date:paymentForm.date, amount:'', note:''});
    }catch(err){ notify(err.message, {tone:'error'}); }
  }
  async function editPayment(id, draft){
    const old = person.payments.find(x=>x.id===id);
    if(!(await confirmLocked(old && old.date)) || !(await confirmLocked(draft.date))) return;
    try{ const updated = await remote.updatePayment(id, draft); setPerson(person.id, p=>({...p, payments:p.payments.map(x=>x.id===id?updated:x)})); notify('اتعدّل'); }
    catch(err){ notify(err.message, {tone:'error'}); }
  }
  async function removePayment(id){
    const pid = person.id; const old = person.payments.find(x=>x.id===id);
    if(!(await confirmLocked(old && old.date))) return;
    setPerson(pid, p=>({...p, payments:p.payments.filter(x=>x.id!==id)}));
    scheduleDelete('اتمسحت الدفعة', ()=>remote.deletePayment(id), ()=>setPerson(pid, p=>({...p, payments:[old, ...p.payments]})));
  }

  function statement(p){
    const number = nextStatementNumber();
    const html = buildStatementHtml({ person:p, personLabel, paymentsLabel, tableColumns: visibleColumns(p).filter(c=>!c.computed || c.pdf), rowColumnsFor, calc: calcEntryTotal, db, from, to, direction, earnedLabel, paidLabel, number });
    const t = personTotals(p, calcEntryTotal, db);
    const b = balanceInfo(t.remaining, direction);
    const text = `كشف حساب رقم ${number}\n${p.name}\nالرصيد: ${b.text} ${fmtNum(b.amount)} جنيه\nللتأكيد ابعت: تم استلام كشف رقم ${number}`;
    return { html, number, text };
  }
  async function downloadStatement(p){ const s = statement(p); await downloadPdf(s.html, `${p.name} - كشف ${s.number}.pdf`); }
  async function shareStatement(p){ const s = statement(p); await sharePdf(s.html, `${p.name} - كشف ${s.number}.pdf`, s.text); }

  function visibleColumns(p){
    const cols = [...baseTableColumns, ...(extraColumns||[])];
    return cols.filter(c => !columnVisible || columnVisible(c.key, p));
  }

  async function savePersonPrices(weeklyPrices){
    await remote.saveWeeklyPrices(person.id, weeklyPrices);
    setPerson(person.id, p=>({...p, weeklyPrices}));
  }

  const totalCol = {key:'_total', label:'الإجمالي', computed:true, isTotal:true, render: row=>{
    const t = calcEntryTotal(row, getPriceSetForDate(db,row.date), person);
    return isMissingPrice(row, t) ? <span className="text-rust font-bold">بدون سعر</span> : num(t);
  }};
  const tableCols = person ? [{key:'date',label:'التاريخ',type:'date'}, ...visibleColumns(person), totalCol] : [];
  const lockedRow = row => isWeekLocked(db, row.date) ? 'bg-creamdark/30' : '';

  return (
    <div className={hideHeader?'':'p-4 md:p-8'}>
      {!hideHeader && <VerseHeader text={verse}/>}
      {!hideHeader && <h1 className="hidden md:flex font-display text-3xl text-leaf-deep mb-5 items-center gap-2"><Icon name={icon} className="w-7 h-7"/>{title}</h1>}

      <div className="flex flex-col lg:flex-row gap-5">
        <div className={`lg:w-80 shrink-0 ${person ? 'hidden lg:block' : ''}`}>
          <PersonList people={people} selected={selected} setSelected={id=>{setSelected(id); setShowPricing(false); setMenuOpen(false); setShowPeriod(false); window.scrollTo(0,0);}} personLabel={personLabel} totalsOf={totalsOf} direction={direction} onAdd={addPerson}/>
        </div>

        <div className="flex-1 min-w-0">
          {!person && (
            <div className="hidden lg:block bg-white/70 border border-dashed border-leaf-line rounded-2xl p-10 text-center text-ink/70">
              {people.length ? <>اختار {personLabel} من القائمة عشان تشوف حسابه</> : <><b className="block text-leaf-deep text-base mb-1">ابدأ بأول {personLabel}</b>اكتب الاسم في الخانة اللي على اليمين واضغط +</>}
            </div>
          )}
          {person && (()=>{
            const t = totalsOf(person);
            const b = balanceInfo(t.remaining, direction);
            const weeks = weekSummaries(person, calcEntryTotal, db);
            return (
            <div className="space-y-4 md:space-y-5">
              <div className="bg-white/95 rounded-3xl p-4 md:p-5 shadow-card border border-leaf-line/30">
                <button onClick={()=>setSelected(null)} className="lg:hidden text-sm text-leaf-mid font-bold mb-2 flex items-center gap-1 -mt-1 py-1">‹ كل القائمة</button>
                <div className="flex items-start justify-between gap-3 flex-wrap">
                  <div>
                    <h2 className="text-2xl font-bold text-ink">{person.name}</h2>
                    <button onClick={()=>setShowPeriod(v=>!v)} className="text-xs text-ink/70 mt-0.5 flex items-center gap-1 hover:text-leaf-deep" aria-expanded={showPeriod}>
                      <Icon name="search" className="w-3.5 h-3.5"/>فترة الكشف: <b>{(from||to) ? `${from?formatDateShort(from):'البداية'} ← ${to?formatDateShort(to):'النهارده'}` : 'كل الفترة'}</b>
                    </button>
                  </div>
                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    {showWeeklyPricing && <button onClick={()=>setShowPricing(v=>!v)} className={`flex-1 sm:flex-none justify-center text-xs px-3 py-2.5 rounded-2xl border font-bold flex items-center gap-1.5 ${showPricing?'bg-gold text-white border-gold':'border-gold/50 text-gold-dark bg-white'}`}><Icon name="tag" className="w-4 h-4 shrink-0"/><span className="whitespace-nowrap">تسعير<span className="hidden sm:inline"> خاص</span></span></button>}
                    <button onClick={()=>downloadStatement(person)} className="flex-1 sm:flex-none justify-center text-xs px-3 py-2.5 rounded-2xl border border-leaf-line/60 flex items-center gap-1.5 text-leaf-deep bg-white font-bold"><Icon name="download" className="w-4 h-4 shrink-0"/><span className="whitespace-nowrap"><span className="hidden sm:inline">كشف </span>PDF</span></button>
                    <button onClick={()=>shareStatement(person)} className="flex-1 sm:flex-none justify-center text-xs px-3 py-2.5 rounded-2xl border border-[#25D366]/40 flex items-center gap-1.5 text-[#128C7E] bg-white font-bold"><Icon name="whatsapp" className="w-4 h-4"/>واتساب</button>
                    <div className="relative">
                      <button onClick={()=>setMenuOpen(v=>!v)} className="p-2.5 rounded-2xl border border-leaf-line/60 text-ink/70 bg-white" aria-label="خيارات أكتر" aria-expanded={menuOpen}><Icon name="dots" className="w-4 h-4"/></button>
                      {menuOpen && (
                        <div className="absolute left-0 mt-1 w-52 bg-white rounded-xl shadow-card-hover border border-leaf-line/40 z-10 overflow-hidden">
                          <button onClick={removePerson} className="w-full text-right px-4 py-3 text-sm text-rust hover:bg-rust/10 flex items-center gap-2"><Icon name="trash" className="w-4 h-4"/>حذف {personLabel} وكل حسابه</button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
                {showPeriod && <div className="flex items-center gap-2 flex-wrap mt-3 text-xs bg-cream/60 rounded-xl p-2">
                  <span className="text-ink/70 font-bold">فترة الكشف:</span>
                  <div className="w-36"><DateInput value={from} onChange={e=>setFrom(e.target.value)} placeholder="من البداية"/></div>
                  <span className="text-ink/60">إلى</span>
                  <div className="w-36"><DateInput value={to} onChange={e=>setTo(e.target.value)} placeholder="لحد النهارده"/></div>
                  {(from||to) && <button onClick={()=>{setFrom('');setTo('');}} className="text-leaf-mid underline">كل الفترة</button>}
                </div>}
              </div>

              {showPricing && showWeeklyPricing && <PersonWeeklyPricing person={person} personType={personType} onSavePrices={savePersonPrices} onClose={()=>setShowPricing(false)}/>}

              <div className={`grid ${t.opening?'grid-cols-2':'grid-cols-3'} sm:grid-cols-4 gap-2 md:gap-3`}>
                {t.opening ? <div className="bg-white rounded-xl border border-leaf-line/30 p-3 text-center"><div className="text-xs text-ink/65 mb-1">رصيد أول الموسم</div><div className="font-bold num">{num(t.opening)}</div></div> : null}
                <div className="bg-white rounded-xl border border-leaf-line/30 p-3 text-center"><div className="text-xs text-ink/65 mb-1">{earnedLabel}</div><div className="font-bold num">{num(t.earned)}</div></div>
                <div className="bg-white rounded-xl border border-leaf-line/30 p-3 text-center"><div className="text-xs text-ink/65 mb-1">{paidLabel}</div><div className="font-bold num text-gold-dark">{num(t.paid)}</div></div>
                <div className={`rounded-xl p-3 text-center text-white ${t.opening?'':'col-span-1'} ${b.tone==='rust'?'bg-rust':b.tone==='gold'?'bg-gold':'bg-leaf-deep'}`}><div className="text-xs opacity-90 mb-1">{b.text}</div><div className="font-bold num text-lg">{num(b.amount)}</div></div>
              </div>

              {t.missing > 0 && (
                <div className="bg-rust/10 border border-rust/30 text-rust rounded-xl px-4 py-3 text-sm font-bold">
                  فيه {t.missing} عملية ملهاش سعر — مش داخلة في الحساب. حط سعر من صفحة «التسعير»{showWeeklyPricing?' أو «تسعير خاص»':''} أو اكتب سعر في العملية نفسها.
                </div>
              )}

              {personType === 'worker' && (()=>{
                const present = person.entries.filter(e => e.present).length;
                const absent = person.entries.filter(e => !e.present).length;
                return (
                  <div className="grid grid-cols-2 gap-3">
                    <StatCard label="أيام حضور" value={num(present)+' يوم'} icon="check" tone="leaf"/>
                    <StatCard label="أيام غياب" value={num(absent)+' يوم'} icon="debt" tone="rust"/>
                  </div>
                );
              })()}

              {(personType === 'sakina_worker' || personType === 'takhrit') && (
                <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
                  <h3 className="font-bold text-sm text-leaf-deep mb-3 flex items-center gap-2"><Icon name="box" className="w-4 h-4"/>إنتاج {person.name} حسب الصنف</h3>
                  {personType === 'sakina_worker' ? (
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                      {['هارت','كاسات','حشو'].flatMap(it=>[[it,false],[it,true]]).map(([it,peel]) => {
                        const count = person.entries.filter(e=>e.itemType===it && !!e.tookPeel===peel).reduce((s, e) => s + (parseFloat(e.pieces) || 0), 0);
                        return <div key={it+peel} className="bg-cream/60 border border-leaf-line/30 rounded-xl p-2.5"><div className="text-xs text-ink/70 font-bold mb-0.5">{it} ({peel?'مع القشر':'من غير قشر'})</div><div className="text-sm font-black text-leaf-deep num">{num(count)} قطعة</div></div>;
                      })}
                    </div>

                  <EditableTable

                    rows={person.payments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))} onUpdate={editPayment} onDelete={removePayment} emptyLabel="لسه مفيش دفعات" person={person} rowClass={lockedRow}/>
