                </button>
                {showWeeks && <div className="mt-3"><WeekSummaryTable weeks={weeks} direction={direction} earnedLabel={earnedLabel} paidLabel={paidLabel}/></div>}
              </div>
            </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- الاتصال بالبيانات لأي قسم ---------------------------------------------------------- */
function makePersonRemote(apiKey, fields, opts={}){
  const listPath = opts.listPath || ('/api/'+apiKey);
  const itemKey = opts.itemKey || apiKey;           // مسار الشخص الواحد
  const nestedKey = opts.nestedKey || apiKey;       // بداية مسار تعديل القيود والدفعات
  return {
    load: async ()=> (await apiFetch(listPath)).map(row=>mapPersonFromServer(row, fields)),
    addPerson: async (name)=>{ const p = await apiFetch(listPath, {method:'POST', body:JSON.stringify({name})}); return mapPersonFromServer(p, fields); },
    deletePerson: async (id)=>{ await apiFetch(`/api/${itemKey}/${id}`, {method:'DELETE'}); },
    addEntry: async (personId, form)=> mapEntryFromServer(await apiFetch(`/api/${itemKey}/${personId}/entries`, {method:'POST', body:JSON.stringify(mapEntryToServer(form, fields))}), fields),
    updateEntry: async (entryId, draft)=> mapEntryFromServer(await apiFetch(`/api/${nestedKey}-entries/${entryId}`, {method:'PUT', body:JSON.stringify(mapEntryToServer(draft, fields))}), fields),
    deleteEntry: async (entryId)=>{ await apiFetch(`/api/${nestedKey}-entries/${entryId}`, {method:'DELETE'}); },
    addPayment: async (personId, form)=> mapPaymentFromServer(await apiFetch(`/api/${itemKey}/${personId}/payments`, {method:'POST', body:JSON.stringify(mapPaymentToServer(form))})),
    updatePayment: async (paymentId, draft)=> mapPaymentFromServer(await apiFetch(`/api/${nestedKey}-payments/${paymentId}`, {method:'PUT', body:JSON.stringify(mapPaymentToServer(draft))})),
    deletePayment: async (paymentId)=>{ await apiFetch(`/api/${nestedKey}-payments/${paymentId}`, {method:'DELETE'}); },
    saveWeeklyPrices: async (personId, weeklyPrices)=>{ await apiFetch(`/api/${itemKey}/${personId}`, {method:'PUT', body:JSON.stringify({ weekly_prices: weeklyPrices })}); },
  };
}

function ConnectedPersonPage(props){
  const [people,setPeople] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{ setPeople(await props.remote.load()); }catch(e){ setError(e.message); }
    setLoading(false);
  }
  if(loading) return <LoadingBox/>;
  if(error) return <ErrorBox error={error} onRetry={load}/>;
  return <PersonAccount {...props} people={people} setPeople={setPeople}/>;
}

const priceTag = (text, cls) => <span className={`text-xs font-bold px-1.5 py-0.5 rounded-md mr-1 ${cls}`}>{text}</span>;

function JalabaPage({db}){
  const entryColumns = [
    {key:'kuz', label:'الكمية', type:'number', required:true, render:row=>row.kuz===''||row.kuz==null?'—':num(row.kuz)+' '+(row.unit==='طن'?'طن':'كوز')},
    {key:'unit', label:'الوحدة', type:'select', options:['كوز','طن']},
    {key:'itemType', label:'نوع الخرشوف', type:'select', options:['بلدي','فرنساوي','غير ذلك']},
    {key:'price', label:'السعر', formLabel:'سعر خاص (اختياري)', placeholder:'فاضي = سعر الأسبوع', type:'number', optional:true,
      render:(row, person)=>{
        const q = parseFloat(row.kuz)||0; const t = calcJalabEntry(row, getPriceSetForDate(db,row.date), person);
        if(isMissingPrice(row, t)) return <span className="text-rust font-bold">بدون سعر</span>;
        return <span className="num">{toNum(row.price)!==null && priceTag('يدوي','bg-gold/15 text-gold-dark')}{num(q ? t/q : 0)}</span>;
      },
      pdf:(row, person)=>{ const q = parseFloat(row.kuz)||0; const t = calcJalabEntry(row, getPriceSetForDate(db,row.date), person); return isMissingPrice(row,t) ? 'بدون سعر' : num(q ? t/q : 0); }
    },
  ];
  const remote = makePersonRemote('jalaba', SECTION_FIELDS.jalaba);
  const weeklyQtyText = items => {
    const k = items.filter(e=>e.unit!=='طن').reduce((s,e)=>s+(parseFloat(e.kuz)||0),0);
    const t = items.filter(e=>e.unit==='طن').reduce((s,e)=>s+(parseFloat(e.kuz)||0),0);
    return [k ? `${fmtNum(k)} كوز` : '', t ? `${fmtNum(t)} طن` : ''].filter(Boolean).join(' · ');
  };
  return <ConnectedPersonPage title="الجلابة" icon="truck" personLabel="جلاب" entryLabel="التوريدات" paymentsLabel="المدفوع للجلاب" showWeeklyPricing personType="jalab"
    verse="﴿اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَأَنزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجَ بِهِ مِنَ الثَّمَرَاتِ رِزْقًا لَّكُمْ﴾"
    entryColumns={entryColumns} calcEntryTotal={calcJalabEntry} db={db} remote={remote}
    weeklyGrouping weeklyQtyText={weeklyQtyText} earnedLabel="قيمة التوريد" paidLabel="المدفوع"/>;
}

// أعمدة كارتة المبيعات/المشتريات
function tradeColumns(db, mode, extra=[]){
  return (form) => {
    const isGreen = isGreenKind(form.kind);
    const cols = [
      {key:'kind', label:'نوع التسليم', type:'select', options:['مصنع','أخضر']},
      {key:'itemType', label:'النوع', type:'select', options: isGreen ? ['فرنساوي', 'بلدي', 'فرزة'] : ['قطع', 'كاسات', 'قرص', 'حشو', 'شرايح', 'حدوة']},
    ];
    if(!isGreen) cols.push({key:'grade', label:'الدرجة', type:'select', options:['درجة أولى', 'درجة ثانية']});
    cols.push(
      {key:'quantity', label:'الكمية', formLabel: isGreen ? 'الكمية (كوز)' : 'الكمية (كيلو)', type:'number', required:true,
        render:row=>row.quantity===''||row.quantity==null?'—':num(row.quantity)+' '+(isGreenKind(row.kind)?'كوز':'كيلو'),
        pdf:row=>row.quantity===''||row.quantity==null?'—':num(row.quantity)+' '+(isGreenKind(row.kind)?'كوز':'كيلو')},
      {key:'price', label:'السعر', formLabel: isGreen ? 'سعر خاص للكوز (اختياري)' : 'سعر خاص للكيلو (اختياري)', placeholder:'فاضي = السعر المتسجل', type:'number', optional:true,
        render:(row, person)=>{
          const d = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, mode);
          if(d.missingPrice) return <span className="text-rust font-bold">بدون سعر</span>;
          return <span className="num">{d.priceSource==='manual' && priceTag('يدوي','bg-gold/15 text-gold-dark')}{d.priceSource==='person' && priceTag('خاص','bg-leaf-pale text-leaf-mid')}{num(d.price)}</span>;
        },
        pdf:(row, person)=>{ const d = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, mode); return d.missingPrice ? 'بدون سعر' : num(d.price); }
      }
    );
    if(!isGreen) cols.push({key:'discount', label:'الخصم %', formLabel:'خصم خاص % (اختياري)', type:'number', optional:true,
      render:(row, person)=>{ const d = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, mode); return d.disc ? num(d.disc)+'%' : '—'; },
      pdf:(row, person)=>{ const d = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, mode); return d.isGreen ? '—' : (d.disc ? fmtNum(d.disc)+'%' : '—'); }
    });
    if(mode==='purchase') cols.push({key:'note', label:'ملاحظة', formLabel:'ملاحظة (اختياري)', type:'text', optional:true});
    return [...cols, ...extra];
  };
}
function tradeExtras(db, mode){
  return [{key:'_rawTotal', label:'قبل الخصم', computed:true,
    render:(row, person)=>{ const d = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, mode); return d.isGreen ? '—' : num(d.rawTotal); },
    pdf:(row, person)=>{ const d = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, mode); return d.isGreen ? '—' : num(d.rawTotal); }}];
}
// عمود الخصم و«قبل الخصم» يظهروا بس لو فيه خصم فعلاً عند الشخص ده
function tradeColumnVisible(db, mode){
  return (key, person) => {
    if(key !== 'discount' && key !== '_rawTotal') return true;
    return (person.entries||[]).some(e => getEntryPricingDetails(e, getPriceSetForDate(db, e.date), person, mode).disc > 0);
  };
}

function SakinaPage({db}){
  const [sakinas,setSakinas] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  const [selectedSakina,setSelectedSakina] = useState(null);
  const [newSakina,setNewSakina] = useState('');
  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{ const rows = await apiFetch('/api/sakinas'); setSakinas(rows); if(rows.length) setSelectedSakina(prev => prev || rows[0].id); }
    catch(e){ setError(e.message); }
    setLoading(false);
  }
  async function addSakina(){
    if(!newSakina.trim()) return;
    try{ const s = await apiFetch('/api/sakinas', {method:'POST', body:JSON.stringify({name:newSakina.trim()})}); setSakinas([...sakinas, s]); setNewSakina(''); setSelectedSakina(s.id); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function removeSakina(s){
    if(!(await askConfirm(`حذف نوالة «${s.name}» بكل عاملاتها وحساباتهم؟`, {danger:true, typeToConfirm:'حذف', confirmText:'احذف'}))) return;
    try{ await apiFetch('/api/sakinas/'+s.id, {method:'DELETE'}); }catch(e){ notify(e.message, {tone:'error'}); return; }
    setSakinas(sakinas.filter(x=>x.id!==s.id)); if(selectedSakina===s.id) setSelectedSakina(null);

  const entryColumns = [
    {key:'itemType', label:'الصنف', type:'select', options:['هارت','كاسات','حشو']},
    {key:'pieces', label:'عدد القطع', type:'number', required:true, render:row=>row.pieces===''||row.pieces==null?'—':num(row.pieces)+' قطعة'},
    {key:'tookPeel', label:'أخدت القشر', type:'checkbox'},
  ];
  const sakina = sakinas.find(s=>s.id===selectedSakina) || null;
  if(loading) return <LoadingBox/>;
  if(error) return <ErrorBox error={error} onRetry={load}/>;
  return (
    <div className="p-4 md:p-8">
      <VerseHeader text="﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَى أَهْلِهَا﴾"/>

      <p className="text-ink/70 text-sm mb-5">كل نوالة مكان تقشير ليه عاملاته. السعر لكل ١٠٠٠ قطعة من صفحة «التسعير».</p>
      <div className="flex items-center gap-2 flex-wrap mb-5">
        {sakinas.map(s=>(
          <button key={s.id} onClick={()=>setSelectedSakina(s.id)} className={`px-4 py-2 rounded-full text-sm font-bold ${selectedSakina===s.id?'bg-leaf-deep text-cream':'bg-white border border-leaf-line text-ink/75'}`}>{s.name}</button>
        ))}
        <div className="flex items-center gap-1">
          <input value={newSakina} onChange={e=>setNewSakina(e.target.value)} placeholder="اسم نوالة جديدة" onKeyDown={e=>e.key==='Enter'&&addSakina()} className="rounded-xl border border-leaf-line px-3 py-2 text-sm w-40"/>
          <button onClick={addSakina} className="bg-leaf-deep text-cream rounded-xl px-3 py-2.5" aria-label="إضافة نوالة"><Icon name="plus" className="w-4 h-4"/></button>
        </div>

      {sakina && (
        <div>

/* ---------------------------------------------------------- EXPENSES ---------------------------------------------------------- */
function mapExpenseFromServer(x){ return { id:x.id, date:x.expense_date, category:x.category, customCategory:x.custom_category||'', name:x.name||'', amount: parseFloat(x.amount)||0 }; }
function mapExpenseToServer(f){ return { expense_date:f.date, category:f.category, custom_category:f.customCategory||'', name:f.name||'', amount: parseFloat(f.amount)||0 }; }

function ExpensesPage({db, setDb}){
  const [tab,setTab]=useState('expenses');
  const CATS = ['أكل','بودرة','سيتريك','سكاكين','أخرى'];
  const blank = () => ({date:todayStr(), category:'أكل', customCategory:'', name:'', amount:''});
  const [form,setForm] = useState(blank());
  const [bad,setBad] = useState(false);
  const [expenses,setExpenses] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{ setExpenses((await apiFetch('/api/expenses')).map(mapExpenseFromServer)); }catch(e){ setError(e.message); }
    setLoading(false);
  }
  async function add(){
    if(!(parseFloat(form.amount)>0)){ setBad(true); notify('اكتب المبلغ', {tone:'error'}); return; }
    setBad(false);
    try{ const x = await apiFetch('/api/expenses', {method:'POST', body:JSON.stringify(mapExpenseToServer(form))}); setExpenses([mapExpenseFromServer(x), ...expenses]); setForm({...blank(), date: form.date}); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function update(id,draft){
    try{ const x = await apiFetch('/api/expenses/'+id, {method:'PUT', body:JSON.stringify(mapExpenseToServer(draft))}); setExpenses(expenses.map(e=>e.id===id?mapExpenseFromServer(x):e)); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  function remove(id){
    const old = expenses.find(x=>x.id===id);
    setExpenses(prev=>prev.filter(x=>x.id!==id));
    scheduleDelete('اتمسح المصروف', ()=>apiFetch('/api/expenses/'+id, {method:'DELETE'}), ()=>setExpenses(prev=>[old, ...prev]));
  }
  const catLabel = x => x.category==='أخرى' ? (x.customCategory || 'أخرى') : x.category;
  const todayTotal = expenses.filter(x=>x.date===todayStr()).reduce((s,x)=>s+x.amount,0);
  const weekTotal = expenses.filter(x=>isCurrentWeek(x.date)).reduce((s,x)=>s+x.amount,0);
  const byCat = {}; expenses.forEach(x=>{ const l=catLabel(x); byCat[l]=(byCat[l]||0)+x.amount; });
  const columns = [
    {key:'date', label:'التاريخ', type:'date'},
    {key:'category', label:'النوع', type:'select', options:CATS, render: catLabel},
    {key:'name', label:'وصف', type:'text'},
    {key:'amount', label:'المبلغ', type:'number', isTotal:true},
  ];
  const tabBtn = (k, l) => <button onClick={()=>setTab(k)} aria-pressed={tab===k} className={`py-2.5 rounded-xl text-sm font-bold ${tab===k?'bg-white text-leaf-deep shadow-sm':'text-ink/65'}`}>{l}</button>;
  return (
    <div className="p-4 md:p-8 space-y-5">
      <VerseHeader text="﴿وَلَا تُبَذِّرْ تَبْذِيرًا﴾"/>
      <h1 className="hidden md:flex font-display text-3xl text-leaf-deep items-center gap-2"><Icon name="wallet" className="w-7 h-7"/>المصاريف والعربيات والشركاء</h1>
      <div className="grid grid-cols-3 gap-1 bg-creamdark/70 p-1 rounded-2xl max-w-md">{tabBtn('expenses','المصاريف')}{tabBtn('transport','العربيات')}{tabBtn('partners','الشركاء')}</div>
      {tab==='expenses' && (loading ? <LoadingBox/> : error ? <ErrorBox error={error} onRetry={load}/> :
        <div className="space-y-5">
          <div className="grid grid-cols-2 gap-3 max-w-md">
            <StatCard label="مصاريف النهارده" value={money(todayTotal)} tone="white"/>
            <StatCard label="مصاريف الأسبوع" value={money(weekTotal)} tone="gold"/>
          </div>
          <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
              <div><label className="block text-xs text-ink/70 mb-1">التاريخ</label><DateInput value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
              <div><label className="block text-xs text-ink/70 mb-1">النوع</label><FieldInput field={{type:'select', label:'النوع', options:CATS}} value={form.category} onChange={v=>setForm({...form,category:v})}/></div>
              {form.category==='أخرى' && <div><label className="block text-xs text-ink/70 mb-1">حدد النوع</label><FieldInput field={{type:'text',label:'النوع'}} value={form.customCategory} onChange={v=>setForm({...form,customCategory:v})}/></div>}
              <div><label className="block text-xs text-ink/70 mb-1">وصف</label><FieldInput field={{type:'text',label:'وصف', placeholder:'مثال: سكاكين جديدة'}} value={form.name} onChange={v=>setForm({...form,name:v})}/></div>
              <div><label className="block text-xs text-ink/70 mb-1">المبلغ <span className="text-rust">*</span></label><FieldInput field={{type:'number',label:'المبلغ'}} invalid={bad} value={form.amount} onChange={v=>{setForm({...form,amount:v}); setBad(false);}}/></div>
            </div>
            <button onClick={add} className="mt-3 bg-leaf-deep text-cream text-sm rounded-xl px-5 py-2.5 flex items-center gap-2 font-bold"><Icon name="plus" className="w-4 h-4"/>إضافة مصروف</button>
          </div>
          <div className="flex flex-wrap gap-2">{Object.entries(byCat).map(([c,v])=><span key={c} className="text-xs bg-leaf-pale text-leaf-deep px-3 py-1.5 rounded-full font-bold">{c}: {num(v)}</span>)}</div>
          <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 ledger-lines md:overflow-x-auto">
            <EditableTable columns={columns} rows={expenses.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))} onUpdate={update} onDelete={remove} emptyLabel="لسه مفيش مصاريف"/>
          </div>
        </div>
      )}
      {tab==='transport' && <TransportSection db={db} setDb={setDb}/>}
      {tab==='partners' && <PartnersSection/>}
    </div>
  );
}

/* ---------------------------------------------------------- العربيات + المشاوير الثابتة ---------------------------------------------------------- */
function TransportSection({db, setDb}){
  const [factories,setFactories] = useState([]);
  const [routes,setRoutes] = useState(db.routes||[]);
  const [routeForm,setRouteForm] = useState({from_location:'', to_location:'', price:''});
  useEffect(()=>{ apiFetch('/api/factories').then(f=>setFactories(f.map(x=>x.name))).catch(()=>{}); }, []);
  const syncRoutes = next => { setRoutes(next); setDb(prev=>({...prev, routes: next})); };
  const locationOptions = Array.from(new Set(['النوالة', ...factories, ...routes.flatMap(r=>[r.from_location, r.to_location]), 'مكان آخر'].filter(Boolean)));
  async function addRoute(){
    if(!routeForm.from_location || !routeForm.to_location || !(parseFloat(routeForm.price)>=0) || routeForm.price===''){ notify('اكتب من وإلى والسعر', {tone:'error'}); return; }
    try{ const r = await apiFetch('/api/transport-routes', {method:'POST', body:JSON.stringify({...routeForm, price: parseFloat(routeForm.price)||0})}); syncRoutes([...routes, r]); setRouteForm({from_location:'', to_location:'', price:''}); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function updateRoute(id, d){
    try{ const r = await apiFetch('/api/transport-routes/'+id, {method:'PUT', body:JSON.stringify({from_location:d.from_location, to_location:d.to_location, price: parseFloat(d.price)||0})}); syncRoutes(routes.map(x=>x.id===id?r:x)); notify('اتعدّل سعر المشوار — كل المشاوير دي اتحسبت بالسعر الجديد'); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function removeRoute(id){
    if(!(await askConfirm('حذف المشوار الثابت؟ المشاوير القديمة اللي من غير سعر خاص هتفضل بالسعر اللي كان متسجل فيها.', {danger:true, confirmText:'احذف'}))) return;
    try{ await apiFetch('/api/transport-routes/'+id, {method:'DELETE'}); syncRoutes(routes.filter(x=>x.id!==id)); }catch(e){ notify(e.message, {tone:'error'}); }
  }
  const entryColumns = [
    {key:'fromLocation', label:'من', type:'select', options:locationOptions},
    {key:'toLocation', label:'إلى', type:'select', options:locationOptions},
    {key:'price', label:'سعر المشوار', formLabel:'سعر خاص (اختياري)', placeholder:'فاضي = سعر المشوار الثابت', type:'number', optional:true,
      render:(row)=>{ const t = calcTransportEntry(row, getPriceSetForDate(db,row.date)); if(isMissingPrice(row,t)) return <span className="text-rust font-bold">بدون سعر</span>; return <span className="num">{row.priceManual && priceTag('خاص','bg-gold/15 text-gold-dark')}{num(t)}</span>; },
      pdf:(row)=>{ const t = calcTransportEntry(row, getPriceSetForDate(db,row.date)); return isMissingPrice(row,t)?'بدون سعر':num(t); }},
    {key:'note', label:'ملاحظة', formLabel:'ملاحظة (اختياري)', type:'text', optional:true},
  ];
  const base = makePersonRemote('transport', SECTION_FIELDS.transport);
  const withManual = f => ({...f, priceManual: toNum(f.price) !== null});
  const remote = {...base, addEntry: (pid, f)=>base.addEntry(pid, withManual(f)), updateEntry: (id, d)=>base.updateEntry(id, withManual(d))};
  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
        <h3 className="font-bold text-sm text-leaf-deep mb-1">المشاوير الثابتة</h3>
        <p className="text-xs text-ink/70 mb-3">لما تغيّر سعر مشوار هنا، كل المشاوير اللي ملهاش سعر خاص بتتحسب بالسعر الجديد (زي باقي الأسعار).</p>
        <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 mb-3">
          <input value={routeForm.from_location} onChange={e=>setRouteForm({...routeForm,from_location:e.target.value})} placeholder="من" className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm"/>
          <input value={routeForm.to_location} onChange={e=>setRouteForm({...routeForm,to_location:e.target.value})} placeholder="إلى" className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm"/>
          <input type="number" inputMode="decimal" value={routeForm.price} onChange={e=>setRouteForm({...routeForm,price:e.target.value})} placeholder="السعر" className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm num"/>
          <button onClick={addRoute} className="bg-leaf-deep text-cream text-sm rounded-xl px-4 py-2.5 font-bold flex items-center justify-center gap-1"><Icon name="plus" className="w-4 h-4"/>إضافة مشوار</button>
        </div>
        <div className="rounded-xl border border-leaf-line/30 md:overflow-x-auto">
          <EditableTable columns={[{key:'from_location',label:'من',type:'text'},{key:'to_location',label:'إلى',type:'text'},{key:'price',label:'السعر',type:'number', isTotal:true}]} rows={routes} onUpdate={updateRoute} onDelete={removeRoute} emptyLabel="لسه مفيش مشاوير ثابتة"/>
        </div>
      </div>
      <ConnectedPersonPage hideHeader personLabel="عربية" entryLabel="المشاوير" entryColumns={entryColumns} calcEntryTotal={calcTransportEntry} remote={remote} db={db} weeklyGrouping/>
    </div>
  );
}

/* ---------------------------------------------------------- الشركاء ---------------------------------------------------------- */
function PartnersSection(){
  const [newPartner,setNewPartner]=useState('');
  const blank = () => ({date:todayStr(), partnerId:'', type:'سحب', amount:'', reason:''});
  const [form,setForm]=useState(blank());
  const [partnersList,setPartnersList]=useState([]);
  const [partners,setPartners]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState('');
  useEffect(()=>{ load(); }, []);
  const fromServer = x => ({ id:x.id, date:x.tx_date, partnerId:x.partner_id, type:x.type, amount: parseFloat(x.amount)||0, reason:x.reason||'' });
  const toServer = f => ({ partner_id:f.partnerId, tx_date:f.date, type:f.type, amount: parseFloat(f.amount)||0, reason:f.reason||'' });
  async function load(){
    setLoading(true); setError('');
    try{ const [pl, tx] = await Promise.all([apiFetch('/api/partners-list'), apiFetch('/api/partner-transactions')]); setPartnersList(pl); setPartners(tx.map(fromServer)); }
    catch(e){ setError(e.message); }
    setLoading(false);
  }
  async function addPartnerName(){
    if(!newPartner.trim()) return;
    try{ const p = await apiFetch('/api/partners-list', {method:'POST', body:JSON.stringify({name:newPartner.trim(), share:0})}); setPartnersList([...partnersList, p]); setNewPartner(''); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function setShare(p, share){
    try{ const u = await apiFetch('/api/partners-list/'+p.id, {method:'PUT', body:JSON.stringify({name:p.name, share: parseFloat(share)||0})}); setPartnersList(partnersList.map(x=>x.id===p.id?u:x)); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function removePartnerName(p){
    if(!(await askConfirm(`حذف «${p.name}» من قايمة الشركاء؟`, {danger:true, confirmText:'احذف'}))) return;
    try{ await apiFetch('/api/partners-list/'+p.id, {method:'DELETE'}); setPartnersList(partnersList.filter(x=>x.id!==p.id)); }catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function add(){
    if(!form.partnerId || !(parseFloat(form.amount)>0)){ notify('اختار الشريك واكتب المبلغ', {tone:'error'}); return; }
    try{ const x = await apiFetch('/api/partner-transactions', {method:'POST', body:JSON.stringify(toServer(form))}); setPartners([fromServer(x), ...partners]); setForm({...blank(), date:form.date}); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function update(id,draft){
    try{ const x = await apiFetch('/api/partner-transactions/'+id, {method:'PUT', body:JSON.stringify(toServer(draft))}); setPartners(partners.map(p=>p.id===id?fromServer(x):p)); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  function remove(id){
    const old = partners.find(x=>x.id===id);
    setPartners(prev=>prev.filter(x=>x.id!==id));
    scheduleDelete('اتمسحت العملية', ()=>apiFetch('/api/partner-transactions/'+id, {method:'DELETE'}), ()=>setPartners(prev=>[old, ...prev]));
  }
  if(loading) return <LoadingBox/>;
  if(error) return <ErrorBox error={error} onRetry={load}/>;
  const nameOf = id => (partnersList.find(p=>p.id===id)||{}).name || '—';
  const netOf = id => partners.filter(x=>x.partnerId===id).reduce((s,x)=>s+(x.type==='إيداع'?x.amount:-x.amount),0);
  const shareSum = partnersList.reduce((s,p)=>s+(parseFloat(p.share)||0),0);
  function partnerStatementHtml(p){
    const txs = partners.filter(x=>x.partnerId===p.id).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const net = netOf(p.id);
    return `<div style="font-size:22px; font-weight:900; color:#25422C;">كشف حساب شريك</div>
      <div style="font-size:16px; font-weight:700; color:#3D6144; margin-bottom:14px;">${escHtml(p.name)} — النسبة ${fmtNum(p.share||0)}%</div>
      <div style="background:${net>=0?'#19432B':'#C62828'}; color:#fff; border-radius:10px; padding:12px; text-align:center; margin-bottom:14px;"><div style="font-size:11px; opacity:.85;">صافي الإيداع والسحب</div><div style="font-weight:900; font-size:16px;">${num(net)}</div></div>
      ${pdfTable(['التاريخ','النوع','المبلغ','السبب'], txs.map(x=>[formatDateWithDay(x.date), x.type, num(x.amount), x.reason||'—']))}`;
  }
  const columns = [
    {key:'date', label:'التاريخ', type:'date'},
    {key:'partnerId', label:'الشريك', type:'select', options:partnersList.map(p=>({value:p.id, label:p.name})), render: row=>nameOf(row.partnerId)},
    {key:'type', label:'النوع', type:'select', options:['سحب','إيداع']},
    {key:'amount', label:'المبلغ', type:'number', isTotal:true},
    {key:'reason', label:'السبب', type:'text'},
  ];
  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
        <h3 className="font-bold text-sm text-leaf-deep mb-1">الشركاء ونسبة كل واحد من الربح</h3>
        <p className="text-xs text-ink/70 mb-3">النسبة بتستخدم في «توزيع ربح الموسم» في الرئيسية.{shareSum && Math.abs(shareSum-100)>0.01 ? <b className="text-rust"> مجموع النسب {fmtNum(shareSum)}% مش 100%.</b> : null}</p>
        <div className="flex gap-2 mb-3 flex-wrap">
          <input value={newPartner} onChange={e=>setNewPartner(e.target.value)} placeholder="اسم شريك جديد" onKeyDown={e=>e.key==='Enter'&&addPartnerName()} className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm w-48"/>
          <button onClick={addPartnerName} className="bg-leaf-deep text-cream rounded-xl px-4 py-2.5 text-sm flex items-center gap-1 font-bold"><Icon name="plus" className="w-4 h-4"/>إضافة</button>
        </div>
        <div className="grid gap-2 sm:grid-cols-2">
          {partnersList.map(p=>(
            <div key={p.id} className="border border-leaf-line/40 rounded-xl px-3 py-2 flex items-center justify-between gap-2 flex-wrap">
              <div className="font-bold text-sm">{p.name} <span className="text-xs text-ink/65 font-normal">صافي حركته: <span className="num">{num(netOf(p.id))}</span></span></div>
              <div className="flex items-center gap-1">
                <input type="number" inputMode="decimal" defaultValue={p.share||0} key={p.id+'-'+(p.share||0)} onBlur={e=>{ if(parseFloat(e.target.value)!==parseFloat(p.share||0)) setShare(p, e.target.value); }} className="w-16 rounded-lg border border-leaf-line px-2 py-1.5 text-sm num" aria-label={'نسبة '+p.name}/>
                <span className="text-xs">%</span>
                <button onClick={()=>downloadPdf(partnerStatementHtml(p), p.name+' - كشف حساب.pdf')} aria-label="كشف PDF" className="text-leaf-mid p-2"><Icon name="download" className="w-4 h-4"/></button>
                <button onClick={()=>sharePdf(partnerStatementHtml(p), p.name+' - كشف حساب.pdf')} aria-label="واتساب" className="text-leaf-mid p-2"><Icon name="whatsapp" className="w-4 h-4"/></button>
                <button onClick={()=>removePartnerName(p)} aria-label="حذف الشريك" className="text-rust/70 p-2"><Icon name="trash" className="w-4 h-4"/></button>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
          <div><label className="block text-xs text-ink/70 mb-1">التاريخ</label><DateInput value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
          <div><label className="block text-xs text-ink/70 mb-1">الشريك</label><FieldInput field={{type:'select', label:'الشريك', options:partnersList.map(p=>({value:p.id,label:p.name}))}} value={form.partnerId} onChange={v=>setForm({...form,partnerId:v})}/></div>
          <div><label className="block text-xs text-ink/70 mb-1">النوع</label><FieldInput field={{type:'select', label:'النوع', options:['سحب','إيداع']}} value={form.type} onChange={v=>setForm({...form,type:v})}/></div>
          <div><label className="block text-xs text-ink/70 mb-1">المبلغ</label><FieldInput field={{type:'number', label:'المبلغ'}} value={form.amount} onChange={v=>setForm({...form,amount:v})}/></div>
          <div><label className="block text-xs text-ink/70 mb-1">السبب</label><FieldInput field={{type:'text', label:'السبب'}} value={form.reason} onChange={v=>setForm({...form,reason:v})}/></div>
        </div>
        <button onClick={add} className="mt-3 bg-leaf-deep text-cream text-sm rounded-xl px-5 py-2.5 flex items-center gap-2 font-bold"><Icon name="plus" className="w-4 h-4"/>إضافة عملية</button>
      </div>
      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 ledger-lines md:overflow-x-auto">
        <EditableTable columns={columns} rows={partners.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))} onUpdate={update} onDelete={remove} emptyLabel="لسه مفيش عمليات"/>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- DEBTS ---------------------------------------------------------- */
function mapDebtFromServer(x){ return { id:x.id, date:x.debt_date, lender:x.lender, amount: parseFloat(x.amount)||0, repaid: parseFloat(x.repaid)||0, reason:x.reason||'' }; }
function mapDebtToServer(f){ return { debt_date:f.date, lender:f.lender, amount: parseFloat(f.amount)||0, repaid: parseFloat(f.repaid)||0, reason:f.reason||'' }; }
function DebtsPage(){
  const blank = () => ({date:todayStr(), lender:'', amount:'', repaid:'', reason:''});
  const [form,setForm]=useState(blank());
  const [debts,setDebts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState('');
  useEffect(()=>{ load(); }, []);
  async function load(){ setLoading(true); setError(''); try{ setDebts((await apiFetch('/api/debts')).map(mapDebtFromServer)); }catch(e){ setError(e.message); } setLoading(false); }
  async function add(){
    if(!form.lender.trim() || !(parseFloat(form.amount)>0)){ notify('اكتب اسم الشخص والمبلغ', {tone:'error'}); return; }
    try{ const x = await apiFetch('/api/debts', {method:'POST', body:JSON.stringify(mapDebtToServer(form))}); setDebts([mapDebtFromServer(x), ...debts]); setForm(blank()); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function update(id,draft){
    try{ const x = await apiFetch('/api/debts/'+id, {method:'PUT', body:JSON.stringify(mapDebtToServer(draft))}); setDebts(debts.map(d=>d.id===id?mapDebtFromServer(x):d)); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  function remove(id){
    const old = debts.find(x=>x.id===id);
    setDebts(prev=>prev.filter(x=>x.id!==id));
    scheduleDelete('اتمسحت المديونية', ()=>apiFetch('/api/debts/'+id, {method:'DELETE'}), ()=>setDebts(prev=>[old, ...prev]));
  }
  if(loading) return <LoadingBox/>;
  if(error) return <ErrorBox error={error} onRetry={load}/>;
  const totalOutstanding = debts.reduce((s,x)=>s+(x.amount-x.repaid),0);
  const columns = [
    {key:'date', label:'التاريخ', type:'date'},
    {key:'lender', label:'اسم الشخص', type:'text'},
    {key:'amount', label:'المبلغ المستلف', type:'number'},
    {key:'repaid', label:'المسدد', type:'number'},
    {key:'reason', label:'السبب', type:'text'},
    {key:'_remaining', label:'الباقي عليك', computed:true, isTotal:true, render: row=>num(row.amount-row.repaid)},
  ];
  return (
    <div className="p-4 md:p-8 space-y-5">
      <VerseHeader text="﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَى أَهْلِهَا﴾"/>
      <h1 className="hidden md:flex font-display text-3xl text-leaf-deep items-center gap-2"><Icon name="debt" className="w-7 h-7"/>المديونات</h1>
      <p className="text-ink/70 text-sm">فلوس استلفتها خلال الموسم. المديونات بتترحّل للموسم الجاي لحد ما تتسدد.</p>
      <div className="max-w-xs"><StatCard label="الباقي عليك من المديونات" value={money(totalOutstanding)} icon="debt" tone={totalOutstanding>0?'rust':'white'}/></div>
      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
          <div><label className="block text-xs text-ink/70 mb-1">التاريخ</label><DateInput value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
          <div><label className="block text-xs text-ink/70 mb-1">اسم الشخص</label><FieldInput field={{type:'text',label:'اسم الشخص'}} value={form.lender} onChange={v=>setForm({...form,lender:v})}/></div>
          <div><label className="block text-xs text-ink/70 mb-1">المبلغ</label><FieldInput field={{type:'number',label:'المبلغ'}} value={form.amount} onChange={v=>setForm({...form,amount:v})}/></div>
          <div><label className="block text-xs text-ink/70 mb-1">المسدد لحد دلوقتي</label><FieldInput field={{type:'number',label:'المسدد'}} value={form.repaid} onChange={v=>setForm({...form,repaid:v})}/></div>
          <div><label className="block text-xs text-ink/70 mb-1">السبب</label><FieldInput field={{type:'text',label:'السبب'}} value={form.reason} onChange={v=>setForm({...form,reason:v})}/></div>
        </div>
        <button onClick={add} className="mt-3 bg-leaf-deep text-cream text-sm rounded-xl px-5 py-2.5 flex items-center gap-2 font-bold"><Icon name="plus" className="w-4 h-4"/>إضافة</button>
      </div>
      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 ledger-lines md:overflow-x-auto">
        <EditableTable columns={columns} rows={debts} onUpdate={update} onDelete={remove} emptyLabel="لسه مفيش مديونيات"/>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- EQUIPMENT ---------------------------------------------------------- */
function mapEquipmentItemFromServer(it){
  return {
    id: it.id, type: it.type, startQty: parseFloat(it.start_qty)||0, purchaseCost: parseFloat(it.purchase_cost)||0,
    factoryMovements: (it.factoryMovements||[]).map(m=>({id:m.id, factoryId:m.factory_id, date:m.move_date, direction:m.direction, qty: parseFloat(m.qty)||0, note:m.note||''})),
    sakinaStock: (it.sakinaStock||[]).map(s=>({id:s.id, sakinaId:s.sakina_id, qty: parseFloat(s.qty)||0})),
    other: (it.other||[]).map(o=>({id:o.id, location:o.location, qty: parseFloat(o.qty)||0})),
  };
}
function EquipmentPage(){
  const [items,setItems] = useState([]);
  const [factories,setFactories] = useState([]);
  const [sakinas,setSakinas] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  const [selected,setSelected]=useState(null);
  const [newType,setNewType]=useState(''); const [newStart,setNewStart]=useState('');
  const [selectedFactory,setSelectedFactory]=useState(null);
  const [moveForm,setMoveForm]=useState({date:todayStr(), direction:'out', qty:'', note:''});
  const [otherForm,setOtherForm]=useState({location:'', qty:''});
  const [editing,setEditing]=useState(null); // 'start' | 'cost'
  const [draftVal,setDraftVal]=useState('');
  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{
      const [eq, fac, sak] = await Promise.all([apiFetch('/api/equipment'), apiFetch('/api/factories'), apiFetch('/api/sakinas')]);
      const mapped = eq.map(mapEquipmentItemFromServer);
      setItems(mapped); setFactories(fac.map(f=>({id:f.id, name:f.name}))); setSakinas(sak.map(s=>({id:s.id, name:s.name})));
      if(mapped.length) setSelected(prev=> prev || mapped[0].id);
    }catch(e){ setError(e.message); }
    setLoading(false);
  }
  const item = items.find(x=>x.id===selected) || null;
  const patchItemLocal = (id, patch) => setItems(prev=>prev.map(x=>x.id===id?{...x,...patch}:x));
  async function addType(){
    if(!newType.trim()) return;
    try{ const it = mapEquipmentItemFromServer(await apiFetch('/api/equipment', {method:'POST', body:JSON.stringify({type:newType.trim(), start_qty: parseFloat(newStart)||0, purchase_cost:0})})); setItems([...items, it]); setNewType(''); setNewStart(''); setSelected(it.id); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function removeType(){
    if(!(await askConfirm(`حذف صنف «${item.type}» وكل حركاته؟`, {danger:true, confirmText:'احذف'}))) return;
    try{ await apiFetch('/api/equipment/'+item.id, {method:'DELETE'}); setItems(items.filter(x=>x.id!==item.id)); setSelected(null); }catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function saveField(){
    const v = parseFloat(draftVal)||0;
    const body = editing==='start' ? {start_qty: v} : {purchase_cost: v};
    try{ await apiFetch('/api/equipment/'+item.id, {method:'PUT', body:JSON.stringify(body)}); patchItemLocal(item.id, editing==='start'?{startQty:v}:{purchaseCost:v}); setEditing(null); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  const mapMove = m => ({id:m.id, factoryId:m.factory_id, date:m.move_date, direction:m.direction, qty: parseFloat(m.qty)||0, note:m.note||''});
  async function addMovement(){
    if(!selectedFactory || !(parseFloat(moveForm.qty)>0)){ notify('اكتب العدد', {tone:'error'}); return; }
    try{
      const m = await apiFetch(`/api/equipment/${item.id}/factory-movements`, {method:'POST', body:JSON.stringify({factory_id: selectedFactory, move_date: moveForm.date, direction: moveForm.direction, qty: parseFloat(moveForm.qty)||0, note: moveForm.note||''})});
      patchItemLocal(item.id, {factoryMovements:[...item.factoryMovements, mapMove(m)]}); setMoveForm({...moveForm, qty:'', note:''});
    }catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function updateMovement(id, d){
    try{ const m = await apiFetch('/api/equipment-factory-movements/'+id, {method:'PUT', body:JSON.stringify({factory_id: d.factoryId, move_date: d.date, direction: d.direction, qty: parseFloat(d.qty)||0, note: d.note||''})}); patchItemLocal(item.id, {factoryMovements: item.factoryMovements.map(x=>x.id===id?mapMove(m):x)}); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  function removeMovement(id){
    const it = item; const old = it.factoryMovements.find(x=>x.id===id);
    patchItemLocal(it.id, {factoryMovements: it.factoryMovements.filter(x=>x.id!==id)});
    scheduleDelete('اتمسحت الحركة', ()=>apiFetch('/api/equipment-factory-movements/'+id, {method:'DELETE'}), ()=>setItems(prev=>prev.map(x=>x.id===it.id?{...x, factoryMovements:[...x.factoryMovements, old]}:x)));
  }
  const factoryBalance = fid => (item?item.factoryMovements:[]).filter(m=>m.factoryId===fid).reduce((s,m)=> s + (m.direction==='out'? m.qty : -m.qty), 0);
  const factoriesTotal = item ? factories.reduce((s,f)=>s+factoryBalance(f.id),0) : 0;
  async function setSakinaQty(sakinaId, qty){
    const q = parseFloat(qty)||0;
    try{
      await apiFetch(`/api/equipment/${item.id}/sakina-stock/${sakinaId}`, {method:'PUT', body:JSON.stringify({qty:q})});
      const exists = item.sakinaStock.find(s=>s.sakinaId===sakinaId);
      patchItemLocal(item.id, {sakinaStock: exists ? item.sakinaStock.map(s=>s.sakinaId===sakinaId?{...s,qty:q}:s) : [...item.sakinaStock, {id:uid(), sakinaId, qty:q}]});
    }catch(e){ notify(e.message, {tone:'error'}); }
  }
  const sakinaQtyOf = sid => { const s=(item?item.sakinaStock:[]).find(x=>x.sakinaId===sid); return s?s.qty:0; };
  const sakinaTotal = item ? sakinas.reduce((s,sk)=>s+sakinaQtyOf(sk.id),0) : 0;
  async function addOther(){
    if(!otherForm.location || !(parseFloat(otherForm.qty)>0)){ notify('اكتب المكان والعدد', {tone:'error'}); return; }
    try{ const o = await apiFetch(`/api/equipment/${item.id}/other`, {method:'POST', body:JSON.stringify({location:otherForm.location, qty: parseFloat(otherForm.qty)||0})}); patchItemLocal(item.id, {other:[...item.other, {id:o.id, location:o.location, qty: parseFloat(o.qty)||0}]}); setOtherForm({location:'', qty:''}); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function updateOther(id, d){
    try{ const o = await apiFetch('/api/equipment-other/'+id, {method:'PUT', body:JSON.stringify({location:d.location, qty: parseFloat(d.qty)||0})}); patchItemLocal(item.id, {other: item.other.map(x=>x.id===id?{id:o.id,location:o.location,qty:parseFloat(o.qty)||0}:x)}); }
    catch(e){ notify(e.message, {tone:'error'}); }
  }
  function removeOther(id){
    const it = item; const old = it.other.find(x=>x.id===id);
    patchItemLocal(it.id, {other: it.other.filter(x=>x.id!==id)});
    scheduleDelete('اتمسح', ()=>apiFetch('/api/equipment-other/'+id, {method:'DELETE'}), ()=>setItems(prev=>prev.map(x=>x.id===it.id?{...x, other:[...x.other, old]}:x)));
  }
  const otherTotal = item ? item.other.reduce((s,d)=>s+d.qty,0) : 0;
  const remaining = item ? item.startQty - (factoriesTotal + sakinaTotal + otherTotal) : 0;
  const factoryObj = factories.find(f=>f.id===selectedFactory) || null;
  if(loading) return <LoadingBox/>;
  if(error) return <ErrorBox error={error} onRetry={load}/>;
  const editBox = (label, field, value, fmt) => (
    <div className="bg-white rounded-xl border border-leaf-line/30 p-3 text-center">
      <div className="text-xs text-ink/65 mb-1">{label}</div>
      {editing===field ? (
        <div className="flex items-center justify-center gap-1">
          <input type="number" inputMode="decimal" value={draftVal} onChange={e=>setDraftVal(e.target.value)} className="w-24 text-center rounded-lg border border-leaf-line px-1 py-1 text-sm num"/>
          <button onClick={saveField} className="text-leaf-mid p-1" aria-label="حفظ"><Icon name="check" className="w-5 h-5"/></button>
        </div>
      ) : (
        <div className="flex items-center justify-center gap-1"><div className="font-bold num">{fmt(value)}</div><button onClick={()=>{setDraftVal(value); setEditing(field);}} className="text-ink/50 hover:text-leaf-deep p-1" aria-label={'تعديل '+label}><Icon name="edit" className="w-3.5 h-3.5"/></button></div>
      )}
    </div>
  );
  return (
    <div className="p-4 md:p-8">
      <VerseHeader text="﴿وَأَقِيمُوا الْوَزْنَ بِالْقِسْطِ وَلَا تُخْسِرُوا الْمِيزَانَ﴾"/>
      <h1 className="hidden md:flex font-display text-3xl text-leaf-deep mb-1 items-center gap-2"><Icon name="box" className="w-7 h-7"/>العدة</h1>
      <p className="text-ink/70 text-sm mb-5">البراميل والأقفاص والصواني والسكاكين: اللي عند المصانع، واللي عند النوالات، واللي في المخزن.</p>
      <div className="flex flex-col lg:flex-row gap-5">
        <div className="lg:w-72 shrink-0 bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4 h-fit space-y-3">
          <div className="grid gap-2">
            <input value={newType} onChange={e=>setNewType(e.target.value)} placeholder="اسم الصنف (برميل، قفص...)" className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm"/>
            <input type="number" inputMode="decimal" value={newStart} onChange={e=>setNewStart(e.target.value)} placeholder="العدد في بداية الموسم" className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm num"/>
            <button onClick={addType} className="bg-leaf-deep text-cream rounded-xl py-2.5 text-sm flex items-center justify-center gap-1 font-bold"><Icon name="plus" className="w-4 h-4"/>إضافة صنف</button>
          </div>
          <div className="space-y-1">
            {items.map(x=>(
              <button key={x.id} onClick={()=>{setSelected(x.id); setSelectedFactory(null); setEditing(null);}} className={`w-full text-right px-3 py-2.5 rounded-xl flex items-center justify-between ${selected===x.id?'bg-leaf-pale':'hover:bg-cream'}`}>
                <span className="font-bold text-sm">{x.type}</span><span className="text-xs text-ink/65 num">{num(x.startQty)}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="flex-1 min-w-0">
          {!item && <div className="bg-white border border-dashed border-leaf-line rounded-2xl p-10 text-center text-ink/65">اختار صنف أو ضيف صنف جديد</div>}
          {item && (
            <div className="space-y-5">
              <div className="flex items-center justify-between">
                <h2 className="text-2xl font-bold text-ink">{item.type}</h2>
                <button onClick={removeType} className="text-rust text-xs flex items-center gap-1 p-2"><Icon name="trash" className="w-4 h-4"/>حذف الصنف</button>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                {editBox('بداية الموسم', 'start', item.startQty, v=>num(v))}
                {editBox('تكلفة الشراء الموسم ده', 'cost', item.purchaseCost, v=>num(v))}
                <div className="bg-white rounded-xl border border-leaf-line/30 p-3 text-center"><div className="text-xs text-ink/65 mb-1">عند المصانع</div><div className="font-bold num">{num(factoriesTotal)}</div></div>
                <div className="bg-white rounded-xl border border-leaf-line/30 p-3 text-center"><div className="text-xs text-ink/65 mb-1">عند النوالات</div><div className="font-bold num">{num(sakinaTotal)}</div></div>
                <div className={`rounded-xl p-3 text-center ${remaining<0?'bg-rust text-white':'bg-leaf-deep text-cream'}`}><div className="text-xs opacity-85 mb-1">في المخزن</div><div className="font-bold num">{num(remaining)}</div></div>
              </div>
              <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
                <h3 className="font-bold text-sm text-leaf-deep mb-1">الحركة مع المصانع والتجار</h3>
                <p className="text-xs text-ink/65 mb-3">العدة اللي بتطلع مع كارتة مبيعات بتتسجل هنا لوحدها لو اخترتها في الكارتة.</p>
                {factories.length===0 ? <p className="text-sm text-ink/60 text-center py-4">سجّل مصنع في «المبيعات» وهيظهر هنا.</p> : (
                  <>
                    <div className="flex flex-wrap gap-2 mb-4">
                      {factories.map(f=>{ const bal = factoryBalance(f.id); return (
                        <button key={f.id} onClick={()=>setSelectedFactory(f.id)} className={`px-3 py-2 rounded-xl text-sm font-bold flex flex-col items-center gap-0.5 ${selectedFactory===f.id?'bg-leaf-deep text-cream':'bg-cream border border-leaf-line text-ink/75'}`}>
                          {f.name}<span className="text-xs num opacity-85">لينا عندهم: {num(bal)}</span>
                        </button>); })}
                    </div>
                    {factoryObj && (
                      <div>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
                          <div><label className="block text-xs text-ink/70 mb-1">التاريخ</label><DateInput value={moveForm.date} onChange={e=>setMoveForm({...moveForm,date:e.target.value})}/></div>
                          <div><label className="block text-xs text-ink/70 mb-1">الاتجاه</label><FieldInput field={{type:'select', label:'الاتجاه', options:[{value:'out',label:'وديت لهم'},{value:'in',label:'رجع منهم'}]}} value={moveForm.direction} onChange={v=>setMoveForm({...moveForm,direction:v})}/></div>
                          <div><label className="block text-xs text-ink/70 mb-1">العدد</label><FieldInput field={{type:'number', label:'العدد'}} value={moveForm.qty} onChange={v=>setMoveForm({...moveForm,qty:v})}/></div>
                          <div><label className="block text-xs text-ink/70 mb-1">ملاحظة</label><FieldInput field={{type:'text', label:'ملاحظة'}} value={moveForm.note} onChange={v=>setMoveForm({...moveForm,note:v})}/></div>
                        </div>
                        <button onClick={addMovement} className="bg-leaf-deep text-cream text-sm rounded-xl px-5 py-2.5 flex items-center gap-2 mb-3 font-bold"><Icon name="plus" className="w-4 h-4"/>تسجيل حركة</button>
                        <div className="ledger-lines rounded-lg border border-leaf-line/20 md:overflow-x-auto">
                          <EditableTable columns={[
                              {key:'date',label:'التاريخ',type:'date'},
                              {key:'direction',label:'الاتجاه',type:'select', options:[{value:'out',label:'وديت لهم'},{value:'in',label:'رجع منهم'}]},
                              {key:'qty',label:'العدد',type:'number', isTotal:true},

                  <div className="space-y-2">

                      <div key={sk.id} className="flex items-center justify-between gap-3 border-b border-leaf-line/10 pb-2">

                      </div>
                    ))}

                )}
              </div>
              <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
                <h3 className="font-bold text-sm text-leaf-deep mb-3">أماكن تانية (مفقود، عند شخص...)</h3>

                  <input type="number" inputMode="decimal" value={otherForm.qty} onChange={e=>setOtherForm({...otherForm,qty:e.target.value})} placeholder="العدد" className="rounded-xl border border-leaf-line px-3 py-2.5 text-sm num"/>

                </div>
                <div className="ledger-lines rounded-lg border border-leaf-line/20 md:overflow-x-auto">
                  <EditableTable columns={[{key:'location',label:'المكان',type:'text'},{key:'qty',label:'العدد',type:'number', isTotal:true}]} rows={item.other} onUpdate={updateOther} onDelete={removeOther} emptyLabel="مفيش"/>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- PRICING ---------------------------------------------------------- */
const PRICE_LABELS = { jalabPerKuz:'الجلابة: سعر الكوز', jalabPerTon:'الجلابة: سعر الطن', workerDailyWage:'يومية الأنفار' };
function flattenPrices(p, prefix=''){
  const out = {};
  Object.entries(p||{}).forEach(([k,v])=>{
    if(k.startsWith('__') || k==='weekStart' || k==='day') return;
    if(v && typeof v === 'object') Object.assign(out, flattenPrices(v, prefix + k + ' › '));
    else out[prefix+k] = v;
  });
  return out;
}
function priceChangeLines(before, after){
  const a = flattenPrices(before||{}), b = flattenPrices(after||{});
  const keys = Array.from(new Set([...Object.keys(a), ...Object.keys(b)]));
  const nice = k => (PRICE_LABELS[k] || k).replace('niswan › ','النوالات › ').replace('takhrit › ','التخريط › ').replace('sales › ','المبيعات › ').replace('withPeel','مع القشر').replace('withoutPeel','من غير قشر');
  return keys.filter(k=>String(a[k]??'')!==String(b[k]??'')).map(k=>`${nice(k)}: ${a[k]===undefined||a[k]===''?'—':a[k]} ← ${b[k]===undefined||b[k]===''?'—':b[k]}`);
}

function PricingPage({db,setDb}){
  const [mode,setMode] = useState('weekly');
  const todayS = todayStr();
  const [dayDate,setDayDate] = useState(todayS);
  const [weekStart,setWeekStart] = useState(getWeekStart(todayS));
  const [draft,setDraft] = useState(withPriceDefaults(null));
  const [logOpen,setLogOpen] = useState(false);
  const priceDays = db.priceDays||[], priceWeeks = db.priceWeeks||[], seasonPrices = db.seasonPrices;

  // مصدر الأسعار المعروضة للأسبوع/اليوم المختار
  function sourceFor(m, key){
    if(m==='seasonal') return seasonPrices ? {kind:'saved', text:'التسعير الموسمي متسجل'} : {kind:'none', text:'مفيش تسعير موسمي — القيم دي مقترحة بس ومش بتتحسب لحد ما تحفظها'};
    if(m==='daily'){
      const ex = priceDays.find(d=>d.day===key);
      if(ex) return {kind:'saved', text:'متسجل لليوم ده', set: ex};
      const eff = getPriceSetForDate({...db, priceDays: []}, key);
      return eff.__source==='none' ? {kind:'none', text:'مفيش أسعار لليوم ده — القيم مقترحة بس'} : {kind:'carry', text:'مفيش تسعير خاص لليوم ده — بيتحسب بأسعار '+(eff.__source==='season'?'الموسم':'أسبوع '+getWeekRangeLabel(eff.__from)), set: eff};
    }
    const ex = priceWeeks.find(w=>w.weekStart===key);
    if(ex) return {kind:'saved', text:'متسجل للأسبوع ده', set: ex};
    const eff = getPriceSetForDate({...db, priceDays: []}, key);
    if(eff.__source==='carry') return {kind:'carry', text:'مش متسجل — الأسبوع ده بياخد أسعار أسبوع '+getWeekRangeLabel(eff.__from)+'. لو حفظت هنا هيبقى ليه أسعاره الخاصة.', set: eff};
    if(eff.__source==='season') return {kind:'carry', text:'مش متسجل — الأسبوع ده بياخد التسعير الموسمي', set: eff};
    return {kind:'none', text:'مفيش أي أسعار قبل الأسبوع ده — القيم دي مقترحة بس، والعمليات هتفضل «بدون سعر» لحد ما تحفظ', set: null};
  }
  const key = mode==='daily' ? dayDate : weekStart;
  const src = sourceFor(mode, key);
  const strip = s => { const o = {...s}; Object.keys(o).forEach(k=>{ if(k.startsWith('__')) delete o[k]; }); delete o.weekStart; delete o.day; return o; };

  useEffect(()=>{ setDraft(withPriceDefaults(src.set ? strip(src.set) : (mode==='seasonal' ? seasonPrices : null))); }, [mode, key, db.priceWeeks, db.priceDays, db.seasonPrices]);

  const prevWeek = priceWeeks.filter(w=>w.weekStart < weekStart).sort((a,b)=>b.weekStart.localeCompare(a.weekStart))[0];
  const locked = mode==='weekly' && (db.lockedWeeks||[]).includes(weekStart);

  function set(path, value){
    const copy = JSON.parse(JSON.stringify(draft));
    let obj = copy;
    for(let i=0;i<path.length-1;i++){ if(!obj[path[i]]) obj[path[i]] = {}; obj = obj[path[i]]; }
    obj[path[path.length-1]] = value===''? '' : parseFloat(value);
    setDraft(copy);
  }
  async function save(){
    const payload = strip(draft);
    if(locked && !(await askConfirm('أسبوع '+getWeekRangeLabel(weekStart)+' مقفول.\nتعديل أسعاره هيغيّر كشوف اتبعتت للناس وصافي الربح. تكمل؟', {title:'أسبوع مقفول', confirmText:'أيوه، احفظ'}))) return;
    try{
      if(mode==='seasonal'){
        await apiFetch('/api/prices', {method:'PUT', body:JSON.stringify({scope:'season', prices: payload})});
        setDb(prev=>({...prev, seasonPrices: payload})); notify('اتحفظ التسعير الموسمي');
      } else if(mode==='daily'){
        await apiFetch('/api/prices', {method:'PUT', body:JSON.stringify({scope:'day', week_start:dayDate, prices: payload})});
        setDb(prev=>({...prev, priceDays: [...(prev.priceDays||[]).filter(p=>p.day!==dayDate), {day:dayDate, ...payload}]})); notify('اتحفظت أسعار يوم '+formatDateWithDay(dayDate));
      } else {
        await apiFetch('/api/prices', {method:'PUT', body:JSON.stringify({scope:'week', week_start:weekStart, prices: payload})});
        setDb(prev=>({...prev, priceWeeks: [...(prev.priceWeeks||[]).filter(p=>p.weekStart!==weekStart), {weekStart, ...payload}]})); notify('اتحفظت أسعار أسبوع '+getWeekRangeLabel(weekStart)+' — كل العمليات والكشوف اتحسبت بيها');
      }
    }catch(e){ notify(e.message, {tone:'error'}); }
  }
  async function toggleLock(){
    const next = !locked;
    if(next && !(await askConfirm('قفل أسبوع '+getWeekRangeLabel(weekStart)+'؟\nبعد القفل أي تعديل في أسعاره أو عملياته هيطلب تأكيد، عشان الكشوف اللي اتبعتت ماتتغيرش من غير ما تاخد بالك.', {confirmText:'اقفل الأسبوع'}))) return;
    try{
      await apiFetch('/api/prices', {method:'PUT', body:JSON.stringify({scope:'lock', week_start:weekStart, prices:{locked: next}})});
      setDb(prev=>({...prev, lockedWeeks: next ? Array.from(new Set([...(prev.lockedWeeks||[]), weekStart])) : (prev.lockedWeeks||[]).filter(w=>w!==weekStart)}));
      notify(next ? 'اتقفل الأسبوع' : 'اتفتح الأسبوع');
    }catch(e){ notify(e.message, {tone:'error'}); }
  }
  const shiftWeek = n => { const d = new Date(weekStart+'T00:00:00'); d.setDate(d.getDate()+7*n); setWeekStart(localDateStr(d)); };
  const log = auditRead().filter(a=>a.section==='التسعير').slice(0, 40);
  const scopeLabel = a => { const s = (a.after||a.before||{}); return s.scope==='season' ? 'التسعير الموسمي' : s.scope==='day' ? 'يوم '+formatDateShort(s.week_start) : s.scope==='lock' ? ((s.prices&&s.prices.locked===false)?'فتح ':'قفل ')+'أسبوع '+getWeekRangeLabel(s.week_start) : 'أسبوع '+getWeekRangeLabel(normalizeWeekStart(s.week_start)); };
  const srcCls = src.kind==='saved' ? 'bg-leaf-pale text-leaf-deep border-leaf-line' : src.kind==='carry' ? 'bg-gold/15 text-gold-dark border-gold/40' : 'bg-rust/10 text-rust border-rust/30';
  const tabBtn = (m, l) => <button onClick={()=>setMode(m)} aria-pressed={mode===m} className={`py-2.5 rounded-xl text-sm font-bold transition ${mode===m?'bg-white text-leaf-deep shadow-sm':'text-ink/65'}`}>{l}</button>;
  const card = "bg-white rounded-3xl shadow-card border border-leaf-line/30 p-4 md:p-6";
  const inp = "w-full rounded-xl border border-leaf-line/70 px-3 py-2.5 num bg-white";

  return (
    <div className="p-4 md:p-8 space-y-5 max-w-4xl mx-auto">
      <VerseHeader text="﴿وَأَوْفُوا الْكَيْلَ وَلَا تَكُونُوا مِنَ الْمُخْسِرِينَ﴾"/>
      <h1 className="hidden md:flex font-display text-3xl text-leaf-deep items-center gap-2"><Icon name="tag" className="w-7 h-7"/>التسعير</h1>
      <details className="text-sm text-ink/75 bg-white/60 rounded-2xl px-4 py-2"><summary className="cursor-pointer font-bold text-leaf-deep py-1">إزاي الأسعار بتتطبق؟</summary><p className="pb-2">الأولوية: <b>تسعير اليوم ← تسعير الأسبوع ← آخر أسبوع متسعّر قبله ← الموسمي</b>. أي تعديل بيتطبق على كل عمليات الفترة دي (الكشوف القديمة والربح).</p></details>
      <div className="grid grid-cols-3 gap-1 bg-creamdark/70 p-1 rounded-2xl max-w-md">{tabBtn('weekly','أسبوعي')}{tabBtn('daily','يومي')}{tabBtn('seasonal','موسمي')}</div>

      <div className={card+" space-y-3"}>
        {mode==='weekly' && (
          <div className="flex flex-wrap items-center gap-2">
            <button onClick={()=>shiftWeek(-1)} className="px-3 py-2 rounded-xl border border-leaf-line text-sm" aria-label="الأسبوع اللي فات">‹ اللي فات</button>
            <div className="text-base font-black text-leaf-deep px-2">أسبوع {getWeekRangeLabel(weekStart)}</div>
            <button onClick={()=>shiftWeek(1)} className="px-3 py-2 rounded-xl border border-leaf-line text-sm" aria-label="الأسبوع الجاي">الجاي ›</button>
            <div className="w-40"><DateInput value={weekStart} onChange={e=>e.target.value && setWeekStart(getWeekStart(e.target.value))} aria-label="اختار أي يوم في الأسبوع"/></div>
            <button onClick={()=>setWeekStart(getWeekStart(todayS))} className="text-xs px-3 py-2 rounded-xl border border-leaf-line text-leaf-deep">الأسبوع ده</button>
          </div>
        )}
        {mode==='daily' && (
          <div className="flex flex-wrap items-center gap-2">
            <div className="w-44"><DateInput value={dayDate} onChange={e=>e.target.value && setDayDate(e.target.value)}/></div>
            <div className="text-sm font-black text-leaf-deep">{formatDateWithDay(dayDate)}</div>
          </div>
        )}
        <div className={`text-sm font-bold rounded-xl border px-3 py-2 ${srcCls}`}>{src.text}</div>
        {mode==='weekly' && (
          <div className="flex flex-wrap gap-2">
            {prevWeek && <button onClick={()=>{ setDraft(withPriceDefaults(strip(prevWeek))); notify('اتنسخت أسعار أسبوع '+getWeekRangeLabel(prevWeek.weekStart)+' — راجعها واحفظ'); }} className="text-xs px-3 py-2 rounded-xl border border-leaf-line text-leaf-deep font-bold">انسخ أسعار أسبوع {getWeekRangeLabel(prevWeek.weekStart)}</button>}
            <button onClick={toggleLock} className={`text-xs px-3 py-2 rounded-xl border font-bold flex items-center gap-1 ${locked?'bg-ink text-cream border-ink':'border-leaf-line text-ink/75'}`}><Icon name="lock" className="w-3.5 h-3.5"/>{locked ? 'الأسبوع مقفول — افتحه' : 'اقفل الأسبوع'}</button>
          </div>
        )}
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-3">الجلابة</h3>
        <div className="grid grid-cols-2 gap-3 max-w-md">
          <label><span className="block text-xs text-ink/70 mb-1">سعر الكوز</span><input type="number" inputMode="decimal" value={draft.jalabPerKuz} onChange={e=>set(['jalabPerKuz'], e.target.value)} className={inp}/></label>
          <label><span className="block text-xs text-ink/70 mb-1">سعر الطن</span><input type="number" inputMode="decimal" value={draft.jalabPerTon} onChange={e=>set(['jalabPerTon'], e.target.value)} className={inp}/></label>
        </div>
      </div>

      <div className={card}>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">

            <div key={type} className="border border-leaf-line/40 rounded-2xl p-3">
              <div className="font-black text-leaf-deep mb-2 text-center">{type}</div>
              <div className="grid grid-cols-2 gap-2">
                <label><span className="block text-xs text-ink/70 mb-1">من غير قشر</span><input type="number" inputMode="decimal" value={(draft.niswan[type]||{}).withoutPeel ?? ''} onChange={e=>set(['niswan',type,'withoutPeel'], e.target.value)} className={inp}/></label>
                <label><span className="block text-xs text-ink/70 mb-1">مع القشر</span><input type="number" inputMode="decimal" value={(draft.niswan[type]||{}).withPeel ?? ''} onChange={e=>set(['niswan',type,'withPeel'], e.target.value)} className={inp}/></label>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-3">التخريط (السعر لكل برميل)</h3>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          {['قطع','قرص','شرايح','حدوة'].map(type=>(
            <label key={type}><span className="block text-xs text-ink/70 mb-1">{type}</span><input type="number" inputMode="decimal" value={draft.takhrit[type] ?? ''} onChange={e=>set(['takhrit',type], e.target.value)} className={inp}/></label>
          ))}
        </div>
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-3">المبيعات</h3>
        {[['درجة أولى (بالكيلو)', ' (أولى)'], ['درجة ثانية (بالكيلو)', ' (ثانية)']].map(([title, suf])=>(
          <div key={suf} className="mb-3">
            <div className="text-xs font-bold text-ink/70 mb-2">{title}</div>
            <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
              {['قطع','كاسات','قرص','حشو','شرايح','حدوة'].map(t=>(
                <label key={t}><span className="block text-xs text-ink/70 mb-1">{t}</span><input type="number" inputMode="decimal" value={draft.sales[t+suf] ?? ''} onChange={e=>set(['sales',t+suf], e.target.value)} className={inp}/></label>
              ))}
            </div>
          </div>
        ))}
        <label className="block max-w-[180px]"><span className="block text-xs font-bold text-ink/70 mb-1">الخرشوف الأخضر (بالكوز)</span><input type="number" inputMode="decimal" value={draft.sales['أخضر'] ?? ''} onChange={e=>set(['sales','أخضر'], e.target.value)} className={inp}/></label>
      </div>

      <div className={card}>
        <h3 className="font-bold text-leaf-deep mb-3">أنفار النوالة</h3>
        <label className="block max-w-[180px]"><span className="block text-xs text-ink/70 mb-1">اليومية</span><input type="number" inputMode="decimal" value={draft.workerDailyWage} onChange={e=>set(['workerDailyWage'], e.target.value)} className={inp}/></label>
      </div>

      <div className="sticky bottom-[72px] md:bottom-3 z-10 -mx-1 px-1 py-2 bg-cream/90 backdrop-blur rounded-2xl">
        <button onClick={save} className="bg-leaf-deep text-cream rounded-2xl px-8 py-3.5 font-black flex items-center justify-center gap-3 w-full sm:w-auto shadow-card-hover text-base md:text-lg">
          <Icon name="check" className="w-5 h-5"/>{mode==='seasonal'?'حفظ التسعير الموسمي':mode==='daily'?'حفظ أسعار اليوم ده':'حفظ أسعار الأسبوع ده'}
        </button>
      </div>

      {mode==='weekly' && priceWeeks.length>0 && (
        <div className={card}>
          <h3 className="font-bold text-sm text-leaf-deep mb-3">أسابيع متسعّرة</h3>
          <div className="flex flex-wrap gap-2">
            {priceWeeks.slice().sort((a,b)=>b.weekStart.localeCompare(a.weekStart)).map(p=>(
              <button key={p.weekStart} onClick={()=>setWeekStart(p.weekStart)} className={`text-xs px-3 py-2 rounded-xl border flex items-center gap-1 ${p.weekStart===weekStart?'bg-leaf-deep text-cream border-leaf-deep':'border-leaf-line text-ink/75'}`}>
                {(db.lockedWeeks||[]).includes(p.weekStart) && <Icon name="lock" className="w-3 h-3"/>}{getWeekRangeLabel(p.weekStart)}
              </button>
            ))}
          </div>
        </div>
      )}
      {mode==='daily' && priceDays.length>0 && (
        <div className={card}>
          <h3 className="font-bold text-sm text-leaf-deep mb-3">أيام ليها تسعير خاص</h3>
          <div className="flex flex-wrap gap-2">
            {priceDays.slice().sort((a,b)=>b.day.localeCompare(a.day)).map(p=>(
              <button key={p.day} onClick={()=>setDayDate(p.day)} className={`text-xs px-3 py-2 rounded-xl border ${p.day===dayDate?'bg-leaf-deep text-cream border-leaf-deep':'border-leaf-line text-ink/75'}`}>{formatDateWithDay(p.day)}</button>
            ))}
          </div>
        </div>
      )}

      <div className={card}>
        <button onClick={()=>setLogOpen(v=>!v)} className="w-full flex items-center justify-between font-bold text-sm text-leaf-deep" aria-expanded={logOpen}>
          <span>سجل تعديلات الأسعار ({log.length})</span><span className="text-xs text-ink/60">{logOpen?'إخفاء':'عرض'}</span>
        </button>
        {logOpen && (
          <div className="mt-3 space-y-2">
            {log.length===0 && <p className="text-sm text-ink/60">لسه مفيش تعديلات متسجلة على الجهاز ده.</p>}
            {log.map(a=>{
              const lines = (a.after&&a.after.scope==='lock') ? [] : priceChangeLines(a.before&&a.before.prices, a.after&&a.after.prices);
              return (
                <div key={a.id} className="border border-leaf-line/30 rounded-xl px-3 py-2 text-sm">
                  <div className="flex justify-between gap-2 flex-wrap"><b>{scopeLabel(a)}</b><span className="text-xs text-ink/60">{new Date(a.at).toLocaleString('ar-EG-u-nu-latn')}</span></div>
                  {lines.length>0 && <ul className="text-xs text-ink/75 mt-1 space-y-0.5">{lines.slice(0,12).map((l,i)=><li key={i}>{l}</li>)}{lines.length>12 && <li>و {lines.length-12} تعديل تاني</li>}</ul>}
                  {!a.before && a.after && a.after.scope!=='lock' && <div className="text-xs text-ink/60 mt-1">أول تسعير للفترة دي</div>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

  const m = (list, f) => (list||[]).map(r=>mapPersonFromServer(r, f));
  return {
    jalaba: m(jalaba, F.jalaba), workers: m(workers, F.workers), takhritFixed: m(takhritFixed, F.takhrit), banadeer: m(banadeer, F.takhrit),
    factories: m(factories, F.factories), raseef: m(raseef, F.raseef), transport: m(transport, F.transport), sakinaWorkers: m(sakinaWorkers, F.sakinaWorkers),
    sakinas, expenses: (expenses||[]).map(mapExpenseFromServer), debts: (debts||[]).map(mapDebtFromServer),
    partnerTx: (partnerTx||[]).map(x=>({ date:x.tx_date, partnerId:x.partner_id, type:x.type, amount: parseFloat(x.amount)||0 })),
    partnersList: partnersList||[], equipment: (equipment||[]).map(mapEquipmentItemFromServer),
  };
}
const OVERVIEW_GROUPS = [
  { key:'factories', label:'المبيعات (المصانع والتجار)', calc: calcSalesEntry, direction:'receivable' },
  { key:'jalaba', label:'الجلابة', calc: calcJalabEntry, direction:'payable' },
  { key:'raseef', label:'المشتريات (الرصيف)', calc: calcRaseefEntry, direction:'payable' },
  { key:'sakinaWorkers', label:'عاملات النوالات', calc: calcSakinaEntry, direction:'payable', labor:true },
  { key:'takhritFixed', label:'أنفار التخريط', calc: calcTakhritEntry, direction:'payable', labor:true },
  { key:'banadeer', label:'البنادير', calc: calcTakhritEntry, direction:'payable', labor:true },
  { key:'workers', label:'أنفار النوالة', calc: calcWorkerEntry, direction:'payable', labor:true },
  { key:'transport', label:'العربيات', calc: calcTransportEntry, direction:'payable' },
];
function computeOverview(data, db, user, ws){
  const groups = {};
  OVERVIEW_GROUPS.forEach(g=>{
    const r = { ...g, earned:0, paid:0, opening:0, owedToThem:0, owedToUs:0, earnedWeek:0, paidWeek:0, missing:0 };
    (data[g.key]||[]).forEach(p=>{
      const t = personTotals(p, g.calc, db);
      r.earned += t.earned; r.paid += t.paid; r.opening += t.opening; r.missing += t.missing;
      const rem = t.remaining;
      if(g.direction==='receivable'){ if(rem>0) r.owedToUs += rem; else r.owedToThem += -rem; }
      else { if(rem>0) r.owedToThem += rem; else r.owedToUs += -rem; }
      p.entries.forEach(e=>{ if(getWeekStart(e.date)===ws) r.earnedWeek += g.calc(e, getPriceSetForDate(db, e.date), p); });
      p.payments.forEach(x=>{ if(getWeekStart(x.date)===ws) r.paidWeek += parseFloat(x.amount)||0; });
    });
    groups[g.key] = r;
  });
  const costKeys = OVERVIEW_GROUPS.filter(g=>g.direction==='payable').map(g=>g.key);
  const sum = (keys, f) => keys.reduce((s,k)=>s+groups[k][f],0);
  const labor = k => OVERVIEW_GROUPS.filter(g=>g.labor).reduce((s,g)=>s+groups[g.key][k],0);
  const expenses = data.expenses.reduce((s,x)=>s+x.amount,0);
  const expensesWeek = data.expenses.filter(x=>getWeekStart(x.date)===ws).reduce((s,x)=>s+x.amount,0);
  const equipmentCost = data.equipment.reduce((s,x)=>s+(x.purchaseCost||0),0);
  const partnersNet = data.partnerTx.reduce((s,x)=>s+(x.type==='إيداع'?x.amount:-x.amount),0);
  const debtsOutstanding = data.debts.reduce((s,x)=>s+(x.amount-x.repaid),0);
  const capital = parseFloat(user.capital)||0;
  const cash = capital + groups.factories.paid + partnersNet + debtsOutstanding - sum(costKeys,'paid') - expenses - equipmentCost;
  const receivables = OVERVIEW_GROUPS.reduce((s,g)=>s+groups[g.key].owedToUs,0);
  const payables = OVERVIEW_GROUPS.reduce((s,g)=>s+groups[g.key].owedToThem,0) + debtsOutstanding;
  const costsSeason = sum(costKeys,'earned');
  // الخرشوف مالوش مخزون بيتبقى: اللي بيدخل بيتشغّل ويتباع في نفس الأسبوع
  const seasonProfit = groups.factories.earned - costsSeason - expenses - equipmentCost;
  const weekCosts = sum(costKeys,'earnedWeek');
  const weekProfit = groups.factories.earnedWeek - weekCosts - expensesWeek;
  const missing = OVERVIEW_GROUPS.reduce((s,g)=>s+groups[g.key].missing,0);
  return { groups, expenses, expensesWeek, equipmentCost, partnersNet, debtsOutstanding, capital, cash, receivables, payables,
    seasonProfit, weekProfit, laborWeek: labor('earnedWeek'), missing };
}
