  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{ setDebts((await apiFetch('/api/debts')).map(mapDebtFromServer)); }
    catch(e){ setError(e.message); }
    setLoading(false);
  }

  async function add(){
    if(!form.lender || !form.amount) return;
    try{
      const x = await apiFetch('/api/debts', {method:'POST', body:JSON.stringify(mapDebtToServer(form))});
      setDebts([mapDebtFromServer(x), ...debts]);
      setForm({date:todayStr(), lender:'', amount:'', repaid:'', reason:''});
    }catch(e){ alert(e.message); }
  }
  async function update(id,draft){
    try{
      const x = await apiFetch('/api/debts/'+id, {method:'PUT', body:JSON.stringify(mapDebtToServer(draft))});
      setDebts(debts.map(d=>d.id===id?mapDebtFromServer(x):d));
    }catch(e){ alert(e.message); }
  }
  async function remove(id){
    if(!confirm('تأكيد الحذف؟')) return;
    try{ await apiFetch('/api/debts/'+id, {method:'DELETE'}); }catch(e){ alert(e.message); return; }
    setDebts(debts.filter(x=>x.id!==id));
  }

  if(loading) return <div className="p-8 text-center text-ink/50">بيحمّل المديونات من السيرفر...</div>;
  if(error) return (
    <div className="p-8 text-center">
      <p className="text-rust mb-3">حصل خطأ: {error}</p>
      <button onClick={load} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">حاول تاني</button>
    </div>
  );

  const totalOutstanding = debts.reduce((s,x)=>s+((x.amount||0)-(x.repaid||0)),0);
  const columns = [
    {key:'date', label:'التاريخ', type:'date'},
    {key:'lender', label:'اسم الشخص', type:'text'},
    {key:'amount', label:'المبلغ المستلف', type:'number'},
    {key:'repaid', label:'المسدد', type:'number'},
    {key:'reason', label:'السبب', type:'text'},
    {key:'_remaining', label:'المتبقي', computed:true, render: row=>num((row.amount||0)-(row.repaid||0))},
  ];

  return (
    <div className="p-5 md:p-8 space-y-6">
      <VerseHeader text="﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَى أَهْلِهَا﴾"/>
      <h1 className="font-display text-3xl text-leaf-deep flex items-center gap-2"><Icon name="debt" className="w-7 h-7"/>المديونات</h1>
      <p className="text-ink/50 text-sm -mt-4">فلوس استلفتها من حد خلال الموسم عشان تدفع بيها لجلاب أو عامل أو غيره.</p>
      <div className="max-w-xs"><StatCard label="إجمالي المديونات المستحقة" value={money(totalOutstanding)} icon="debt" tone={totalOutstanding>0?'rust':'white'}/></div>

      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
          <div><label className="block text-xs text-ink/50 mb-1">التاريخ</label><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm"/></div>
          <div><label className="block text-xs text-ink/50 mb-1">اسم الشخص</label><input value={form.lender} onChange={e=>setForm({...form,lender:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm"/></div>
          <div><label className="block text-xs text-ink/50 mb-1">المبلغ</label><input type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm num"/></div>
          <div><label className="block text-xs text-ink/50 mb-1">المسدد لحد الآن</label><input type="number" value={form.repaid} onChange={e=>setForm({...form,repaid:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm num"/></div>
          <div><label className="block text-xs text-ink/50 mb-1">السبب</label><input value={form.reason} onChange={e=>setForm({...form,reason:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm"/></div>
        </div>
        <button onClick={add} className="mt-3 bg-leaf-deep hover:bg-leaf-mid text-cream text-sm rounded-lg px-4 py-2 flex items-center gap-2"><Icon name="plus" className="w-4 h-4"/>إضافة</button>
      </div>

      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 overflow-x-auto ledger-lines">
        <EditableTable columns={columns} rows={debts} onUpdate={update} onDelete={remove} emptyLabel="لسه مفيش مديونيات مسجلة"/>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- EQUIPMENT ---------------------------------------------------------- */
function mapEquipmentItemFromServer(it){
  return {
    id: it.id, type: it.type, startQty: it.start_qty,
    factoryMovements: (it.factoryMovements||[]).map(m=>({id:m.id, factoryId:m.factory_id, date:m.move_date, direction:m.direction, qty:m.qty, note:m.note||''})),
    sakinaStock: (it.sakinaStock||[]).map(s=>({id:s.id, sakinaId:s.sakina_id, qty:s.qty})),
    other: (it.other||[]).map(o=>({id:o.id, location:o.location, qty:o.qty})),
  };
}

function EquipmentPage({db,setDb}){
  const [items,setItems] = useState([]);
  const [factories,setFactories] = useState([]);
  const [sakinas,setSakinas] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  const [selected,setSelected]=useState(null);
  const [newType,setNewType]=useState(''); const [newStart,setNewStart]=useState('');
  const [selectedFactory,setSelectedFactory]=useState(null);
  const [moveForm,setMoveForm]=useState({date:todayStr(), direction:'out', qty:'', note:''});
  const [otherForm,setOtherForm]=useState({location:'', qty:''});
  const [editingStart,setEditingStart]=useState(false);
  const [startDraft,setStartDraft]=useState('');

  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{
      const [eq, fac, sak] = await Promise.all([apiFetch('/api/equipment'), apiFetch('/api/factories'), apiFetch('/api/sakinas')]);
      const mapped = eq.map(mapEquipmentItemFromServer);
      setItems(mapped);
      setFactories(fac.map(f=>({id:f.id, name:f.name})));
      setSakinas(sak.map(s=>({id:s.id, name:s.name})));
      if(mapped.length) setSelected(prev=> prev || mapped[0].id);
    }catch(e){ setError(e.message); }
    setLoading(false);
  }

  const item = items.find(x=>x.id===selected) || null;
  function patchItemLocal(id, patch){ setItems(items.map(x=>x.id===id?{...x,...patch}:x)); }

  async function addType(){
    if(!newType.trim()) return;
    try{
      const it = await apiFetch('/api/equipment', {method:'POST', body:JSON.stringify({type:newType.trim(), start_qty: parseFloat(newStart)||0})});
      const mapped = mapEquipmentItemFromServer(it);
      setItems([...items, mapped]); setNewType(''); setNewStart(''); setSelected(mapped.id);
    }catch(e){ alert(e.message); }
  }
  async function removeType(id){
    if(!confirm('تأكيد حذف الصنف؟')) return;
    try{ await apiFetch('/api/equipment/'+id, {method:'DELETE'}); }catch(e){ alert(e.message); return; }
    setItems(items.filter(x=>x.id!==id));
    if(selected===id) setSelected(null);
  }
  async function saveStartQty(){
    try{
      await apiFetch('/api/equipment/'+item.id, {method:'PUT', body:JSON.stringify({start_qty: parseFloat(startDraft)||0})});
      patchItemLocal(item.id, {startQty: parseFloat(startDraft)||0});
      setEditingStart(false);
    }catch(e){ alert(e.message); }
  }

  async function addMovement(){
    if(!selectedFactory || moveForm.qty==='') return;
    try{
      const m = await apiFetch(`/api/equipment/${item.id}/factory-movements`, {method:'POST', body:JSON.stringify({
        factory_id: selectedFactory, move_date: moveForm.date, direction: moveForm.direction, qty: parseFloat(moveForm.qty)||0, note: moveForm.note||''
      })});
      patchItemLocal(item.id, {factoryMovements:[...item.factoryMovements, {id:m.id, factoryId:m.factory_id, date:m.move_date, direction:m.direction, qty:m.qty, note:m.note||''}]});
      setMoveForm({date:todayStr(), direction:'out', qty:'', note:''});
    }catch(e){ alert(e.message); }
  }
  async function updateMovement(id, draft){
    try{
      const m = await apiFetch('/api/equipment-factory-movements/'+id, {method:'PUT', body:JSON.stringify({
        factory_id: draft.factoryId, move_date: draft.date, direction: draft.direction, qty: parseFloat(draft.qty)||0, note: draft.note||''
      })});
      patchItemLocal(item.id, {factoryMovements: item.factoryMovements.map(x=>x.id===id?{id:m.id, factoryId:m.factory_id, date:m.move_date, direction:m.direction, qty:m.qty, note:m.note||''}:x)});
    }catch(e){ alert(e.message); }
  }
  async function removeMovement(id){
    if(!confirm('تأكيد الحذف؟')) return;
    try{ await apiFetch('/api/equipment-factory-movements/'+id, {method:'DELETE'}); }catch(e){ alert(e.message); return; }
    patchItemLocal(item.id, {factoryMovements: item.factoryMovements.filter(x=>x.id!==id)});
  }

  function factoryBalance(factoryId){
    return (item?item.factoryMovements:[]).filter(m=>m.factoryId===factoryId).reduce((s,m)=> s + (m.direction==='out'? m.qty : -m.qty), 0);
  }
  const factoriesTotal = item ? factories.reduce((s,f)=>s+factoryBalance(f.id),0) : 0;

  async function setSakinaQty(sakinaId, qty){
    const q = parseFloat(qty)||0;
    try{
      await apiFetch(`/api/equipment/${item.id}/sakina-stock/${sakinaId}`, {method:'PUT', body:JSON.stringify({qty:q})});
      const exists = item.sakinaStock.find(s=>s.sakinaId===sakinaId);
      const next = exists ? item.sakinaStock.map(s=>s.sakinaId===sakinaId?{...s,qty:q}:s) : [...item.sakinaStock, {id:uid(), sakinaId, qty:q}];
      patchItemLocal(item.id, {sakinaStock: next});
    }catch(e){ alert(e.message); }
  }
  function sakinaQtyOf(sakinaId){ const s=(item?item.sakinaStock:[]).find(x=>x.sakinaId===sakinaId); return s?s.qty:0; }
  const sakinaTotal = item ? sakinas.reduce((s,sk)=>s+sakinaQtyOf(sk.id),0) : 0;

  async function addOther(){
    if(!otherForm.location || otherForm.qty==='') return;
    try{
      const o = await apiFetch(`/api/equipment/${item.id}/other`, {method:'POST', body:JSON.stringify({location:otherForm.location, qty: parseFloat(otherForm.qty)||0})});
      patchItemLocal(item.id, {other:[...item.other, {id:o.id, location:o.location, qty:o.qty}]});
      setOtherForm({location:'', qty:''});
    }catch(e){ alert(e.message); }
  }
  async function updateOther(id, draft){
    try{
      const o = await apiFetch('/api/equipment-other/'+id, {method:'PUT', body:JSON.stringify({location:draft.location, qty: parseFloat(draft.qty)||0})});
      patchItemLocal(item.id, {other: item.other.map(x=>x.id===id?{id:o.id,location:o.location,qty:o.qty}:x)});
    }catch(e){ alert(e.message); }
  }
  async function removeOther(id){
    if(!confirm('تأكيد الحذف؟')) return;
    try{ await apiFetch('/api/equipment-other/'+id, {method:'DELETE'}); }catch(e){ alert(e.message); return; }
    patchItemLocal(item.id, {other: item.other.filter(x=>x.id!==id)});
  }
  const otherTotal = item ? item.other.reduce((s,d)=>s+(d.qty||0),0) : 0;

  const accounted = factoriesTotal + sakinaTotal + otherTotal;
  const remaining = item ? item.startQty - accounted : 0;
  const factoryObj = factories.find(f=>f.id===selectedFactory) || null;

  if(loading) return <div className="p-8 text-center text-ink/50">بيحمّل العدة من السيرفر...</div>;
  if(error) return (
    <div className="p-8 text-center">
      <p className="text-rust mb-3">حصل خطأ: {error}</p>
      <button onClick={load} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">حاول تاني</button>
    </div>
  );

  return (
    <div className="p-5 md:p-8">
      <VerseHeader text="﴿وَأَقِيمُوا الْوَزْنَ بِالْقِسْطِ وَلَا تُخْسِرُوا الْمِيزَانَ﴾"/>
      <h1 className="font-display text-3xl text-leaf-deep mb-1 flex items-center gap-2"><Icon name="box" className="w-7 h-7"/>العدة</h1>
      <p className="text-ink/50 text-sm mb-6">تتبع البراميل والسكاكين والمعدات: اللي وديته للمصانع، اللي رجع، واللي موجود عند النوالات.</p>
      <div className="flex flex-col lg:flex-row gap-6">
        <div className="lg:w-72 shrink-0 bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4 h-fit space-y-3">
          <div className="grid grid-cols-1 gap-2">
            <input value={newType} onChange={e=>setNewType(e.target.value)} placeholder="اسم الصنف (برميل، سكين...)" className="rounded-lg border border-leaf-line px-3 py-2 text-sm"/>
            <input type="number" value={newStart} onChange={e=>setNewStart(e.target.value)} placeholder="العدد في بداية الموسم" className="rounded-lg border border-leaf-line px-3 py-2 text-sm num"/>
            <button onClick={addType} className="bg-leaf-deep text-cream rounded-lg py-2 text-sm flex items-center justify-center gap-1"><Icon name="plus" className="w-4 h-4"/>إضافة صنف</button>
          </div>
          <div className="space-y-1">
            {items.map(x=>(
              <button key={x.id} onClick={()=>{setSelected(x.id); setSelectedFactory(null); setEditingStart(false);}} className={`w-full text-right px-3 py-2.5 rounded-xl flex items-center justify-between ${selected===x.id?'bg-leaf-pale':'hover:bg-cream'}`}>
                <span className="font-bold text-sm">{x.type}</span>
                <span className="text-xs text-ink/50 num">{x.startQty}</span>
              </button>
            ))}
          </div>
        </div>

        <div className="flex-1 min-w-0">
          {!item && <div className="bg-white border border-dashed border-leaf-line rounded-2xl p-10 text-center text-ink/50">اختر صنف من القائمة أو ضيف صنف جديد</div>}
          {item && (
            <div className="space-y-5">
              <div className="flex items-center justify-between">
                <h2 className="text-2xl font-bold text-ink">{item.type}</h2>
                <button onClick={()=>removeType(item.id)} className="text-rust text-xs flex items-center gap-1 hover:underline"><Icon name="trash" className="w-4 h-4"/>حذف الصنف</button>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div className="bg-white rounded-xl border border-leaf-line/30 p-4 text-center relative">
                  <div className="text-xs text-ink/50 mb-1">بداية الموسم</div>
                  {editingStart ? (
                    <div className="flex items-center justify-center gap-1">
                      <input type="number" value={startDraft} onChange={e=>setStartDraft(e.target.value)} className="w-20 text-center rounded-lg border border-leaf-line px-1 py-1 text-sm num"/>
                      <button onClick={saveStartQty} className="text-leaf-mid"><Icon name="check" className="w-4 h-4"/></button>
                    </div>
                  ) : (
                    <div className="flex items-center justify-center gap-1">
                      <div className="font-bold num">{Math.round(item.startQty)}</div>
                      <button onClick={()=>{setStartDraft(item.startQty); setEditingStart(true);}} className="text-ink/30 hover:text-leaf-deep"><Icon name="edit" className="w-3.5 h-3.5"/></button>
                    </div>
                  )}
                </div>
                <div className="bg-white rounded-xl border border-leaf-line/30 p-4 text-center"><div className="text-xs text-ink/50 mb-1">عند المصانع</div><div className="font-bold num">{Math.round(factoriesTotal)}</div></div>
                <div className="bg-white rounded-xl border border-leaf-line/30 p-4 text-center"><div className="text-xs text-ink/50 mb-1">عند النوالات</div><div className="font-bold num">{Math.round(sakinaTotal)}</div></div>
                <div className={`rounded-xl p-4 text-center ${remaining<0?'bg-rust text-white':'bg-leaf-deep text-cream'}`}><div className="text-xs opacity-80 mb-1">المتبقي في المخزن</div><div className="font-bold num">{Math.round(remaining)}</div></div>
              </div>

              {/* factories movement */}
              <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
                <h3 className="font-bold text-sm text-leaf-deep mb-3">الحركة مع المصانع / التجار</h3>
                {factories.length===0 ? (
                  <p className="text-sm text-ink/40 text-center py-4">لسه مفيش مصانع/تجار مسجلين في المبيعات. سجّل واحد هناك وهيظهر هنا تلقائيًا.</p>
                ) : (
                  <>
                    <div className="flex flex-wrap gap-2 mb-4">
                      {factories.map(f=>{
                        const bal = factoryBalance(f.id);
                        return (
                          <button key={f.id} onClick={()=>setSelectedFactory(f.id)} className={`px-3 py-2 rounded-xl text-sm font-bold flex flex-col items-center gap-0.5 ${selectedFactory===f.id?'bg-leaf-deep text-cream':'bg-cream border border-leaf-line text-ink/70'}`}>
                            {f.name}
                            <span className="text-[10px] num opacity-80">لينا عندهم: {Math.round(bal)}</span>
                          </button>
                        );
                      })}
                    </div>
                    {factoryObj && (
                      <div>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
                          <div><label className="block text-xs text-ink/50 mb-1">التاريخ</label><input type="date" value={moveForm.date} onChange={e=>setMoveForm({...moveForm,date:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm"/></div>
                          <div><label className="block text-xs text-ink/50 mb-1">الاتجاه</label>
                            <select value={moveForm.direction} onChange={e=>setMoveForm({...moveForm,direction:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm">
                              <option value="out">وديت لهم</option>
                              <option value="in">رجع منهم</option>
                            </select>
                          </div>
                          <div><label className="block text-xs text-ink/50 mb-1">العدد</label><input type="number" value={moveForm.qty} onChange={e=>setMoveForm({...moveForm,qty:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm num"/></div>
                          <div><label className="block text-xs text-ink/50 mb-1">ملاحظة</label><input value={moveForm.note} onChange={e=>setMoveForm({...moveForm,note:e.target.value})} className="w-full rounded-lg border border-leaf-line px-2 py-2 text-sm"/></div>
                        </div>
                        <button onClick={addMovement} className="bg-leaf-deep hover:bg-leaf-mid text-cream text-sm rounded-lg px-4 py-2 flex items-center gap-2 mb-3"><Icon name="plus" className="w-4 h-4"/>تسجيل حركة</button>
                        <div className="overflow-x-auto ledger-lines rounded-lg border border-leaf-line/20">
                          <EditableTable
                            columns={[
                              {key:'date',label:'التاريخ',type:'date'},
                              {key:'direction',label:'الاتجاه',type:'select', options:[{value:'out',label:'وديت لهم'},{value:'in',label:'رجع منهم'}], render:row=>row.direction==='out'?'وديت لهم':'رجع منهم'},
                              {key:'qty',label:'العدد',type:'number'},
                              {key:'note',label:'ملاحظة',type:'text'},
                              {key:'factoryId', label:'', computed:true, render:()=>''},
                            ]}
                            rows={item.factoryMovements.filter(m=>m.factoryId===selectedFactory).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
                            onUpdate={updateMovement} onDelete={removeMovement} emptyLabel="لسه مفيش حركة مسجلة مع المصنع ده"/>
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>

              {/* sakina stock */}
              <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
                <h3 className="font-bold text-sm text-leaf-deep mb-3">العدة المتاحة عند النوالات</h3>
                {sakinas.length===0 ? (
                  <p className="text-sm text-ink/40 text-center py-4">لسه مفيش نوالات مسجلة.</p>
                ) : (
                  <div className="space-y-2">
                    {sakinas.map(sk=>(
                      <div key={sk.id} className="flex items-center justify-between gap-3 border-b border-leaf-line/10 pb-2">
                        <span className="text-sm font-bold">{sk.name}</span>
                        <input key={item.id+'-'+sk.id} type="number" defaultValue={sakinaQtyOf(sk.id)} onBlur={e=>setSakinaQty(sk.id, e.target.value)} className="w-28 rounded-lg border border-leaf-line px-2 py-1.5 text-sm num"/>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* other */}
              <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4">
                <h3 className="font-bold text-sm text-leaf-deep mb-3">أماكن أخرى (مفقود، شخص معين...)</h3>
                <div className="grid grid-cols-2 gap-3 mb-3">
                  <input value={otherForm.location} onChange={e=>setOtherForm({...otherForm,location:e.target.value})} placeholder="المكان أو السبب" className="rounded-lg border border-leaf-line px-3 py-2 text-sm"/>
                  <input type="number" value={otherForm.qty} onChange={e=>setOtherForm({...otherForm,qty:e.target.value})} placeholder="العدد" className="rounded-lg border border-leaf-line px-3 py-2 text-sm num"/>
                </div>
                <button onClick={addOther} className="bg-leaf-deep hover:bg-leaf-mid text-cream text-sm rounded-lg px-4 py-2 flex items-center gap-2 mb-3"><Icon name="plus" className="w-4 h-4"/>إضافة</button>
                <div className="overflow-x-auto ledger-lines rounded-lg border border-leaf-line/20">
                  <EditableTable columns={[{key:'location',label:'المكان',type:'text'},{key:'qty',label:'العدد',type:'number'}]} rows={item.other} onUpdate={updateOther} onDelete={removeOther} emptyLabel="لا يوجد"/>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- PRICING ---------------------------------------------------------- */
function PricingPage({db,setDb}){
  const [mode,setMode] = useState('weekly'); // 'daily' | 'weekly' | 'seasonal'
  const todayS = todayStr();
  const initWs = getWeekStart(todayS);
  const [dayDate,setDayDate] = useState(todayS);
  const [weekStart,setWeekStart] = useState(initWs);
  const [priceDays,setPriceDays] = useState(db.priceDays||[]);
  const [priceWeeks,setPriceWeeks] = useState(db.priceWeeks||[]);
  const [seasonPrices,setSeasonPrices] = useState(db.seasonPrices||null);
  const [draft,setDraft] = useState({...DEFAULT_PRICES});
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState('');
  const [routes,setRoutes] = useState([]);
  const [routeForm,setRouteForm] = useState({from_location:'', to_location:'', price:''});

  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{
      const [t, rts] = await Promise.all([loadPriceTables(), apiFetch('/api/transport-routes')]);
      const days = t.priceDays, weeks = t.priceWeeks, season = t.seasonPrices;
      setPriceDays(days); setPriceWeeks(weeks); setSeasonPrices(season); setRoutes(rts);
      setDb(prev=>({...prev, priceDays: days, priceWeeks: weeks, seasonPrices: season}));
      const ex = weeks.find(w=>w.weekStart===initWs);
      setDraft(withPriceDefaults(ex));
    }catch(e){ setError(e.message); }
    setLoading(false);
  }

  function selectDay(rawDate){
    setDayDate(rawDate);
    const ex = priceDays.find(d=>d.day===rawDate);
    setDraft(withPriceDefaults(ex));
  }
  function selectWeek(rawDate){
    const ws = getWeekStart(rawDate);
    setWeekStart(ws);
    const ex = priceWeeks.find(w=>w.weekStart===ws);
    setDraft(withPriceDefaults(ex));
  }
  function switchMode(m){
    setMode(m);
    if(m==='seasonal') setDraft(withPriceDefaults(seasonPrices));
    else if(m==='daily') selectDay(todayS);
    else selectWeek(todayS);
  }
  function set(path, value){
    const copy = JSON.parse(JSON.stringify(draft));
    let obj = copy;
    for(let i=0;i<path.length-1;i++){ if(!obj[path[i]]) obj[path[i]] = {}; obj = obj[path[i]]; }
    obj[path[path.length-1]] = value===''? '' : parseFloat(value);
    setDraft(copy);
  }
  async function save(){
    const pricesPayload = {...draft}; delete pricesPayload.weekStart; delete pricesPayload.day;
    try{
      if(mode==='seasonal'){
        await apiFetch('/api/prices', {method:'PUT', body:JSON.stringify({scope:'season', prices: pricesPayload})});
        setSeasonPrices(pricesPayload);
        setDb(prev=>({...prev, seasonPrices: pricesPayload}));
        alert('تم حفظ التسعير الموسمي');
      } else if(mode==='daily'){
        await apiFetch('/api/prices', {method:'PUT', body:JSON.stringify({scope:'day', week_start:dayDate, prices: pricesPayload})});
        const others = priceDays.filter(p=>p.day!==dayDate);
        const next = [...others, {day:dayDate, ...pricesPayload}];
        setPriceDays(next);
        setDb(prev=>({...prev, priceDays: next}));
        alert('تم حفظ أسعار يوم '+formatDateWithDay(dayDate));
      } else {
        await apiFetch('/api/prices', {method:'PUT', body:JSON.stringify({scope:'week', week_start:weekStart, prices: pricesPayload})});
        const others = priceWeeks.filter(p=>p.weekStart!==weekStart);
        const nextWeeks = [...others, {weekStart, ...pricesPayload}];
        setPriceWeeks(nextWeeks);
        setDb(prev=>({...prev, priceWeeks: nextWeeks}));
        alert('تم حفظ أسعار أسبوع '+getWeekRangeLabel(weekStart));
      }
    }catch(e){ alert(e.message); }
  }

  async function addRoute(){
    if(!routeForm.from_location || !routeForm.to_location) return;
    try{
      const r = await apiFetch('/api/transport-routes', {method:'POST', body:JSON.stringify({...routeForm, price: parseFloat(routeForm.price)||0})});
      setRoutes([...routes, r]);
      setRouteForm({from_location:'', to_location:'', price:''});
    }catch(e){ alert(e.message); }
  }
  async function updateRoute(id, draftRow){
    try{
      const r = await apiFetch('/api/transport-routes/'+id, {method:'PUT', body:JSON.stringify({from_location:draftRow.from_location, to_location:draftRow.to_location, price: parseFloat(draftRow.price)||0})});
      setRoutes(routes.map(x=>x.id===id?r:x));
    }catch(e){ alert(e.message); }
  }
  async function removeRoute(id){
    if(!confirm('تأكيد الحذف؟')) return;
    try{ await apiFetch('/api/transport-routes/'+id, {method:'DELETE'}); }catch(e){ alert(e.message); return; }
    setRoutes(routes.filter(x=>x.id!==id));
  }

  if(loading) return <div className="p-8 text-center text-ink/50">بيحمّل التسعير من السيرفر...</div>;
  if(error) return (
    <div className="p-8 text-center">
      <p className="text-rust mb-3">حصل خطأ: {error}</p>
      <button onClick={load} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">حاول تاني</button>
    </div>
  );

  return (
    <div className="p-5 md:p-10 space-y-8 max-w-4xl mx-auto">
      <VerseHeader text="﴿وَأَوْفُوا الْكَيْلَ وَلَا تَكُونُوا مِنَ الْمُخْسِرِينَ﴾"/>
      <h1 className="font-display text-4xl text-leaf-deep flex items-center gap-3 mb-8"><Icon name="tag" className="w-9 h-9"/>التسعير</h1>

      <div className="flex gap-2">
        <button onClick={()=>switchMode('daily')} className={`px-4 py-2 rounded-t-xl text-sm font-bold ${mode==='daily'?'bg-white text-leaf-deep':'bg-creamdark text-ink/50'}`}>تسعير يومي</button>
        <button onClick={()=>switchMode('weekly')} className={`px-4 py-2 rounded-t-xl text-sm font-bold ${mode==='weekly'?'bg-white text-leaf-deep':'bg-creamdark text-ink/50'}`}>تسعير أسبوعي</button>
        <button onClick={()=>switchMode('seasonal')} className={`px-4 py-2 rounded-t-xl text-sm font-bold ${mode==='seasonal'?'bg-white text-leaf-deep':'bg-creamdark text-ink/50'}`}>تسعير موسمي</button>
      </div>

      {mode==='daily' && (
        <div className="bg-white/80 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-6 flex flex-wrap items-center gap-6">
          <div>
            <label className="block text-xs font-bold text-ink/70 mb-2">اختر اليوم</label>
            <input type="date" value={dayDate} onChange={e=>selectDay(e.target.value)} className="rounded-xl border border-leaf-line/60 bg-white/50 px-4 py-2 text-sm shadow-sm focus:bg-white"/>
          </div>
          <div className="text-sm text-leaf-deep font-black bg-leaf-pale/40 px-4 py-2 rounded-xl">اليوم الحالي في التعديل: {formatDateWithDay(dayDate)}</div>
        </div>
      )}
      {mode==='weekly' && (
        <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-4 flex flex-wrap items-center gap-4">
          <div>
            <label className="block text-xs text-ink/50 mb-1">اختر أي يوم من الأسبوع المطلوب</label>
            <input type="date" onChange={e=>selectWeek(e.target.value)} className="rounded-lg border border-leaf-line px-3 py-2 text-sm"/>
          </div>
          <div className="text-sm text-leaf-deep font-bold">الأسبوع الحالي في التعديل: {getWeekRangeLabel(weekStart)}</div>
          <button onClick={()=>selectWeek(todayS)} className="text-xs px-3 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">أسبوع النهاردة</button>
        </div>
      )}
      {mode==='seasonal' && (
        <div className="bg-white/80 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-6">
          <p className="text-sm text-ink/70 font-medium">الأولوية: <span className="font-bold text-leaf-deep">تسعير اليوم ← تسعير الأسبوع ← آخر أسبوع متسعّر قبله ← التسعير الموسمي.</span> يعني الأسبوع اللي ملهوش تسعير بياخد سعر الأسبوع اللي قبله، والموسمي بيتطبق بس لو مفيش أي أسبوع متسعّر قبل كده. وأي تعديل في التسعير بيتطبق على كل العمليات بتاعة الفترة دي (الكشوف القديمة والربح).</p>
        </div>
      )}

      <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-5">
        <h3 className="font-bold text-leaf-deep mb-3">الجلابة</h3>
        <div className="max-w-xs">
          <label className="block text-xs text-ink/50 mb-1">سعر الكوز</label>
          <input type="number" value={draft.jalabPerKuz} onChange={e=>set(['jalabPerKuz'], e.target.value)} className="w-full rounded-lg border border-leaf-line px-3 py-2 num"/>
        </div>
      </div>

      <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-8">
        <h3 className="font-bold text-lg text-leaf-deep mb-5">النوالات (السعر لكل 1000 قطعة)</h3>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          {Object.keys(draft.niswan).map(type=>(
            <div key={type} className="border border-leaf-line/40 rounded-2xl p-5 bg-white/50 shadow-sm hover:shadow-md transition-all">
              <div className="font-black text-leaf-deep mb-4 text-center border-b border-leaf-line/20 pb-2">{type}</div>
              <div className="flex gap-4">
                <div className="flex-1">
                  <label className="block text-xs font-bold text-ink/60 mb-2">من غير قشر</label>
                  <input type="number" value={draft.niswan[type].withoutPeel} onChange={e=>set(['niswan',type,'withoutPeel'], e.target.value)} className="w-full rounded-xl border border-leaf-line/60 px-4 py-2 num shadow-inner bg-white"/>
                </div>
                <div className="flex-1">
                  <label className="block text-xs font-bold text-ink/60 mb-2">مع القشر</label>
                  <input type="number" value={draft.niswan[type].withPeel} onChange={e=>set(['niswan',type,'withPeel'], e.target.value)} className="w-full rounded-xl border border-leaf-line/60 px-4 py-2 num shadow-inner bg-white"/>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-8">
        <h3 className="font-bold text-lg text-leaf-deep mb-5">التخريط (السعر لكل برميل)</h3>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
          {Object.keys(draft.takhrit).map(type=>(
            <div key={type}>
              <label className="block text-xs font-bold text-ink/60 mb-2">{type}</label>
              <input type="number" value={draft.takhrit[type]} onChange={e=>set(['takhrit',type], e.target.value)} className="w-full rounded-xl border border-leaf-line/60 px-4 py-2 num shadow-inner bg-white"/>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-8">
        <h3 className="font-bold text-lg text-leaf-deep mb-5">المبيعات (السعر لكل كيلو / كوز)</h3>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {Object.keys(draft.sales||{}).map(type=>(
            <div key={type} className="bg-white/50 p-3 rounded-2xl border border-leaf-line/30 hover:shadow-sm transition-shadow">
              <label className="block text-xs text-ink/80 font-bold mb-2 text-center">{type} <span className="opacity-60 font-normal">({type==='أخضر'||type==='فرنساوي'||type==='بلدي'||type==='فرزة'?'كوز':'كيلو'})</span></label>
              <input type="number" value={draft.sales[type]} onChange={e=>set(['sales',type], e.target.value)} className="w-full rounded-xl border border-leaf-line/60 px-4 py-2 num shadow-inner bg-white text-center font-bold"/>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-8">
        <h3 className="font-bold text-lg text-leaf-deep mb-5">أنفار النوالة</h3>
        <div className="max-w-xs">
          <label className="block text-xs font-bold text-ink/60 mb-2">اليومية</label>
          <input type="number" value={draft.workerDailyWage} onChange={e=>set(['workerDailyWage'], e.target.value)} className="w-full rounded-xl border border-leaf-line/60 px-4 py-2 num shadow-inner bg-white"/>
        </div>
      </div>

      <button onClick={save} className="bg-gradient-to-r from-leaf-mid to-leaf-deep text-cream rounded-2xl px-8 py-4 font-black flex items-center justify-center gap-3 w-full sm:w-auto shadow-md hover:shadow-lg transition-all hover:-translate-y-0.5 text-lg">
        <Icon name="check" className="w-5 h-5"/>{mode==='seasonal'?'حفظ التسعير الموسمي':mode==='daily'?'حفظ تعديلات هذا اليوم':'حفظ تعديلات هذا الأسبوع'}
      </button>

      {mode==='daily' && priceDays.length>0 && (
        <div className="bg-white/80 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-6 mt-8">
          <h3 className="font-bold text-sm text-leaf-deep mb-4">أيام محفوظة سابقًا</h3>
          <div className="flex flex-wrap gap-2">
            {priceDays.slice().sort((a,b)=>b.day.localeCompare(a.day)).map(p=>(
              <button key={p.day} onClick={()=>selectDay(p.day)} className={`text-xs px-4 py-2 rounded-xl border transition-all ${p.day===dayDate?'bg-leaf-deep text-cream border-leaf-deep shadow-sm':'border-leaf-line text-ink/60 hover:bg-white/50'}`}>{formatDateWithDay(p.day)}</button>
            ))}
          </div>
        </div>
      )}
      {mode==='weekly' && priceWeeks.length>0 && (
        <div className="bg-white/80 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-6 mt-8">
          <h3 className="font-bold text-sm text-leaf-deep mb-4">أسابيع محفوظة سابقًا</h3>
          <div className="flex flex-wrap gap-2">
            {priceWeeks.slice().sort((a,b)=>b.weekStart.localeCompare(a.weekStart)).map(p=>(
              <button key={p.weekStart} onClick={()=>selectWeek(p.weekStart)} className={`text-xs px-4 py-2 rounded-xl border transition-all ${p.weekStart===weekStart?'bg-leaf-deep text-cream border-leaf-deep shadow-sm':'border-leaf-line text-ink/60 hover:bg-white/50'}`}>{getWeekRangeLabel(p.weekStart)}</button>
            ))}
          </div>
        </div>
      )}

      <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-card border border-leaf-line/30 p-8 mt-8">
        <h3 className="font-bold text-lg text-leaf-deep mb-5">المشاوير الثابتة للعربيات</h3>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <input value={routeForm.from_location} onChange={e=>setRouteForm({...routeForm,from_location:e.target.value})} placeholder="من" className="rounded-xl border border-leaf-line/60 bg-white/50 px-4 py-2 text-sm shadow-sm"/>
          <input value={routeForm.to_location} onChange={e=>setRouteForm({...routeForm,to_location:e.target.value})} placeholder="إلى" className="rounded-xl border border-leaf-line/60 bg-white/50 px-4 py-2 text-sm shadow-sm"/>
          <input type="number" value={routeForm.price} onChange={e=>setRouteForm({...routeForm,price:e.target.value})} placeholder="السعر" className="rounded-xl border border-leaf-line/60 bg-white/50 px-4 py-2 text-sm num shadow-sm"/>
        </div>
        <button onClick={addRoute} className="bg-gradient-to-r from-leaf-mid to-leaf-deep hover:shadow-md transition-all text-cream text-sm rounded-xl px-5 py-2.5 flex items-center justify-center gap-2 mb-5 font-bold"><Icon name="plus" className="w-4 h-4"/>إضافة مشوار ثابت</button>
        <div className="overflow-x-auto ledger-lines rounded-2xl border border-leaf-line/30 shadow-sm">
          <EditableTable columns={[{key:'from_location',label:'من',type:'text'},{key:'to_location',label:'إلى',type:'text'},{key:'price',label:'السعر',type:'number'}]} rows={routes} onUpdate={updateRoute} onDelete={removeRoute} emptyLabel="لسه مفيش مشاوير ثابتة"/>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- DASHBOARD ---------------------------------------------------------- */
function Dashboard({db,setDb,user,setUser}){
  const [data,setData] = useState(null);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  const [dashboardWeekDate,setDashboardWeekDate] = useState(todayStr());
  const [phone,setPhone] = useState(user.owner_phone||'');

  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{
      const [jalaba, workers, takhritFixed, banadeer, factories, sakinas, expenses, debts, partners, raseef, transport] = await Promise.all([
        apiFetch('/api/jalaba'), apiFetch('/api/workers'), apiFetch('/api/takhrit-fixed'), apiFetch('/api/banadeer'),
        apiFetch('/api/factories'), apiFetch('/api/sakinas'), apiFetch('/api/expenses'), apiFetch('/api/debts'), apiFetch('/api/partner-transactions'), apiFetch('/api/raseef'),
        apiFetch('/api/transport'),
      ]);
      const sakinaWorkersArrays = await Promise.all(sakinas.map(s=>apiFetch(`/api/sakinas/${s.id}/workers`)));
      // تسعيرة كل جلاب/مصنع/بائع الأسبوعية بنفس الشكل اللي بتستخدمه صفحاتهم — عشان الأرقام تطابق كشوف الحساب
      const withWeekly = list => (list||[]).map(p=>({...p, weeklyPrices: normalizeWeeklyPrices(p.weeklyPrices || p.weekly_prices)}));
      setData({ jalaba: withWeekly(jalaba), workers, takhritFixed, banadeer, factories: withWeekly(factories), sakinas, sakinaWorkers: sakinaWorkersArrays.flat(), expenses, debts, partners, raseef: withWeekly(raseef), transport: transport||[] });
    }catch(e){ setError(e.message); }
    setLoading(false);
  }


  if(loading) return <div className="p-8 text-center text-ink/50">بيحمّل ملخص النوالة من السيرفر...</div>;
  if(error) return (
    <div className="p-8 text-center">
      <p className="text-rust mb-3">حصل خطأ: {error}</p>
      <button onClick={load} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">حاول تاني</button>
    </div>
  );

  const paidAll = people => people.reduce((s,p)=>s+(p.payments||[]).reduce((s2,x)=>s2+(x.amount||0),0),0);
  const earnedAll = (people, calcFn) => people.reduce((s,p)=>s+(p.entries||[]).reduce((s2,e)=>s2+calcFn(e, getPriceSetForDate(db,e.entry_date), p),0),0);

  const jalabaCalc = (e,ps,p)=> calcJalabEntry({ date: e.entry_date, kuz: e.kuz, price: e.price, itemType: e.item_type }, ps, p);
  const takhritCalc = (e,ps,p)=> (parseFloat(e.barrels)||0) * ((e.price!==null&&e.price!==undefined&&e.price!=='') ? parseFloat(e.price) : ((ps.takhrit||{})[e.barrel_type]||0));
  const workerCalc = (e,ps,p)=> e.present ? (ps.workerDailyWage||0) : 0;
  const sakinaCalc = (e,ps,p)=> (parseFloat(e.pieces)||0)/1000 * (((ps.niswan||{})[e.item_type]||{})[e.took_peel?'withPeel':'withoutPeel']||0);
  const transportCalc = (e,ps,p)=> parseFloat(e.price)||0;
  const salesCalc = (e,ps,p)=> getEntryPricingDetails({ date: e.entry_date, kind: e.kind, itemType: e.item_type, grade: e.grade, tons: e.tons, pricePerTon: e.price_per_ton, discount: e.discount }, ps, p).netTotal;

  const raseefCalc = (e,ps,p)=> getEntryPricingDetails({ date: e.entry_date, kind: e.kind, itemType: e.item_type, grade: e.grade, quantity: e.quantity, price: e.price, discount: e.discount }, ps, p, 'purchase').netTotal;
  const targetWs = getWeekStart(dashboardWeekDate);
  const paidWeekOf = (people, ws) => people.reduce((s,p)=>s+(p.payments||[]).filter(x=>getWeekStart(x.pay_date)===ws).reduce((s2,x)=>s2+(x.amount||0),0),0);
  const earnedWeekOf = (people, calcFn, ws) => people.reduce((s,p)=>s+(p.entries||[]).filter(e=>getWeekStart(e.entry_date)===ws).reduce((s2,e)=>s2+calcFn(e, getPriceSetForDate(db,e.entry_date), p),0),0);

  // المشتريات: كله على الأسبوع المختار (زي باقي الكروت) مش الأسبوع الحالي
  const raseefAll = paidAll(data.raseef || []), raseefWeek = paidWeekOf(data.raseef || [], targetWs);
  const raseefEarnedAll = earnedAll(data.raseef || [], raseefCalc);
  const raseefEarnedWeek = earnedWeekOf(data.raseef || [], raseefCalc, targetWs);
  const raseefRemaining = raseefEarnedAll - raseefAll;

  const salesAll = paidAll(data.factories), salesWeek = paidWeekOf(data.factories, targetWs);
  const salesEarnedAll = earnedAll(data.factories, salesCalc);
  const salesEarnedWeek = earnedWeekOf(data.factories, salesCalc, targetWs);
  const salesRemaining = salesEarnedAll - salesAll;
  const jalabaAll = paidAll(data.jalaba), jalabaWeek = paidWeekOf(data.jalaba, targetWs);
  const jalabaEarnedAll = earnedAll(data.jalaba, jalabaCalc), jalabaEarnedWeek = earnedWeekOf(data.jalaba, jalabaCalc, targetWs);
  const laborAll = paidAll(data.takhritFixed)+paidAll(data.banadeer)+paidAll(data.workers)+paidAll(data.sakinaWorkers);
  const laborWeek = paidWeekOf(data.takhritFixed, targetWs)+paidWeekOf(data.banadeer, targetWs)+paidWeekOf(data.workers, targetWs)+paidWeekOf(data.sakinaWorkers, targetWs);
  const laborEarnedAll = earnedAll(data.takhritFixed,takhritCalc)+earnedAll(data.banadeer,takhritCalc)+earnedAll(data.workers,workerCalc)+earnedAll(data.sakinaWorkers,sakinaCalc);
  const laborEarnedWeek = earnedWeekOf(data.takhritFixed,takhritCalc,targetWs)+earnedWeekOf(data.banadeer,takhritCalc,targetWs)+earnedWeekOf(data.workers,workerCalc,targetWs)+earnedWeekOf(data.sakinaWorkers,sakinaCalc,targetWs);
  // العربيات: المشاوير المستحقة والمدفوع لأصحابها
  const transportAll = paidAll(data.transport), transportEarnedAll = earnedAll(data.transport, transportCalc);
  const transportEarnedWeek = earnedWeekOf(data.transport, transportCalc, targetWs);
  const expAll = data.expenses.reduce((s,x)=>s+(x.amount||0),0);
  const expWeek = data.expenses.filter(x=>getWeekStart(x.expense_date)===targetWs).reduce((s,x)=>s+(x.amount||0),0);
  const partnersNet = data.partners.reduce((s,x)=>s+(x.type==='إيداع'?x.amount:-x.amount),0);
  const debtsOutstanding = data.debts.reduce((s,x)=>s+((x.amount||0)-(x.repaid||0)),0);

  const capital = user.capital||0;
  const cashBox = capital + salesAll + partnersNet + debtsOutstanding - jalabaAll - laborAll - expAll - raseefAll - transportAll;
  const seasonProfit = salesEarnedAll - expAll - jalabaEarnedAll - laborEarnedAll - raseefEarnedAll - transportEarnedAll;
  const weekProfit = salesEarnedWeek - expWeek - jalabaEarnedWeek - laborEarnedWeek - raseefEarnedWeek - transportEarnedWeek;

  const rows = [
    {label:'إجمالي المبيعات (مستحق)', value:salesEarnedWeek, sign:'+'},
    {label:'مستحقات الجلابة', value:jalabaEarnedWeek, sign:'-'},
    {label:'حساب العمال (تخريط، نوالات، عمال)', value:laborEarnedWeek, sign:'-'},
    {label:'مشتريات الرصيف', value:raseefEarnedWeek, sign:'-'},
    {label:'مصاريف النوالة', value:expWeek, sign:'-'},
    {label:'مشاوير العربيات', value:transportEarnedWeek, sign:'-'},
  ];
  const maxVal = Math.max(1, ...rows.map(r=>r.value));

  async function saveNawala(patch){
    try{
      const updated = await apiFetch('/api/nawala', {method:'PUT', body:JSON.stringify({
        capital: patch.capital!==undefined ? patch.capital : user.capital,
        owner_phone: patch.owner_phone!==undefined ? patch.owner_phone : user.owner_phone,
      })});
      setUser({...user, ...updated});
    }catch(e){ alert(e.message); }
  }
  async function savePhone(){ await saveNawala({owner_phone: phone}); alert('تم حفظ الرقم'); }
  function sendWeekly(){
    const text = [
      'ملخص أسبوع النوالة',
      'الأسبوع: '+getWeekRangeLabel(targetWs), '',
      'إجمالي المبيعات (مستحق): '+money(salesEarnedWeek),
      'الواصل فعليًا من المبيعات: '+money(salesWeek),
      'مستحقات الجلابة: '+money(jalabaEarnedWeek),
      'حساب العمال: '+money(laborEarnedWeek),
      'مشتريات الرصيف: '+money(raseefEarnedWeek),
      'مصاريف النوالة: '+money(expWeek),
      'مشاوير العربيات: '+money(transportEarnedWeek),
      'صافي ربح الأسبوع: '+money(weekProfit), '',
      'السيولة الحالية: '+money(cashBox),
      'إجمالي المديونات: '+money(debtsOutstanding),
    ].join('\n');
    waShare(text, phone || user.owner_phone);
  }

  const empty = data.jalaba.length===0 && data.factories.length===0 && data.sakinas.length===0;

  return (
    <div className="p-5 md:p-8 space-y-6">
      <VerseHeader text="﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا * وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ﴾"/>
      <h1 className="font-display text-3xl text-leaf-deep">أهلاً بيك في نوالتك</h1>

      {empty && (
        <div className="bg-white border border-dashed border-leaf-line rounded-2xl p-8 text-center text-ink/60">
          <ArtichokeMark className="w-14 h-14 mx-auto mb-3 opacity-70"/>
          <p className="mb-1">لسه معندكش بيانات مسجّلة في النوالة.</p>
          <p className="text-sm">ابدأ بتسجيل رأس المال، وبعدين جلاب أو نوالة من القائمة على اليمين.</p>
        </div>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <CapitalCard capital={capital} onSave={v=>saveNawala({capital:v})}/>
        <StatCard label="السيولة الحالية (كاش دلوقتي)" value={money(cashBox)} icon="coin" tone="leaf" sub="رأس المال + الواصل من المبيعات + صافي الشركاء + المديونات − المصاريف − المدفوع لكل الأطراف (جلابة، رصيف، عمال، عربيات)"/>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <StatCard label="صافي الربح الأسبوعي" value={money(weekProfit)} icon={weekProfit>=0?'check':'arrow'} tone={weekProfit>=0?'gold':'rust'}/>
        <StatCard label="ربح الموسم (حتى الآن)" value={money(seasonProfit)} icon="coin" tone="white"/>
        <StatCard label="إجمالي المديونات" value={money(debtsOutstanding)} icon="debt" tone={debtsOutstanding>0?'rust':'white'}/>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <StatCard label="الواصل من المبيعات (الأسبوع)" value={money(salesWeek)} icon="receipt" tone="white" sub={`مستحق الأسبوع: ${num(salesEarnedWeek)}`}/>
        <StatCard label="المستحق من المبيعات (الموسم)" value={money(salesEarnedAll)} icon="receipt" tone="white"/>
        <StatCard label="الباقي عند المصانع" value={money(salesRemaining)} icon="receipt" tone={salesRemaining>0?'rust':'white'}/>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4 mb-4">
        <StatCard label="المدفوع للمشتريات (الأسبوع)" value={money(raseefWeek)} icon="truck" tone="white" sub={`مستحق الأسبوع: ${num(raseefEarnedWeek)}`}/>
        <StatCard label="المستحق للمشتريات (الموسم)" value={money(raseefEarnedAll)} icon="truck" tone="white"/>
        <StatCard label="باقي مستحقات المشتريات" value={money(raseefRemaining)} icon="truck" tone={raseefRemaining>0?'rust':'white'}/>
      </div>

      <div className="bg-white/60 backdrop-blur-2xl rounded-[2.5rem] shadow-card border border-white/80 p-8">
        <div className="flex items-center justify-between flex-wrap gap-2 mb-6">
          <h3 className="font-bold font-display text-2xl text-leaf-deep text-base drop-shadow-sm">ملخص أسبوع ({getWeekRangeLabel(targetWs)})</h3>
          <div className="flex items-center gap-3">
            <label className="text-sm text-ink/70 font-bold">اختر الأسبوع:</label>
            <input type="date" value={dashboardWeekDate} onChange={e=>setDashboardWeekDate(e.target.value)} className="rounded-2xl border border-white/60 px-4 py-2 text-sm num bg-white/50 backdrop-blur-sm font-bold shadow-sm"/>
          </div>
        </div>
        <div className="space-y-3">
          {rows.map((r,i)=>(
            <div key={i} className="flex items-center gap-3">
              <div className="w-40 shrink-0 text-sm text-ink/70 font-bold">{r.label}</div>
              <div className="flex-1 bg-white/50 border border-white/40 rounded-full h-4 overflow-hidden shadow-inner">
                <div className={`h-full rounded-full ${r.sign==='+'?'bg-gradient-to-r from-leaf-bright to-leaf-mid':'bg-gradient-to-r from-gold-light to-gold'}`} style={{width: (r.value/maxVal*100)+'%'}}/>
              </div>
              <div className={`w-28 text-left text-sm font-bold num ${r.sign==='+'?'text-leaf-mid':'text-rust'}`}>{r.sign}{num(r.value)}</div>
            </div>
          ))}
        </div>
        <div className="mt-8 pt-6 border-t border-white/60 flex items-center justify-between">
          <span className="font-bold text-ink text-xl">صافي ربح الأسبوع</span>
          <span className={`font-display text-3xl md:text-4xl drop-shadow-sm ${weekProfit>=0?'text-leaf-deep':'text-rust'}`}>{money(weekProfit)}</span>
        </div>
        <div className="mt-6 flex items-center gap-2 flex-wrap">
          <label className="text-sm text-ink/70 font-bold">رقم واتساب صاحب النوالة:</label>
          <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="2010xxxxxxxx" dir="ltr" className="rounded-2xl border border-white/60 px-4 py-2 text-sm num bg-white/50 w-44"/>
          <button onClick={savePhone} className="text-xs px-4 py-2 rounded-2xl border border-leaf-line text-leaf-deep bg-white/70 font-bold">حفظ الرقم</button>
          <button onClick={sendWeekly} className="text-xs px-4 py-2 rounded-2xl border border-[#25D366]/40 text-[#128C7E] bg-white font-bold flex items-center gap-1.5"><Icon name="whatsapp" className="w-4 h-4"/>ابعت ملخص الأسبوع واتساب</button>
        </div>
      </div>

    </div>
  );
}

/* ---------------------------------------------------------- APP ---------------------------------------------------------- */
function App(){
  const [user,setUser] = useState(null);
  const [checkingSession,setCheckingSession] = useState(true);
  const [page,setPage] = useState('dashboard');
  const [db,setDb] = useState(emptyDB());
  const [mobileOpen,setMobileOpen] = useState(false);

  useEffect(()=>{
    async function restore(){
      const token = getToken();
      if(!token){ setCheckingSession(false); return; }
      try{
        const me = await apiFetch('/api/me');
        setUser(me);
      }catch(e){
        setToken(null);
      }
      setCheckingSession(false);
    }
    restore();
  }, []);

  // الأسعار لازم تتحمل قبل أي صفحة، وإلا الحسابات كانت بتطلع بالأسعار الافتراضية
  const [pricesReady,setPricesReady] = useState(false);
  const [pricesError,setPricesError] = useState('');
  async function loadPrices(){
    setPricesError('');
    try{
      const t = await loadPriceTables();
      setDb(prev=>({...prev, ...t}));
      setPricesReady(true);
    }catch(e){ setPricesError(e.message); }
  }
  useEffect(()=>{ if(user) loadPrices(); else setPricesReady(false); }, [user && user.name]);

  function handleLogout(){ setToken(null); setUser(null); setDb(emptyDB()); setPage('dashboard'); }

  if(checkingSession) return <div className="min-h-screen flex items-center justify-center text-ink/40">بيتأكد من تسجيل الدخول...</div>;
  if(!user) return <Login onLogin={setUser}/>;
  if(!pricesReady) return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-3 text-ink/50">
      {pricesError ? (<>
        <p className="text-rust">ماقدرناش نحمّل الأسعار: {pricesError}</p>
        <button onClick={loadPrices} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">حاول تاني</button>
      </>) : 'بيحمّل التسعير...'}
    </div>
  );

  const titleMap = Object.fromEntries(NAV.map(n=>[n.key,n.label]));

  let content;
  if(page==='dashboard') content = <Dashboard db={db} setDb={setDb} user={user} setUser={setUser}/>;
  else if(page==='sales') content = <SalesPage db={db} setDb={setDb}/>;
  else if(page==='jalaba') content = <JalabaPage db={db} setDb={setDb}/>;
  else if(page==='raseef') content = <RaseefPage db={db} setDb={setDb}/>;
  else if(page==='workers') content = <WorkersPage db={db} setDb={setDb}/>;
  else if(page==='sakina') content = <SakinaPage db={db} setDb={setDb}/>;
  else if(page==='takhrit') content = <TakhritPage db={db} setDb={setDb}/>;
  else if(page==='expenses') content = <ExpensesPage db={db} setDb={setDb}/>;
  else if(page==='debts') content = <DebtsPage db={db} setDb={setDb}/>;
  else if(page==='equipment') content = <EquipmentPage db={db} setDb={setDb}/>;
  else if(page==='pricing') content = <PricingPage db={db} setDb={setDb}/>;

  return (
    <div className="min-h-screen flex flex-row-reverse">
      <Sidebar page={page} setPage={setPage} user={user.name} onLogout={handleLogout} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
      <div className="flex-1 min-w-0">
        <Topbar title={titleMap[page]} setMobileOpen={setMobileOpen}/>
        {content}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError:false, error:null }; }
  static getDerivedStateFromError(error){ return { hasError:true, error }; }
  componentDidCatch(error, info){ console.error(error, info); }
  render(){
    if(this.state.hasError){
      return (
        <div className="min-h-screen flex items-center justify-center p-6 bg-cream text-ink text-center">
          <div className="bg-white p-8 rounded-2xl shadow-card border border-leaf-line/40 max-w-md">
            <h2 className="text-xl font-bold text-rust mb-2">حصل خطأ أثناء تشغيل التطبيق</h2>
            <p className="text-sm text-ink/60 mb-4">{this.state.error?.message || 'خطأ غير معروف'}</p>
            <button onClick={()=>window.location.reload()} className="bg-leaf-deep text-cream px-4 py-2 rounded-lg font-bold">إعادة تحميل الصفحة</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App/>
  </ErrorBoundary>
);
</script>
</body>
</html>
