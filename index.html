function ArtichokeMark({className="w-16 h-16"}){
  const rows = [
    {cy:80, rx:32, ry:9,  n:9, len:32, wid:13, tone:'#33562F'},
    {cy:66, rx:27, ry:8,  n:8, len:28, wid:12, tone:'#3D6144'},
    {cy:52, rx:21, ry:7,  n:7, len:24, wid:11, tone:'#4C7A4E'},
    {cy:39, rx:15, ry:5.5,n:6, len:19, wid:9,  tone:'#5C8B54'},
    {cy:28, rx:8,  ry:3.5,n:5, len:14, wid:7,  tone:'#78A05A'},
  ];
  const petals = [];
  rows.forEach((row,ri)=>{
    for(let i=0;i<row.n;i++){
      const t = (i + (ri%2?0.5:0)) / row.n;
      const angle = t*360;
      const rad = angle*Math.PI/180;
      const cx = 50 + Math.cos(rad)*row.rx;
      const cy = row.cy + Math.sin(rad)*row.ry;
      const rot = angle+90;
      const w = row.wid/2;
      const l = row.len;
      petals.push(
        <path key={ri+'-'+i}
          d={`M0 0 C ${-w} ${-l*0.35} ${-w} ${-l*0.75} 0 ${-l} C ${w} ${-l*0.75} ${w} ${-l*0.35} 0 0 Z`}
          transform={`translate(${cx} ${cy}) rotate(${rot})`}
          fill={row.tone} stroke="#1F3524" strokeWidth="0.6" strokeOpacity="0.5"/>
      );
    }
  });
  return (
    <svg viewBox="0 0 100 100" className={className}>
      <path d="M46 89 Q50 98 54 89" stroke="#6B4A24" strokeWidth="3.5" fill="none" strokeLinecap="round"/>
      {petals}
      <ellipse cx="50" cy="21" rx="5" ry="7" fill="#8FB56C"/>
    </svg>
  );
}

/* ---------------------------------------------------------- HELPERS ---------------------------------------------------------- */
/* ---------------------------------------------------------- API CONNECTION ---------------------------------------------------------- */
// غيّر الرابط ده بعد ما ترفع السيرفر بتاعك (Render/Railway)، دلوقتي مظبوط للتجربة المحلية
const API_BASE = 'http://localhost:3001';

function getToken(){ return localStorage.getItem('nawalty_token'); }
function setToken(t){ if(t) localStorage.setItem('nawalty_token', t); else localStorage.removeItem('nawalty_token'); }

function localStoreGet(key, def=[]){
  try {
    const d = localStorage.getItem('nawalty_db_' + key);
    return d ? JSON.parse(d) : def;
  } catch(e) { return def; }
}
function localStoreSet(key, val){
  try { localStorage.setItem('nawalty_db_' + key, JSON.stringify(val)); } catch(e){}
}

/* ---------- الوضع المحلي (LocalStorage) ---------- */
let LOCAL_MODE = false; // بيبقى true لما السيرفر مش متاح ونشتغل على المتصفح

// كل المفاتيح المحلية اللي فيها قوائم أشخاص (جلابة، مصانع، عاملات نوالة...)
function allLocalListKeys(){
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('nawalty_db_') && k !== 'nawalty_db_user' && k !== 'nawalty_db_prices') keys.push(k.replace('nawalty_db_',''));
  }
  return keys;
}
// مفاتيح التخزين اللي ممكن يكون فيها شخص من نوع معين
function localKeysFor(mainKey){
  if(mainKey === 'sakina-workers') return allLocalListKeys().filter(k=>k.startsWith('sakina_workers_'));
  return [mainKey];
}
// تعديل/حذف عنصر فرعي (قيد، دفعة، حركة عدة...) بالـ id في أي قائمة محلية
function localMutateNested(subKey, itemId, method, body){
  for(const key of allLocalListKeys()){
    const list = localStoreGet(key, []);
    if(!Array.isArray(list)) continue;
    let found = null;
    const next = list.map(p=>{
      const sub = p && Array.isArray(p[subKey]) ? p[subKey] : null;
      if(!sub || !sub.some(x=>x.id===itemId)) return p;
      if(method === 'PUT'){
        const updated = sub.map(x=> x.id===itemId ? {...x, ...body, id:itemId} : x);
        found = updated.find(x=>x.id===itemId);
        return {...p, [subKey]: updated};
      }
      found = {ok:true};
      return {...p, [subKey]: sub.filter(x=>x.id!==itemId)};
    });
    if(found){ localStoreSet(key, next); return found; }
  }
  return null;
}
// تحويل أسماء المسارات الفرعية لاسم الحقل المخزّن
const NESTED_ROUTES = {
  'equipment-factory-movements': 'factoryMovements',
  'equipment-other': 'other',
};
function nestedSubKey(seg){
  if(NESTED_ROUTES[seg]) return NESTED_ROUTES[seg];
  if(seg.endsWith('-entries')) return 'entries';
  if(seg.endsWith('-payments')) return 'payments';
  return null;
}

async function apiFetchLocal(path, options={}){
  const method = (options.method || 'GET').toUpperCase();
  const body = options.body ? JSON.parse(options.body) : {};

  if(path === '/api/me'){
    return localStoreGet('user', { name: 'صاحب النوالة (وضع محلي)', capital: 0, owner_phone: '' });
  }
  if(path === '/api/login' || path === '/api/register'){
    const user = {...localStoreGet('user', {capital: 0, owner_phone: ''}), name: body.name || localStoreGet('user', {}).name || body.username || 'صاحب النوالة'};
    localStoreSet('user', user);
    setToken('local-demo-token');
    return { token: 'local-demo-token', nawala: user };
  }
  if(path === '/api/nawala' && method === 'PUT'){
    const user = {...localStoreGet('user', {}), ...body};
    localStoreSet('user', user);
    return user;
  }

  const parts = path.replace(/^\/api\//, '').split('/');
  const mainKey = parts[0];

  if(mainKey === 'prices'){
    let prices = localStoreGet('prices', []);
    if(method === 'GET') return prices;
    if(method === 'PUT'){
      const same = p => {
        if(p.scope !== body.scope) return false;
        if(body.scope === 'season') return true;
        if(body.scope === 'week') return normalizeWeekStart(p.week_start) === normalizeWeekStart(body.week_start);
        return p.week_start === body.week_start;
      };
      prices = prices.filter(p=>!same(p));
      prices.push(body);
      localStoreSet('prices', prices);
      return body;
    }
  }

  // تعديل/حذف قيد أو دفعة أو حركة عدة: /api/<x>-entries/<id>
  if(parts.length === 2 && nestedSubKey(parts[0]) && (method === 'PUT' || method === 'DELETE')){
    const res = localMutateNested(nestedSubKey(parts[0]), parts[1], method, body);
    if(res) return res;
    if(method === 'DELETE') return { ok: true };
    throw new Error('العملية دي مش موجودة في البيانات المحفوظة');
  }

  // عاملات النوالة: /api/sakinas/<id>/workers
  if(mainKey === 'sakinas' && parts.length === 3 && parts[2] === 'workers'){
    const key = 'sakina_workers_' + parts[1];
    const wList = localStoreGet(key, []);
    if(method === 'GET') return wList;
    if(method === 'POST'){
      const item = { id: uid(), name: body.name, entries: [], payments: [] };
      wList.push(item);
      localStoreSet(key, wList);
      return item;
    }
  }
  // حذف نوالة = حذف عاملاتها كمان
  if(mainKey === 'sakinas' && parts.length === 2 && method === 'DELETE'){
    localStorage.removeItem('nawalty_db_sakina_workers_' + parts[1]);
  }

  // العدة: حركات المصانع / الأماكن الأخرى / رصيد النوالات
  if(mainKey === 'equipment' && parts.length >= 3){
    let eq = localStoreGet('equipment', []);
    const itemId = parts[1];
    let result = null;
    eq = eq.map(it=>{
      if(it.id !== itemId) return it;
      if(parts[2] === 'factory-movements' && method === 'POST'){
        result = { id: uid(), ...body };
        return {...it, factoryMovements: [...(it.factoryMovements||[]), result]};
      }
      if(parts[2] === 'other' && method === 'POST'){
        result = { id: uid(), ...body };
        return {...it, other: [...(it.other||[]), result]};
      }
      if(parts[2] === 'sakina-stock' && parts[3] && method === 'PUT'){
        const stock = it.sakinaStock || [];
        const exists = stock.find(s=>s.sakina_id === parts[3]);
        result = exists ? {...exists, qty: body.qty} : { id: uid(), sakina_id: parts[3], qty: body.qty };
        return {...it, sakinaStock: exists ? stock.map(s=>s.sakina_id===parts[3]?result:s) : [...stock, result]};
      }
      return it;
    });
    if(!result) throw new Error('صنف العدة مش موجود');
    localStoreSet('equipment', eq);
    return result;
  }

  // إضافة قيد/دفعة لشخص: /api/<x>/<personId>/entries|payments
  if(parts.length === 3 && (parts[2] === 'entries' || parts[2] === 'payments')){
    const personId = parts[1];
    const subType = parts[2];
    const item = { id: uid(), ...body };
    for(const key of localKeysFor(mainKey)){
      const list = localStoreGet(key, []);
      if(!list.some(p=>p.id===personId)) continue;
      localStoreSet(key, list.map(p=> p.id===personId ? {...p, [subType]: [item, ...(p[subType]||[])]} : p));
      return item;
    }
    throw new Error('الشخص ده مش موجود في البيانات المحفوظة');
  }

  // عمليات القائمة الأساسية: GET / POST / PUT / DELETE
  if(mainKey === 'sakina-workers' && parts.length === 2){
    for(const key of localKeysFor(mainKey)){
      const list = localStoreGet(key, []);
      if(!list.some(p=>p.id===parts[1])) continue;
      if(method === 'DELETE'){ localStoreSet(key, list.filter(p=>p.id!==parts[1])); return { ok: true }; }
      if(method === 'PUT'){
        const next = list.map(p=>p.id===parts[1]?{...p, ...body}:p);
        localStoreSet(key, next); return next.find(p=>p.id===parts[1]);
      }
    }
    if(method === 'DELETE') return { ok: true };
  }

  let items = localStoreGet(mainKey, []);
  if(method === 'GET') return items;
  if(method === 'POST'){
    const item = { id: uid(), entries: [], payments: [], ...body };
    items.push(item);
    localStoreSet(mainKey, items);
    return item;
  }
  const itemId = parts[1];
  if(method === 'PUT' && itemId){
    items = items.map(x => {
      if(x.id !== itemId) return x;
      const merged = {...x, ...body};
      if(body.weekly_prices || body.weeklyPrices) merged.weeklyPrices = body.weekly_prices || body.weeklyPrices;
      delete merged.weekly_prices;
      return merged;
    });
    localStoreSet(mainKey, items);
    return items.find(x => x.id === itemId) || body;
  }
  if(method === 'DELETE' && itemId){
    items = items.filter(x => x.id !== itemId);
    localStoreSet(mainKey, items);
    return { ok: true };
  }

  return Array.isArray(items) ? items : {};
}

async function apiFetch(path, options={}){
  if(LOCAL_MODE) return apiFetchLocal(path, options);
  const token = getToken();
  const headers = { 'Content-Type':'application/json', ...(options.headers||{}) };
  if(token) headers['Authorization'] = 'Bearer '+token;
  let res;
  try{
    res = await fetch(API_BASE+path, {...options, headers});
  }catch(networkErr){
    // السيرفر مش شغال/مش متاح → نشتغل محلي على المتصفح
    LOCAL_MODE = true;
    return apiFetchLocal(path, options);
  }
  // السيرفر رد: أي خطأ منه (كلمة سر غلط، بيانات ناقصة...) يظهر للمستخدم ومايتحولش للمحلي
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'حصل خطأ من السيرفر');
  return data;
}

const uid = () => Math.random().toString(36).slice(2,10);
// تاريخ بالتوقيت المحلي (مصر) مش UTC — toISOString كانت بترجّع اليوم اللي قبله
function localDateStr(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const todayStr = () => localDateStr(new Date());
const money = n => (Math.round((n||0)*100)/100).toLocaleString('en-US') + ' جنيه';
const num = n => (Math.round((n||0)*100)/100).toLocaleString('en-US');

// بداية الأسبوع = السبت
function getWeekStart(dateStr){
  const d = new Date((dateStr||todayStr())+'T00:00:00');
  const day = d.getDay();
  const diff = (day - 6 + 7) % 7;
  d.setDate(d.getDate()-diff);
  return localDateStr(d);
}
// النسخة القديمة كانت بتسجل بداية الأسبوع يوم جمعة (بسبب فرق التوقيت) — نحولها للسبت اللي بعدها
function normalizeWeekStart(ws){
  if(!ws) return ws;
  const d = new Date(ws+'T00:00:00');
  if(isNaN(d.getTime())) return ws;
  if(d.getDay() === 5) d.setDate(d.getDate()+1);
  return getWeekStart(localDateStr(d));
}
function normalizeWeeklyPrices(list){
  const map = {};
  (list||[]).forEach(w=>{ if(w && w.weekStart){ const ws = normalizeWeekStart(w.weekStart); map[ws] = {...w, weekStart: ws}; } });
  return Object.values(map);
}
// قيم قديمة كانت متسجلة بأخطاء إملائية
const LEGACY_VALUES = { 'أحضر':'أخضر', 'غيرذلك':'غير ذلك', 'النولة':'النوالة' };
const fixLegacy = v => (typeof v === 'string' && LEGACY_VALUES[v]) ? LEGACY_VALUES[v] : v;
const isGreenKind = k => k === 'أخضر' || k === 'أحضر';

// تحميل جداول الأسعار (يومي/أسبوعي/موسمي) — بيتنادى أول ما التطبيق يفتح
async function loadPriceTables(){
  const rows = await apiFetch('/api/prices');
  const priceDays = rows.filter(r=>r.scope==='day').map(r=>({ ...r.prices, day:r.week_start }));
  const weekMap = {};
  rows.filter(r=>r.scope==='week').forEach(r=>{ const ws = normalizeWeekStart(r.week_start); weekMap[ws] = { ...r.prices, weekStart: ws }; });
  const seasonRow = rows.find(r=>r.scope==='season');
  return { priceDays, priceWeeks: Object.values(weekMap), seasonPrices: seasonRow ? seasonRow.prices : null };
}
function getWeekRangeLabel(weekStart){
  const s = new Date(weekStart+'T00:00:00');
  const e = new Date(s); e.setDate(e.getDate()+6);
  const fmt = dt => dt.toLocaleDateString('ar-EG',{day:'numeric',month:'numeric'});
  return fmt(s)+' - '+fmt(e);
}
function isCurrentWeek(dateStr){ return getWeekStart(dateStr)===getWeekStart(todayStr()); }
function formatDateWithDay(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  const dayName = d.toLocaleDateString('ar-EG', {weekday:'long'});
  const md = d.toLocaleDateString('ar-EG', {day:'numeric', month:'numeric'});
  return dayName+' '+md;
}
function groupByWeek(entries){
  const map = {};
  entries.forEach(e=>{ const ws=getWeekStart(e.date); if(!map[ws]) map[ws]=[]; map[ws].push(e); });
  return Object.keys(map).sort((a,b)=>b.localeCompare(a)).map(ws=>({
    weekStart: ws, label: getWeekRangeLabel(ws),
    items: map[ws].slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''))
  }));
}

/* ---------------------------------------------------------- PDF GENERATION ---------------------------------------------------------- */
function pdfDocShell(innerHtml){
  return `
  <div style="direction:rtl; font-family:'Tajawal',sans-serif; width:760px; background:#fff; color:#23302B">
    <div style="background:#25422C; padding:22px 28px; display:flex; align-items:center; justify-content:space-between;">

      </div>
      <div style="color:#F6F3E9; font-size:12px; opacity:.8;">تاريخ الإصدار: ${todayStr()}</div>
    </div>
    <div style="padding:26px 28px;">${innerHtml}</div>
    <div style="padding:14px 28px; border-top:1px solid #eee; font-size:11px; color:#999;">تم إنشاؤه تلقائيًا بواسطة نظام نوالتي</div>
  </div>`;
}
// منع الأسماء/الملاحظات اللي فيها رموز زي < > من تكسير الـ PDF
function escHtml(v){ return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pdfTable(headers, rows){
  const th = headers.map(h=>`<th style="border:1px solid #DDE7CE; background:#DDE7CE; padding:8px; font-size:12px; text-align:right;">${escHtml(h)}</th>`).join('');
  const trs = rows.map(r=>`<tr>${r.map(c=>`<td style="border:1px solid #eee; padding:7px 8px; font-size:12px;">${escHtml(c)}</td>`).join('')}</tr>`).join('');
  return `<table style="width:100%; border-collapse:collapse; margin:10px 0 18px;"><thead><tr>${th}</tr></thead><tbody>${trs||`<tr><td colspan="${headers.length}" style="padding:14px; text-align:center; color:#999; font-size:12px;">لا توجد بيانات</td></tr>`}</tbody></table>`;
}
async function renderHtmlToPdf(innerHtml){
  const container = document.createElement('div');
  container.style.position='fixed'; container.style.left='-99999px'; container.style.top='0'; container.style.zIndex='-1';
  container.innerHTML = pdfDocShell(innerHtml);
  document.body.appendChild(container);
  let canvas, breaks, cssW, cssH;
  try{
    const target = container.firstElementChild;
    const rect = target.getBoundingClientRect();
    cssW = rect.width; cssH = rect.height;
    // أماكن ينفع نقطع الصفحة عندها من غير ما نقسم صف في نص الجدول
    breaks = [...target.querySelectorAll('tr, table, div')].map(el=>el.getBoundingClientRect().bottom - rect.top).filter(b=>b>0).sort((a,b)=>a-b);
    // الكشوف الطويلة جدًا: نقلل الدقة عشان الصورة ماتعديش أقصى حجم يسمح بيه المتصفح
    const scale = Math.max(0.6, Math.min(2, 30000 / Math.max(cssH,1)));
    canvas = await html2canvas(target, {scale, backgroundColor:'#ffffff', useCORS:true});
  } finally {
    document.body.removeChild(container);
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const pxScale = canvas.width / cssW;               // بكسل الصورة لكل بكسل CSS
  const pagePx = cssW * pageHeight / pageWidth;      // طول الصفحة بوحدات CSS
  let start = 0, first = true;
  while(start < cssH - 1){
    let end = Math.min(start + pagePx, cssH);
    if(end < cssH){
      const candidates = breaks.filter(b => b > start + pagePx*0.5 && b <= end);
      if(candidates.length) end = candidates[candidates.length-1];
    }
    const slice = document.createElement('canvas');
    slice.width = canvas.width;
    slice.height = Math.ceil((end - start) * pxScale);
    const ctx = slice.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas, 0, Math.floor(start*pxScale), canvas.width, slice.height, 0, 0, canvas.width, slice.height);
    if(!first) pdf.addPage();
    pdf.addImage(slice.toDataURL('image/png'), 'PNG', 0, 0, pageWidth, (end-start) * pageWidth / cssW);
    first = false;
    start = end;
  }
  return pdf;
}
async function downloadPdf(innerHtml, filename){
  const pdf = await renderHtmlToPdf(innerHtml);
  pdf.save(filename);
}
async function sharePdf(innerHtml, filename){
  const pdf = await renderHtmlToPdf(innerHtml);
  const blob = pdf.output('blob');
  const file = new File([blob], filename, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:filename}); return; }catch(e){ /* fall through */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  window.open('https://wa.me/','_blank');
}

// تكملة أي تسعيرة قديمة ناقصة بالقيم الافتراضية عشان صفحة التسعير ماتقعش
function withPriceDefaults(p){
  p = p || {};
  return {...DEFAULT_PRICES, ...p,
    niswan: {...DEFAULT_PRICES.niswan, ...(p.niswan||{})},
    takhrit: {...DEFAULT_PRICES.takhrit, ...(p.takhrit||{})},
    sales: {...DEFAULT_PRICES.sales, ...(p.sales||{})}};
}
function getPriceSetForDate(db, dateStr){
  const dayMatch = (db.priceDays||[]).find(p=>p.day===dateStr);
  if(dayMatch) return dayMatch;
  const ws = getWeekStart(dateStr);
  const weekMatch = (db.priceWeeks||[]).find(p=>p.weekStart===ws);
  if(weekMatch) return weekMatch;
  // أسبوع ملهوش تسعير → ياخد سعر آخر أسبوع متسعّر قبله، وبعدين الموسمي، وبعدين الافتراضي
  // (الأسعار بتتحسب وقت العرض، فأي تعديل في تسعيرة أسبوع بيعدّل الكشوف القديمة والربح وكل الأقسام)
  const candidates = (db.priceWeeks||[]).filter(p=>p.weekStart<ws).sort((a,b)=> b.weekStart.localeCompare(a.weekStart));
  if(candidates[0]) return candidates[0];
  if(db.seasonPrices) return db.seasonPrices;
  return {...DEFAULT_PRICES, weekStart:ws};
}

                <td key={col.key} className="py-2 px-3">

                    ? <FieldInput field={own} value={draft[col.key]} onChange={v=>{ const next = {...draft,[col.key]:v}; setDraft(getRowColumns ? fixSelectValues(next, getRowColumns(next)) : next); }}/>
                    : (col.render ? col.render(row, person || null) : (col.type==='checkbox' ? (row[col.key]?'✔':'—') : (col.type==='date' ? formatDateWithDay(row[col.key]) : (col.type==='number' ? (row[col.key]===''||row[col.key]===undefined||row[col.key]===null?'—':num(row[col.key])) : (row[col.key]===undefined||row[col.key]===''?'—':row[col.key]))))))
                  }
                </td>
                );
              })}
              <td className="py-2 px-3 whitespace-nowrap">
                {isEd ? (
                  <div className="flex items-center gap-2">
                    <button onClick={save} className="text-leaf-mid"><Icon name="check" className="w-4 h-4"/></button>
                    <button onClick={cancel} className="text-ink/40 text-xs">إلغاء</button>
                  </div>

                  <div className="flex items-center gap-2">
                    <button onClick={()=>startEdit(row)} className="text-ink/40 hover:text-leaf-deep"><Icon name="edit" className="w-4 h-4"/></button>
                    <button onClick={()=>onDelete(row.id)} className="text-rust/60 hover:text-rust"><Icon name="trash" className="w-4 h-4"/></button>
                  </div>
                )}
              </td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function getPersonWeeklyConfig(person, dateStr){
  const list = normalizeWeeklyPrices(person && (person.weeklyPrices || person.weekly_prices));
  if(list.length === 0) return null;
  const ws = getWeekStart(dateStr || todayStr());
  const sorted = list.sort((a,b) => (b.weekStart||'').localeCompare(a.weekStart||''));
  // نفس الأسبوع، وإلا آخر أسبوع متسعّر قبله — ومش بنطبّق سعر أسبوع جاي على عمليات قديمة
  return sorted.find(w => w.weekStart === ws) || sorted.find(w => w.weekStart <= ws) || null;
}

/* ---------------------------------------------------------- PERSON WEEKLY PRICING ---------------------------------------------------------- */
function PersonWeeklyPricing({ person, personType, onSavePrices }){
  const [weekStart, setWeekStart] = useState(getWeekStart(todayStr()));
  const items = personType === 'jalab' 
    ? ['فرنساوي', 'بلدي', 'غير ذلك', 'عام']
    : ['قطع (أولى)', 'قطع (ثانية)', 'كاسات (أولى)', 'كاسات (ثانية)', 'قرص (أولى)', 'قرص (ثانية)', 'حشو (أولى)', 'حشو (ثانية)', 'شرايح (أولى)', 'شرايح (ثانية)', 'حدوة (أولى)', 'حدوة (ثانية)', 'فرنساوي', 'بلدي', 'فرزة'];

  const existingWeek = (person.weeklyPrices || []).find(w => w.weekStart === weekStart);
  const activeConfig = getPersonWeeklyConfig(person, weekStart);
  const initialPrices = existingWeek ? {...existingWeek.prices} : (activeConfig ? {...activeConfig.prices} : {});
  const initialDiscount = existingWeek ? (existingWeek.discount || 0) : (activeConfig ? (activeConfig.discount || 0) : 0);

  const [draftPrices, setDraftPrices] = useState(initialPrices);
  const [discount, setDiscount] = useState(initialDiscount);

  useEffect(()=>{
    const ex = (person.weeklyPrices || []).find(w => w.weekStart === weekStart);
    const act = getPersonWeeklyConfig(person, weekStart);
    setDraftPrices(ex ? {...ex.prices} : (act ? {...act.prices} : {}));
    setDiscount(ex ? (ex.discount || 0) : (act ? (act.discount || 0) : 0));
  }, [weekStart, person]);

  async function save(){
    const copyPrices = (person.weeklyPrices || []).filter(w => w.weekStart !== weekStart);
    const updated = [...copyPrices, { weekStart, prices: draftPrices, discount: parseFloat(discount)||0 }];
    try{
      await onSavePrices(updated);
      alert('تم حفظ تسعير أسبوع ' + getWeekRangeLabel(weekStart) + ' الخاص بـ ' + person.name);
    }catch(e){ alert('ماتحفظش التسعير: ' + e.message); }
  }

  async function deleteWeek(ws){
    if(!confirm('هل أنت متأكد من مسح تسعير هذا الأسبوع؟')) return;
    const updated = (person.weeklyPrices || []).filter(w => w.weekStart !== ws);
    try{ await onSavePrices(updated); }catch(e){ alert('ماتمسحش التسعير: ' + e.message); }
  }

  const savedWeeks = (person.weeklyPrices || []).slice().sort((a,b) => (b.weekStart||'').localeCompare(a.weekStart||''));

  return (
    <div className="bg-white rounded-2xl shadow-card border border-leaf-line/30 p-5 mt-6 rise">
      <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
        <div>
          <h3 className="font-bold text-leaf-deep text-base">جدول التسعير الأسبوعي الخاص بـ ({person.name})</h3>
          <p className="text-xs text-ink/50">حدد الأسعار ونسبة الخصم الخاصة بهذا الشخص لكل أسبوع</p>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-xs text-ink/60 font-bold">إضافة/تعديل أسبوع:</label>
          <input type="date" onChange={e=>setWeekStart(getWeekStart(e.target.value))} className="rounded-xl border border-leaf-line px-2 py-1 text-xs num"/>
          <span className="text-xs text-leaf-deep font-bold bg-leaf-pale/60 px-2 py-1 rounded-lg">{getWeekRangeLabel(weekStart)}</span>
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mb-4 p-4 border border-leaf-line/20 rounded-xl bg-leaf-pale/10">
        {items.map(it => (
          <div key={it}>
            <label className="block text-xs text-ink/60 font-bold mb-1">{it} ({personType==='jalab'||it==='فرنساوي'||it==='بلدي'||it==='فرزة'?'كوز':'كيلو'})</label>
            <input type="number" value={draftPrices[it] !== undefined ? draftPrices[it] : ''}
              onChange={e => setDraftPrices({...draftPrices, [it]: e.target.value === '' ? '' : parseFloat(e.target.value)})}
              placeholder="السعر" className="w-full rounded-lg border border-leaf-line px-2.5 py-1.5 text-sm num"/>
          </div>
        ))}
        {personType !== 'jalab' && (
          <div>
            <label className="block text-xs font-bold text-rust mb-1">نسبة الخصم %</label>
            <input type="number" value={discount} onChange={e=>setDiscount(e.target.value)}
              placeholder="%" className="w-full rounded-lg border border-rust/40 px-2.5 py-1.5 text-sm num text-rust font-bold"/>
          </div>
        )}
        <div className="col-span-full mt-2">
          <button onClick={save} className="bg-leaf-deep hover:bg-leaf-mid text-cream text-xs rounded-xl px-5 py-2.5 font-bold flex items-center gap-2">
            <Icon name="check" className="w-4 h-4"/>حفظ أسعار هذا الأسبوع
          </button>
        </div>
      </div>

      {savedWeeks.length > 0 && (
        <div className="mt-6">
          <h4 className="font-bold text-sm text-leaf-deep mb-3 border-b border-leaf-line/20 pb-2">الأسابيع المحفوظة سابقاً:</h4>
          <div className="overflow-x-auto rounded-xl border border-leaf-line/20">
            <table className="w-full text-xs text-right">
              <thead className="bg-cream/80 text-leaf-deep border-b border-leaf-line/30">
                <tr>
                  <th className="p-2">تاريخ الأسبوع</th>
                  {items.map(it=><th key={it} className="p-2">{it}</th>)}
                  {personType !== 'jalab' && <th className="p-2 text-rust">الخصم %</th>}
                  <th className="p-2">إجراء</th>
                </tr>
              </thead>
              <tbody>
                {savedWeeks.map(w => (
                  <tr key={w.weekStart} className="border-b border-leaf-line/10 hover:bg-cream/30">
                    <td className="p-2 font-bold num text-leaf-deep">{getWeekRangeLabel(w.weekStart)}</td>
                    {items.map(it=><td key={it} className="p-2 num">{w.prices[it] !== undefined && w.prices[it] !== '' ? w.prices[it] : '—'}</td>)}
                    {personType !== 'jalab' && <td className="p-2 num font-bold text-rust">{w.discount ? w.discount+'%' : '0%'}</td>}
                    <td className="p-2">
                      <div className="flex items-center gap-2">
                        <button onClick={()=>{setWeekStart(w.weekStart);}} className="text-leaf-mid hover:text-leaf-deep" title="تعديل"><Icon name="edit" className="w-4 h-4"/></button>
                        <button onClick={()=>deleteWeek(w.weekStart)} className="text-rust/60 hover:text-rust" title="حذف"><Icon name="trash" className="w-4 h-4"/></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// لما نوع الكارتة يتغير (مصنع ↔ أخضر) أي اختيار مش موجود في القائمة الجديدة يرجع لأول اختيار
function fixSelectValues(form, cols){
  const next = {...form};
  cols.forEach(c=>{
    if(c.type !== 'select' || !c.options || !c.options.length) return;
    const vals = c.options.map(o=> typeof o==='object' ? o.value : o);
    if(!vals.includes(next[c.key])) next[c.key] = vals[0];
  });
  return next;
}

// دمج أعمدة نوعين من الكروت (مصنع + أخضر) في جدول واحد
function mergeColumns(a, b){
  const out = a.map(c=>({...c}));
  b.forEach((c, i)=>{
    const ex = out.find(x=>x.key===c.key);
    if(ex){ if(ex.label !== c.label) ex.label = ex.label + ' / ' + c.label; return; }
    const prevKey = i>0 ? b[i-1].key : null;
    const at = prevKey ? out.findIndex(x=>x.key===prevKey) + 1 : 0;
    out.splice(at, 0, {...c});
  });
  return out;
}

/* ---------------------------------------------------------- PERSON ACCOUNT (generic) ---------------------------------------------------------- */
function PersonAccount({title, icon, personLabel, entryLabel, paymentsLabel, entryColumns, extraColumns, calcEntryTotal, db, people, setPeople, weeklyGrouping, weeklyQtyField, hideHeader, remote, verse, showWeeklyPricing, personType}){
  const [selected,setSelected]=useState(people[0]?.id || null);
  const [newName,setNewName]=useState('');
  const [entryForm,setEntryForm]=useState({});
  const [paymentForm,setPaymentForm]=useState({date:todayStr(), amount:'', note:''});
  const [statementFromDate,setStatementFromDate]=useState('');
  const [statementToDate,setStatementToDate]=useState('');
  const [busy,setBusy]=useState(false);

  // أعمدة فورم الإضافة بتتغير حسب اختيارك، لكن الجدول والكشف بيعرضوا أعمدة كل صف حسب بياناته هو
  const activeColumns = typeof entryColumns === 'function' ? entryColumns(entryForm) : entryColumns;
  const rowColumnsFor = row => typeof entryColumns === 'function' ? entryColumns(row||{}) : entryColumns;
  const tableColumns = typeof entryColumns === 'function'
    ? mergeColumns(entryColumns({kind:'مصنع'}), entryColumns({kind:'أخضر'}))
    : entryColumns;

  function defaultEntryForm(){
    const f = { date: todayStr() };
    const initialCols = typeof entryColumns === 'function' ? entryColumns(f) : entryColumns;
    initialCols.forEach(c=>{
      f[c.key] = c.type==='checkbox' ? false : (c.options ? c.options[0] : '');
    });
    return f;
  }

  useEffect(()=>{
    if(Object.keys(entryForm).length === 0){
      setEntryForm(defaultEntryForm());
    }
  }, []);

  const person = people.find(p=>p.id===selected) || null;

  async function addPerson(){
    if(!newName.trim()) return;
    if(remote){
      setBusy(true);
      try{
        const p = await remote.addPerson(newName.trim());
        setPeople([...people, p]); setNewName(''); setSelected(p.id);
      }catch(e){ alert(e.message); }
      setBusy(false);
    } else {
      const p = { id: uid(), name: newName.trim(), entries: [], payments: [] };
      setPeople([...people, p]); setNewName(''); setSelected(p.id);
    }
  }
  async function removePerson(id){
    if(!confirm('تأكيد حذف السجل بالكامل؟')) return;
    if(remote){
      try{ await remote.deletePerson(id); }catch(e){ alert(e.message); return; }
    }
    setPeople(people.filter(p=>p.id!==id));
    if(selected===id) setSelected(null);
  }
  function updateEntries(newEntries){ setPeople(people.map(p=> p.id===person.id ? {...p, entries:newEntries} : p)); }
  function updatePayments(newPayments){ setPeople(people.map(p=> p.id===person.id ? {...p, payments:newPayments} : p)); }

  async function addEntry(){
    if(!person) return;
    if(personType === 'worker' && (person.entries||[]).some(e=>e.date===entryForm.date)){
      alert('اليوم ده متسجل بالفعل للنفر ده — عدّل القيد الموجود بدل ما تضيف واحد جديد');
      return;
    }
    if(remote){
      setBusy(true);
      try{
        const e = await remote.addEntry(person.id, entryForm);
        updateEntries([e, ...person.entries]);
        setEntryForm(defaultEntryForm());
      }catch(err){ alert(err.message); }
      setBusy(false);
    } else {
      updateEntries([{id:uid(), ...entryForm}, ...person.entries]);
      setEntryForm(defaultEntryForm());
    }
  }
  async function editEntry(id, draft){
    if(remote){
      try{
        const updated = await remote.updateEntry(id, draft);
        updateEntries(person.entries.map(e=>e.id===id?updated:e));
      }catch(err){ alert(err.message); }
    } else {
      updateEntries(person.entries.map(e=>e.id===id?{...e,...draft}:e));
    }
  }
  async function removeEntry(id){
    if(!confirm('تأكيد الحذف؟')) return;
    if(remote){
      try{ await remote.deleteEntry(id); }catch(err){ alert(err.message); return; }
    }
    updateEntries(person.entries.filter(e=>e.id!==id));
  }

  async function addPayment(){
    if(!paymentForm.amount) return;
    if(remote){
      setBusy(true);
      try{
        const x = await remote.addPayment(person.id, paymentForm);
        updatePayments([x, ...person.payments]);
        setPaymentForm({date:todayStr(), amount:'', note:''});
      }catch(err){ alert(err.message); }
      setBusy(false);
    } else {
      updatePayments([{id:uid(), ...paymentForm, amount:parseFloat(paymentForm.amount)}, ...person.payments]);
      setPaymentForm({date:todayStr(), amount:'', note:''});
    }
  }
  async function editPayment(id, draft){
    if(remote){
      try{
        const updated = await remote.updatePayment(id, draft);
        updatePayments(person.payments.map(x=>x.id===id?updated:x));
      }catch(err){ alert(err.message); }
    } else {
      updatePayments(person.payments.map(x=>x.id===id?{...x,...draft}:x));
    }
  }
  async function removePayment(id){
    if(!confirm('تأكيد الحذف؟')) return;
    if(remote){
      try{ await remote.deletePayment(id); }catch(err){ alert(err.message); return; }
    }
    updatePayments(person.payments.filter(x=>x.id!==id));
  }

  function totals(p){
    const earned = p.entries.reduce((s,e)=> s+calcEntryTotal(e, getPriceSetForDate(db,e.date), p), 0);
    const paid = p.payments.reduce((s,x)=>s+(x.amount||0), 0);
    return {earned, paid, remaining: earned-paid};
  }

  function statementHtml(p){
    const filteredEntries = p.entries.filter(e => {
      if(statementFromDate && e.date < statementFromDate) return false;
      if(statementToDate && e.date > statementToDate) return false;
      return true;
    });
    const filteredPayments = p.payments.filter(x => {
      if(statementFromDate && x.date < statementFromDate) return false;
      if(statementToDate && x.date > statementToDate) return false;
      return true;
    });

    const earned = filteredEntries.reduce((s,e)=> s+calcEntryTotal(e, getPriceSetForDate(db,e.date), p), 0);
    const paid = filteredPayments.reduce((s,x)=> s+(parseFloat(x.amount)||0), 0);
    const remaining = earned - paid;
    // الرصيد المرحّل من قبل بداية الفترة
    const isBefore = d => !!statementFromDate && (d||'') < statementFromDate;
    const openingEarned = p.entries.filter(e=>isBefore(e.date)).reduce((s,e)=> s+calcEntryTotal(e, getPriceSetForDate(db,e.date), p), 0);
    const openingPaid = p.payments.filter(x=>isBefore(x.date)).reduce((s,x)=> s+(parseFloat(x.amount)||0), 0);
    const opening = openingEarned - openingPaid;
    const finalBalance = opening + remaining;
    const box = (label, value, bg, color) => `<div style="flex:1; background:${bg}; color:${color}; border-radius:12px; padding:12px; text-align:center;"><div style="font-size:11px; opacity:.85;">${label}</div><div style="font-weight:900; font-size:16px;">${num(value)}</div></div>`;

    const dateRangeLabel = (statementFromDate || statementToDate) 
      ? `الفترة: من ${statementFromDate||'البداية'} إلى ${statementToDate||'الآن'}` 
      : 'تقرير شامل';

    const entryHeaders = ['التاريخ', ...tableColumns.map(c=>c.label), 'الإجمالي الصافي'];
    const entryRows = filteredEntries.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>{
      const own = rowColumnsFor(e);
      return [
        formatDateWithDay(e.date),
        ...tableColumns.map(c=>{
          if(!own.some(x=>x.key===c.key)) return '—';
          const v = e[c.key];
          if(c.type==='checkbox') return v?'نعم':'لا';
          if(v===''||v===undefined||v===null) return '—';
          return c.type==='number' ? num(v) : v;
        }),
        num(calcEntryTotal(e, getPriceSetForDate(db,e.date), p))
      ];
    });
    const paymentRows = filteredPayments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>[formatDateWithDay(x.date), num(x.amount)+' جنيه', x.note||'—']);
    
    return `
      <div style="font-size:22px; font-weight:900; color:#25422C; margin-bottom:2px;">كشف حساب تفصيلي - ${personLabel}</div>
      <div style="font-size:16px; font-weight:700; color:#3D6144; margin-bottom:4px;">${escHtml(p.name)}</div>
      <div style="font-size:12px; font-weight:600; color:#666; margin-bottom:14px;">${dateRangeLabel}</div>
      <div style="font-size:13px; font-weight:700; color:#25422C; margin-bottom:6px;">ملخص حساب الفترة</div>
      <div style="display:flex; gap:12px; margin-bottom:18px;">
        ${statementFromDate ? box('رصيد سابق مرحّل (قبل '+statementFromDate+')', opening, '#EEF2EA', '#25422C') : ''}
        ${box('المستحق للفترة', earned, '#F8FAFC', '#23302B')}
        ${box('المدفوع للفترة', paid, '#FEF3C7', '#92400E')}
        ${box(statementFromDate ? 'الباقي الإجمالي (بالمرحّل)' : 'الباقي', finalBalance, finalBalance>0?'#DC2626':'#0F291E', '#fff')}
      </div>
      <div style="font-size:13px; font-weight:700; color:#25422C; margin-bottom:4px;">تفاصيل كل العمليات (${filteredEntries.length})</div>
      ${pdfTable(entryHeaders, entryRows)}
      <div style="font-size:13px; font-weight:700; color:#25422C; margin-bottom:4px;">تفاصيل ${paymentsLabel||'السلف / المدفوعات'} (${filteredPayments.length})</div>
      ${pdfTable(['التاريخ','المبلغ','ملاحظة'], paymentRows)}`;
  }

  const entryTableColumns = [
    ...tableColumns,
    ...(extraColumns||[]),
    {key:'_total', label:'الإجمالي بعد الخصم (الصافي)', computed:true, render: row=>num(calcEntryTotal(row, getPriceSetForDate(db,row.date), person))}
  ];

  return (
    <div className={hideHeader?'':'p-5 md:p-8'}>
      {!hideHeader && <VerseHeader text={verse}/>}
      {!hideHeader && <h1 className="font-display text-3xl text-leaf-deep mb-6 flex items-center gap-2"><Icon name={icon} className="w-7 h-7"/>{title}</h1>}

                  } else {
                    setPeople(people.map(p => p.id === person.id ? {...p, weeklyPrices} : p));
                  }
                }}/>
              )}
            </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------- REMOTE HELPERS (لتوصيل أي قسم "شخص+عمليات+دفعات" بسهولة) ---------------------------------------------------------- */
function makePersonRemote(apiKey, fieldMap){
  function mapEntryFromServer(e){
    const o = { id:e.id, date:e.entry_date };
    fieldMap.forEach(f=>{
      const v = e[f.server];
      o[f.local] = (v===null||v===undefined) ? (f.type==='bool'?false:'') : fixLegacy(v);
    });
    return o;
  }
  function mapEntryToServer(form){
    const o = { entry_date: form.date };
    fieldMap.forEach(f=>{
      let v = form[f.local];
      if(f.type==='bool') v = !!v;
      else if(f.type==='number') v = (v===''||v===null||v===undefined) ? null : v;
      o[f.server] = v;
    });
    return o;
  }
  const mapPaymentFromServer = x => ({ id:x.id, date:x.pay_date, amount:x.amount, note:x.note||'' });
  const mapPaymentToServer = f => ({ pay_date:f.date, amount: parseFloat(f.amount)||0, note: f.note||'' });

  return {
    load: async ()=>{
      const rows = await apiFetch('/api/'+apiKey);
      return rows.map(row=>({ id:row.id, name:row.name, weeklyPrices: normalizeWeeklyPrices(row.weeklyPrices || row.weekly_prices), entries:(row.entries||[]).map(mapEntryFromServer), payments:(row.payments||[]).map(mapPaymentFromServer) }));
    },
    addPerson: async (name)=>{
      const p = await apiFetch('/api/'+apiKey, {method:'POST', body:JSON.stringify({name})});
      return { id:p.id, name:p.name, entries:[], payments:[] };
    },
    deletePerson: async (id)=>{ await apiFetch(`/api/${apiKey}/${id}`, {method:'DELETE'}); },
    addEntry: async (personId, form)=>{
      const e = await apiFetch(`/api/${apiKey}/${personId}/entries`, {method:'POST', body:JSON.stringify(mapEntryToServer(form))});
      return mapEntryFromServer(e);
    },
    updateEntry: async (entryId, draft)=>{
      const e = await apiFetch(`/api/${apiKey}-entries/${entryId}`, {method:'PUT', body:JSON.stringify(mapEntryToServer(draft))});
      return mapEntryFromServer(e);
    },
    deleteEntry: async (entryId)=>{ await apiFetch(`/api/${apiKey}-entries/${entryId}`, {method:'DELETE'}); },
    addPayment: async (personId, form)=>{
      const x = await apiFetch(`/api/${apiKey}/${personId}/payments`, {method:'POST', body:JSON.stringify(mapPaymentToServer(form))});
      return mapPaymentFromServer(x);
    },
    updatePayment: async (paymentId, draft)=>{
      const x = await apiFetch(`/api/${apiKey}-payments/${paymentId}`, {method:'PUT', body:JSON.stringify(mapPaymentToServer(draft))});
      return mapPaymentFromServer(x);
    },
    deletePayment: async (paymentId)=>{ await apiFetch(`/api/${apiKey}-payments/${paymentId}`, {method:'DELETE'}); },
    saveWeeklyPrices: async (personId, weeklyPrices)=>{
      await apiFetch(`/api/${apiKey}/${personId}`, {method:'PUT', body:JSON.stringify({ weekly_prices: weeklyPrices })});
    },
  };
}

function ConnectedPersonPage({title, icon, personLabel, entryLabel, paymentsLabel, entryColumns, extraColumns, calcEntryTotal, remote, db, weeklyGrouping, weeklyQtyField, hideHeader, verse, showWeeklyPricing, personType}){
  const [people,setPeople] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');

  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{ setPeople(await remote.load()); }catch(e){ setError(e.message); }
    setLoading(false);
  }

  if(loading) return <div className="p-8 text-center text-ink/50">بيحمّل البيانات من السيرفر...</div>;
  if(error) return (
    <div className="p-8 text-center">
      <p className="text-rust mb-3">حصل خطأ: {error}</p>
      <button onClick={load} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">حاول تاني</button>
    </div>
  );

  return <PersonAccount title={title} icon={icon} personLabel={personLabel} entryLabel={entryLabel} paymentsLabel={paymentsLabel}
    entryColumns={entryColumns} extraColumns={extraColumns} calcEntryTotal={calcEntryTotal}
    db={db} people={people} setPeople={setPeople} remote={remote}
    weeklyGrouping={weeklyGrouping} weeklyQtyField={weeklyQtyField} hideHeader={hideHeader} verse={verse}
    showWeeklyPricing={showWeeklyPricing} personType={personType}/>;
}

function mapJalabEntryFromServer(e){ return { id:e.id, date:e.entry_date, kuz:e.kuz, price:(e.price===null||e.price===undefined)?'':e.price, itemType:fixLegacy(e.item_type||'') }; }

// حساب توريد الجلاب: سعر مكتوب في القيد ← تسعيرة الجلاب الخاصة بالأسبوع (للنوع ثم «عام») ← سعر الكوز العام
function calcJalabEntry(e, ps, person){
  const kuz = parseFloat(e.kuz) || 0;
  const manual = e.price;
  if(manual !== '' && manual !== null && manual !== undefined && !isNaN(manual)) return kuz * parseFloat(manual);
  const wk = getPersonWeeklyConfig(person, e.date);
  const pick = v => (v !== undefined && v !== '' && v !== null && !isNaN(v)) ? parseFloat(v) : null;
  if(wk && wk.prices){
    const own = pick(wk.prices[fixLegacy(e.itemType)]);
    if(own !== null) return kuz * own;
    const general = pick(wk.prices['عام']);
    if(general !== null) return kuz * general;
  }
  return kuz * (parseFloat(ps.jalabPerKuz) || 0);
}
function mapJalabPaymentFromServer(x){ return { id:x.id, date:x.pay_date, amount:x.amount, note:x.note||'' }; }

function JalabaPage({db,setDb}){
  const [people,setPeople] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');

  useEffect(()=>{ load(); }, []);

  async function load(){
    setLoading(true); setError('');
    try{
      const rows = await apiFetch('/api/jalaba');
      setPeople(rows.map(row=>({
        id: row.id, name: row.name, weeklyPrices: normalizeWeeklyPrices(row.weeklyPrices || row.weekly_prices),
        entries: (row.entries||[]).map(mapJalabEntryFromServer),
        payments: (row.payments||[]).map(mapJalabPaymentFromServer),
      })));
    }catch(e){ setError(e.message); }
    setLoading(false);
  }

  const entryColumns = [
    {key:'kuz', label:'عدد الكوازين', type:'number'},
    {key:'itemType', label:'نوع الخرشوف', type:'select', options:['فرنساوي','بلدي','غير ذلك']},
    {key:'price', label:'سعر الكوز (اختياري)', type:'number'},
  ];
  const calcEntryTotal = calcJalabEntry;

  const remote = {
    addPerson: async (name)=>{
      const p = await apiFetch('/api/jalaba', {method:'POST', body:JSON.stringify({name})});
      return { id:p.id, name:p.name, entries:[], payments:[] };
    },
    deletePerson: async (id)=>{ await apiFetch('/api/jalaba/'+id, {method:'DELETE'}); },
    addEntry: async (personId, form)=>{
      const e = await apiFetch(`/api/jalaba/${personId}/entries`, {method:'POST', body:JSON.stringify({
        entry_date: form.date, kuz: form.kuz || 0, price: (form.price===''||form.price==null)?null:form.price, item_type: form.itemType||null
      })});
      return mapJalabEntryFromServer(e);
    },
    updateEntry: async (entryId, draft)=>{
      const e = await apiFetch('/api/jalaba-entries/'+entryId, {method:'PUT', body:JSON.stringify({
        entry_date: draft.date, kuz: draft.kuz || 0, price: (draft.price===''||draft.price==null)?null:draft.price, item_type: draft.itemType||null
      })});
      return mapJalabEntryFromServer(e);
    },
    deleteEntry: async (entryId)=>{ await apiFetch('/api/jalaba-entries/'+entryId, {method:'DELETE'}); },
    addPayment: async (personId, form)=>{
      const x = await apiFetch(`/api/jalaba/${personId}/payments`, {method:'POST', body:JSON.stringify({
        pay_date: form.date, amount: parseFloat(form.amount)||0, note: form.note||''
      })});
      return mapJalabPaymentFromServer(x);
    },
    updatePayment: async (paymentId, draft)=>{
      const x = await apiFetch('/api/jalaba-payments/'+paymentId, {method:'PUT', body:JSON.stringify({
        pay_date: draft.date, amount: parseFloat(draft.amount)||0, note: draft.note||''
      })});
      return mapJalabPaymentFromServer(x);
    },
    deletePayment: async (paymentId)=>{ await apiFetch('/api/jalaba-payments/'+paymentId, {method:'DELETE'}); },
    saveWeeklyPrices: async (personId, weeklyPrices)=>{
      await apiFetch('/api/jalaba/'+personId, {method:'PUT', body:JSON.stringify({ weekly_prices: weeklyPrices })});
    },
  };

  if(loading) return <div className="p-8 text-center text-ink/50">بيحمّل بيانات الجلابة من السيرفر...</div>;
  if(error) return (
    <div className="p-8 text-center">
      <p className="text-rust mb-3">حصل خطأ: {error}</p>
      <button onClick={load} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">حاول تاني</button>
    </div>
  );

  return <PersonAccount title="الجلابة" icon="truck" personLabel="جلاب" entryLabel="التوريدات" paymentsLabel="الواصل / المدفوعات" showWeeklyPricing personType="jalab"
    verse="﴿اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَأَنزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجَ بِهِ مِنَ الثَّمَرَاتِ رِزْقًا لَّكُمْ﴾"
    entryColumns={entryColumns} calcEntryTotal={calcEntryTotal}
    db={db} people={people} setPeople={setPeople} remote={remote}
    weeklyGrouping weeklyQtyField={{key:'kuz',label:'كوازين'}}/>;
}

function RaseefPage({db,setDb}){
  const getEntryColumns = (form) => {
    const isGreen = isGreenKind(form.kind);
    const itemOptions = isGreen 
      ? ['فرنساوي', 'بلدي', 'فرزة'] 
      : ['قطع', 'كاسات', 'قرص', 'حشو', 'شرايح', 'حدوة'];
    const cols = [
      {key:'kind', label:'نوع التسليم', type:'select', options:['مصنع','أخضر']},
      {key:'itemType', label:'النوع', type:'select', options: itemOptions},
    ];

    if(!isGreen){
      cols.push({key:'grade', label:'الدرجة', type:'select', options:['درجة أولى', 'درجة ثانية']});
    }

    cols.push(
      {key:'quantity', label: isGreen ? 'الكمية (كوز)' : 'الكمية (كيلو)', type:'number'},
      {key:'price', label: isGreen ? 'سعر الكوز' : 'سعر الكيلو', type:'number'}
    );

    if(!isGreen){
      cols.push({key:'discount', label:'نسبة الخصم %', type:'number'});
    }
    cols.push({key:'note', label:'ملاحظة', type:'text'});
    return cols;
  };

  const extraColumns = [
    {key:'_priceDisplay', label:'السعر التلقائي/الفصلي', computed:true, render: (row, person) => {
      const details = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, 'purchase');
      if(details.missingPrice) return <span className="text-rust font-bold">بدون سعر</span>;
      return details.price > 0 ? num(details.price) : '—';
    }},
    {key:'_rawTotal', label:'الإجمالي قبل الخصم', computed:true, render: (row, person) => {
      const details = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, 'purchase');
      return details.isGreen ? '—' : num(details.rawTotal);
    }},
    {key:'_discount', label:'الخصم %', computed:true, render: (row, person) => {
      const details = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person, 'purchase');
      return details.isGreen ? '—' : (details.disc ? details.disc + '%' : '0%');
    }}
  ];

  const remote = makePersonRemote('raseef', [
    {local:'kind', server:'kind', type:'text'},
    {local:'itemType', server:'item_type', type:'text'},
    {local:'grade', server:'grade', type:'text'},
    {local:'quantity', server:'quantity', type:'number'},
    {local:'price', server:'price', type:'number'},
    {local:'discount', server:'discount', type:'number'},
    {local:'note', server:'note', type:'text'},
  ]);

  const calcEntryTotal = (e, ps, person) => {
    return getEntryPricingDetails(e, ps, person, 'purchase').netTotal;
  };

  return <ConnectedPersonPage title="المشتريات" icon="truck" personLabel="بائع" entryLabel="اضافة كارتة مشتريات" paymentsLabel="الواصل / المدفوع للبائع"
    verse="﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ إِلَّا أَن تَكُونَ تِجَارَةً عَن تَرَاضٍ مِّنكُمْ﴾"
    entryColumns={getEntryColumns}
    extraColumns={extraColumns}
    calcEntryTotal={calcEntryTotal}
    remote={remote} db={db}
    showWeeklyPricing personType="raseef"
    weeklyGrouping/>;
}

function makeSakinaWorkersRemote(sakinaId){
  function mapEntryFromServer(e){ return { id:e.id, date:e.entry_date, itemType:e.item_type||'', pieces:e.pieces, tookPeel:!!e.took_peel }; }
  function mapEntryToServer(f){ return { entry_date:f.date, item_type:f.itemType||null, pieces:f.pieces||0, took_peel:!!f.tookPeel }; }
  const mapPaymentFromServer = x => ({ id:x.id, date:x.pay_date, amount:x.amount, note:x.note||'' });
  const mapPaymentToServer = f => ({ pay_date:f.date, amount: parseFloat(f.amount)||0, note: f.note||'' });
  return {
    load: async ()=>{
      const rows = await apiFetch(`/api/sakinas/${sakinaId}/workers`);
      return rows.map(row=>({ id:row.id, name:row.name, entries:(row.entries||[]).map(mapEntryFromServer), payments:(row.payments||[]).map(mapPaymentFromServer) }));
    },
    addPerson: async (name)=>{
      const p = await apiFetch(`/api/sakinas/${sakinaId}/workers`, {method:'POST', body:JSON.stringify({name})});
      return { id:p.id, name:p.name, entries:[], payments:[] };
    },
    deletePerson: async (id)=>{ await apiFetch('/api/sakina-workers/'+id, {method:'DELETE'}); },
    addEntry: async (personId, form)=>{
      const e = await apiFetch(`/api/sakina-workers/${personId}/entries`, {method:'POST', body:JSON.stringify(mapEntryToServer(form))});
      return mapEntryFromServer(e);
    },
    updateEntry: async (entryId, draft)=>{
      const e = await apiFetch(`/api/sakina-worker-entries/${entryId}`, {method:'PUT', body:JSON.stringify(mapEntryToServer(draft))});
      return mapEntryFromServer(e);
    },
    deleteEntry: async (entryId)=>{ await apiFetch(`/api/sakina-worker-entries/${entryId}`, {method:'DELETE'}); },
    addPayment: async (personId, form)=>{
      const x = await apiFetch(`/api/sakina-workers/${personId}/payments`, {method:'POST', body:JSON.stringify(mapPaymentToServer(form))});
      return mapPaymentFromServer(x);
    },
    updatePayment: async (paymentId, draft)=>{
      const x = await apiFetch(`/api/sakina-worker-payments/${paymentId}`, {method:'PUT', body:JSON.stringify(mapPaymentToServer(draft))});
      return mapPaymentFromServer(x);
    },
    deletePayment: async (paymentId)=>{ await apiFetch(`/api/sakina-worker-payments/${paymentId}`, {method:'DELETE'}); },
  };
}

function SakinaPage({db,setDb}){
  const [sakinas,setSakinas] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  const [selectedSakina,setSelectedSakina] = useState(null);
  const [newSakina,setNewSakina] = useState('');

  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{
      const rows = await apiFetch('/api/sakinas');
      setSakinas(rows);
      if(rows.length) setSelectedSakina(prev => prev || rows[0].id);
    }catch(e){ setError(e.message); }
    setLoading(false);
  }
  async function addSakina(){
    if(!newSakina.trim()) return;
    try{
      const s = await apiFetch('/api/sakinas', {method:'POST', body:JSON.stringify({name:newSakina.trim()})});
      setSakinas([...sakinas, s]); setNewSakina(''); setSelectedSakina(s.id);
    }catch(e){ alert(e.message); }
  }
  async function removeSakina(id){
    if(!confirm('تأكيد حذف النوالة بكل عاملاتها؟')) return;
    try{ await apiFetch('/api/sakinas/'+id, {method:'DELETE'}); }catch(e){ alert(e.message); return; }
    setSakinas(sakinas.filter(s=>s.id!==id));
    if(selectedSakina===id) setSelectedSakina(null);
  }

  const entryColumns = [
    {key:'itemType', label:'النوع', type:'select', options:['هارت','كاسات','حشو']},
    {key:'pieces', label:'عدد القطع', type:'number'},
    {key:'tookPeel', label:'أخذت القشر', type:'checkbox'},
  ];
  const calcEntryTotal = (e,ps)=> (e.pieces||0)/1000 * ((ps.niswan[e.itemType]||{})[e.tookPeel?'withPeel':'withoutPeel']||0);

  const sakina = sakinas.find(s=>s.id===selectedSakina) || null;

  if(loading) return <div className="p-8 text-center text-ink/50">بيحمّل النوالات من السيرفر...</div>;
  if(error) return (
    <div className="p-8 text-center">
      <p className="text-rust mb-3">حصل خطأ: {error}</p>
      <button onClick={load} className="text-sm px-4 py-2 rounded-lg border border-leaf-line text-leaf-deep hover:bg-leaf-pale">حاول تاني</button>
    </div>
  );

  return (
    <div className="p-5 md:p-8">
      <VerseHeader text="﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَى أَهْلِهَا﴾"/>
      <h1 className="font-display text-3xl text-leaf-deep mb-2 flex items-center gap-2"><Icon name="leaf" className="w-7 h-7"/>النوالات</h1>
      <p className="text-ink/50 text-sm mb-6">كل نوالة هي مكان تقشير له عاملاته الخاصين بيه.</p>
      <div className="flex items-center gap-2 flex-wrap mb-6">
        {sakinas.map(s=>(
          <button key={s.id} onClick={()=>setSelectedSakina(s.id)}
            className={`px-4 py-2 rounded-full text-sm font-bold ${selectedSakina===s.id?'bg-leaf-deep text-cream':'bg-white border border-leaf-line text-ink/70'}`}>
            {s.name}
          </button>
        ))}
        <div className="flex items-center gap-1">
          <input value={newSakina} onChange={e=>setNewSakina(e.target.value)} placeholder="اسم نوالة جديدة" onKeyDown={e=>e.key==='Enter'&&addSakina()} className="rounded-lg border border-leaf-line px-3 py-2 text-sm w-40"/>
          <button onClick={addSakina} className="bg-leaf-deep text-cream rounded-lg px-3 py-2"><Icon name="plus" className="w-4 h-4"/></button>
        </div>
      </div>

      {sakinas.length===0 && <div className="bg-white border border-dashed border-leaf-line rounded-2xl p-10 text-center text-ink/50">ضيف أول نوالة عشان تبدأ تسجل العاملات فيها</div>}

      {sakina && (
        <div>
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-xl font-bold text-leaf-deep">عاملات: {sakina.name}</h2>
            <button onClick={()=>removeSakina(sakina.id)} className="text-rust text-xs flex items-center gap-1 hover:underline"><Icon name="trash" className="w-4 h-4"/>حذف النوالة</button>
          </div>
          <ConnectedPersonPage key={sakina.id} hideHeader personLabel="عاملة" entryLabel="عمليات التقشير" personType="sakina_worker"
            entryColumns={entryColumns} calcEntryTotal={calcEntryTotal}
            remote={makeSakinaWorkersRemote(sakina.id)} db={db}/>
        </div>
      )}
    </div>
  );
}

// mode: 'sales' (المصانع) أو 'purchase' (المشتريات/الرصيف)
function getEntryPricingDetails(e, ps, person, mode='sales'){
  const isGreen = isGreenKind(e.kind);
  const qty = parseFloat(e.tons || e.quantity || e.kuz || 0);
  
  const gradeSuffix = (!isGreen && e.grade === 'درجة ثانية') ? ' (ثانية)' : ((!isGreen && e.grade === 'درجة أولى') ? ' (أولى)' : (!isGreen ? ' (أولى)' : ''));
  const effectiveItemType = isGreen ? e.itemType : ((e.itemType||'') + gradeSuffix);

  const personWeek = getPersonWeeklyConfig(person, e.date);
  const personPrice = (personWeek && personWeek.prices && personWeek.prices[effectiveItemType] !== undefined && personWeek.prices[effectiveItemType] !== '' && !isNaN(personWeek.prices[effectiveItemType])) 
    ? parseFloat(personWeek.prices[effectiveItemType]) 
    : null;
  const personDiscount = (personWeek && personWeek.discount !== undefined && personWeek.discount !== '' && !isNaN(personWeek.discount)) 
    ? parseFloat(personWeek.discount) 
    : null;

  const rawManualPrice = e.pricePerTon !== undefined ? e.pricePerTon : e.price;
  const hasManualPrice = (rawManualPrice !== '' && rawManualPrice != null && !isNaN(rawManualPrice));
  // السعر العام من صفحة التسعير بيتطبق على المبيعات بس — المشتريات لازم سعر البائع أو سعر مكتوب
  const salesTable = ps.sales || {};
  const globalFallbackPrice = mode !== 'sales' ? 0
    : (salesTable[effectiveItemType] !== undefined && salesTable[effectiveItemType] !== '' ? parseFloat(salesTable[effectiveItemType]) || 0
      : (isGreen && salesTable['أخضر'] !== undefined ? parseFloat(salesTable['أخضر']) || 0 : 0));

  
  const price = hasManualPrice 
    ? parseFloat(rawManualPrice) 
    : (personPrice !== null ? personPrice : globalFallbackPrice);

  const hasManualDiscount = (e.discount !== '' && e.discount != null && !isNaN(e.discount));
  const disc = isGreen 
    ? 0 
    : (hasManualDiscount ? parseFloat(e.discount) : (personDiscount !== null ? personDiscount : 0));

  const rawTotal = qty * price;
  const netTotal = isGreen ? rawTotal : rawTotal * (1 - disc / 100);

  const missingPrice = !hasManualPrice && personPrice === null && globalFallbackPrice === 0;
  return { isGreen, qty, price, hasManualPrice, disc, hasManualDiscount, rawTotal, netTotal, missingPrice };
}

function SalesPage({db,setDb}){
  const getEntryColumns = (form) => {
    const isGreen = isGreenKind(form.kind);
    const itemOptions = isGreen 
      ? ['فرنساوي', 'بلدي', 'فرزة'] 
      : ['قطع', 'كاسات', 'قرص', 'حشو', 'شرايح', 'حدوة'];

    const cols = [
      {key:'kind', label:'نوع التسليم', type:'select', options:['مصنع','أخضر']},
      {key:'itemType', label:'النوع', type:'select', options: itemOptions},
    ];

    if(!isGreen){
      cols.push({key:'grade', label:'الدرجة', type:'select', options:['درجة أولى', 'درجة ثانية']});
    }

    cols.push(
      {key:'tons', label: isGreen ? 'العدد' : 'الكمية (كيلو)', type:'number'},
      {key:'pricePerTon', label: isGreen ? 'سعر الكوز' : 'سعر الكيلو', type:'number'}
    );

    if(!isGreen){
      cols.push({key:'discount', label:'نسبة الخصم %', type:'number'});
    }

    return cols;
  };

  const extraColumns = [
    {key:'_priceDisplay', label:'السعر التلقائي/الفصلي', computed:true, render: (row, person) => {
      const details = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person);
      if(details.missingPrice) return <span className="text-rust font-bold">بدون سعر</span>;
      return details.price > 0 ? num(details.price) : '—';
    }},
    {key:'_rawTotal', label:'الإجمالي قبل الخصم', computed:true, render: (row, person) => {
      const details = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person);
      return details.isGreen ? '—' : num(details.rawTotal);
    }},
    {key:'_discount', label:'الخصم %', computed:true, render: (row, person) => {
      const details = getEntryPricingDetails(row, getPriceSetForDate(db, row.date), person);
      return details.isGreen ? '—' : (details.disc ? details.disc + '%' : '0%');
    }}
  ];

  const remote = makePersonRemote('factories', [
    {local:'kind', server:'kind', type:'text'},
    {local:'itemType', server:'item_type', type:'text'},
    {local:'grade', server:'grade', type:'text'},
    {local:'tons', server:'tons', type:'number'},
    {local:'pricePerTon', server:'price_per_ton', type:'number'},
    {local:'discount', server:'discount', type:'number'},
  ]);

  const calcEntryTotal = (e, ps, person) => {
    return getEntryPricingDetails(e, ps, person).netTotal;
  };

  return <ConnectedPersonPage title="المبيعات" icon="receipt" personLabel="مصنع/تاجر" entryLabel="اضافة كارتة مبيعات"
    verse="﴿وَمَا مِن دَابَّةٍ فِي الْأَرْضِ إِلَّا عَلَى اللَّهِ رِزْقُهَا﴾"
    entryColumns={getEntryColumns}
    extraColumns={extraColumns}
    calcEntryTotal={calcEntryTotal}
    remote={remote} db={db}
    showWeeklyPricing personType="factory"
    weeklyGrouping/>;
}

function mapExpenseFromServer(x){ return { id:x.id, date:x.expense_date, category:x.category, customCategory:x.custom_category||'', name:x.name||'', amount:x.amount }; }
function mapExpenseToServer(f){ return { expense_date:f.date, category:f.category, custom_category:f.customCategory||'', name:f.name||'', amount: parseFloat(f.amount)||0 }; }

function ExpensesPage({db,setDb}){
  const [tab,setTab]=useState('expenses');

  const [form,setForm] = useState({date:todayStr(), category:'أكل', customCategory:'', name:'', amount:''});
  const [expenses,setExpenses] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');

  useEffect(()=>{ load(); }, []);
  async function load(){
    setLoading(true); setError('');
    try{
      const rows = await apiFetch('/api/expenses');
      setExpenses(rows.map(mapExpenseFromServer));
    }catch(e){ setError(e.message); }
    setLoading(false);
  }

  async function add(){
    if(!form.amount) return;
    try{
      const x = await apiFetch('/api/expenses', {method:'POST', body:JSON.stringify(mapExpenseToServer(form))});
      setExpenses([mapExpenseFromServer(x), ...expenses]);
      setForm({date:todayStr(), category:'أكل', customCategory:'', name:'', amount:''});
    }catch(e){ alert(e.message); }

      const x = await apiFetch('/api/expenses/'+id, {method:'PUT', body:JSON.stringify(mapExpenseToServer(draft))});
      setExpenses(expenses.map(e=>e.id===id?mapExpenseFromServer(x):e));

    setExpenses(expenses.filter(x=>x.id!==id));

  async function add(){
    if(!form.partnerId || !form.amount) return;
